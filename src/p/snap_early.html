<script>
/* 13.66: the app opens with a picture of its home screen at once. While the app's script downloads and starts, the home screen as it
   looked last time is shown (saved by p/snap.js on this phone only; never in private mode or with an account). On a first visit:
   a calm splash with the app's icon instead of a half-built page. The app's script removes it as its very first step (the screen keeps
   the picture until the real app draws itself in the same frame), so nothing here is ever clickable. */
(function(){
  var d = document, de = d.documentElement, b = d.body, L = null, s = null;
  try { L = window['local' + 'Storage']; } catch (e) {}
  var hash = function(t){ var h = 5381, i; for (i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h; };
  try {
    if (L && L.getItem('fin-priv') !== '1' && !/[?&](go|share|v)=/.test(location.search) && !location.hash && !/\/admin\//.test(location.pathname)){
      s = JSON.parse(L.getItem('fin-snap') || 'null');
      var lk = (L.getItem('fin-lang') || '') + '|' + (navigator.language || ''), dk = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0;
      var h = hash(['fin-vals', 'fin-exp', 'fin-dsitems', 'fin-tab'].map(function(k){ return L.getItem(k) || ''; }).join('\u0001'));
      if (!s || s.v !== 1 || s.lk !== lk || s.dk !== dk || s.h !== h || !(Date.now() - s.at < 30 * 864e5) || typeof s.html !== 'string') s = null;
    }
  } catch (e) { s = null; }
  /* the page's own styles (the app adds more of its own while it runs; those are saved with the picture) */
  try { var ss = d.head.querySelectorAll('style,link[rel=stylesheet]'); for (var k = 0; k < ss.length; k++) ss[k].setAttribute('data-st', '1'); } catch (e) {}
  var keepH = [], keepB = [], i, first = b.firstChild;
  for (i = 0; i < de.attributes.length; i++) keepH.push([de.attributes[i].name, de.attributes[i].value]);
  for (i = 0; i < b.attributes.length; i++) keepB.push([b.attributes[i].name, b.attributes[i].value]);
  /* until the app starts, only the picture is shown (the page's own parts wait, hidden) */
  var st = d.createElement('style');
  st.textContent = 'body>:not([data-snap]):not(script):not(style){display:none!important}[data-snap] #hclock *{visibility:hidden}[data-snap]{pointer-events:none}'
    + '@keyframes finSp{0%,100%{opacity:.35}50%{opacity:1}}@keyframes finSk{0%{background-position:100% 0}100%{background-position:-50% 0}}@media (prefers-reduced-motion:reduce){[data-snap] img,[data-snap] i{animation:none!important}}';
  d.head.appendChild(st);
  if (s){
    try {
      (s.ha || []).forEach(function(a){ de.setAttribute(a[0], a[1]); });
      (s.ba || []).forEach(function(a){ b.setAttribute(a[0], a[1]); });
      b.insertAdjacentHTML('afterbegin', (s.css ? '<style>' + s.css + '</style>' : '') + s.html);
      for (var n = b.firstChild; n && n !== first; n = n.nextSibling) if (n.nodeType === 1) n.setAttribute('data-snap', '1'); else if (n.nodeType === 3) n.textContent = '';
    } catch (e) { s = null; while (b.firstChild && b.firstChild !== first) b.removeChild(b.firstChild); }
  }
  if (!s){
    /* 13.89: a first visit shows the shape of the home screen (grey blocks that shimmer) instead of an empty splash, so the
       screen looks alive from the first moment. Only shapes – no text, nothing clickable; the real screen replaces it. */
    var o = d.createElement('div'); o.setAttribute('data-snap', '1'); o.setAttribute('aria-hidden', 'true');
    var bx = function(css){ return '<i style="display:block;border-radius:12px;' + css + '"></i>'; };
    var sh = 'background:linear-gradient(90deg,#dce2eb 0,#eef2f7 40%,#dce2eb 80%) 0 0/300% 100%;animation:finSk 1.4s linear infinite;';
    var dk = 'background:rgba(255,255,255,.08);';
    var tiles = ''; for (var q = 0; q < 4; q++) tiles += bx(sh + 'height:96px;border-radius:18px');
    o.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:#eef1f6;overflow:hidden';
    o.innerHTML = '<div style="background:linear-gradient(180deg,#070D1E,#0E1830);padding:16px 16px 14px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' + bx(dk + 'width:150px;height:30px') + bx(dk + 'width:96px;height:36px;border-radius:12px') + '</div>'
      + bx(dk + 'height:42px;margin-top:14px;border-radius:14px') + '</div>'
      + '<div style="padding:26px 34px 0;max-width:620px;margin:0 auto">'
      + bx(sh + 'width:120px;height:30px;margin-inline-end:auto') + bx(sh + 'width:78%;height:14px;margin-top:14px;margin-inline-end:auto')
      + bx(sh + 'height:136px;margin-top:22px;border-radius:20px') + bx(sh + 'height:150px;margin-top:20px;border-radius:20px')
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px">' + tiles + '</div></div>'
      + '<div style="position:absolute;left:12px;right:12px;bottom:10px;height:72px;border-radius:22px;background:#0E1830"></div>';
    b.insertBefore(o, first);
  }
  window.__snapOff = function(){
    window.__snapOff = null;
    try { while (b.firstChild && b.firstChild !== first) b.removeChild(b.firstChild); st.remove(); } catch (e) {}
    try {
      for (var j = de.attributes.length - 1; j >= 0; j--) de.removeAttribute(de.attributes[j].name);
      keepH.forEach(function(a){ de.setAttribute(a[0], a[1]); });
      for (j = b.attributes.length - 1; j >= 0; j--) b.removeAttribute(b.attributes[j].name);
      keepB.forEach(function(a){ b.setAttribute(a[0], a[1]); });
    } catch (e) {}
  };
  /* the app never arrived (a lost connection): don't keep a picture of it on screen */
  setTimeout(function(){ if (window.__snapOff) window.__snapOff(); }, 20000);
})();
</script>
