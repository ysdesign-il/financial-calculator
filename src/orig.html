<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="copyright" content="© 2026 ysdesign-il. כל הזכויות שמורות.">
<title>מחשבון פיננסי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Heebo:wght@400;700&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F6; --surface:#FFFFFF; --field:#FFFFFF;
  --ink:#0E1A33; --ink-2:#56627A; --line:#DCE1EA;
  --navy:#0B1F3F; --hero-bg:#0B1F3F; --on-navy:#F3F6FC; --on-navy-2:#A9B8D3; --nav-line:rgba(255,255,255,.12);
  --brass:#C69A3E; --focus:#1F4FB8;
  --c1:#2A4A7F; --c2:#C69A3E; --c3:#B4533C; --c4:#8FA3C7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0A1226; --surface:#101B35; --field:#0C1630;
    --ink:#E7EDF8; --ink-2:#9AA9C5; --line:#22314F;
    --navy:#070E20; --hero-bg:#15284F;
    --brass:#E0B65A; --focus:#8FB0F5;
    --c1:#6C8FD6; --c2:#E0B65A; --c3:#E08A70; --c4:#5E7399;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0A1226; --surface:#101B35; --field:#0C1630;
  --ink:#E7EDF8; --ink-2:#9AA9C5; --line:#22314F;
  --navy:#070E20; --hero-bg:#15284F;
  --brass:#E0B65A; --focus:#8FB0F5;
  --c1:#6C8FD6; --c2:#E0B65A; --c3:#E08A70; --c4:#5E7399;
}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rail :focus-visible{outline-color:#E0B65A}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.rail{background:var(--navy);color:var(--on-navy);padding:14px 14px 0}
.rail-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;color:#fff}
.mark{width:30px;height:30px;flex:none}
.rail-ctrls{display:flex;gap:8px;align-items:center}
.cap{display:none}
.seg{display:inline-flex;background:rgba(255,255,255,.09);border-radius:10px;padding:3px}
.seg button{
  appearance:none;border:0;background:none;color:var(--on-navy-2);font:inherit;font-size:.82rem;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer;min-width:38px;
}
.seg button[aria-pressed="true"]{background:#fff;color:#0B1F3F}
.rail select{
  font:inherit;font-size:.86rem;color:#fff;background:rgba(255,255,255,.09);
  border:1px solid var(--nav-line);border-radius:10px;padding:7px 10px;min-height:38px;max-width:11rem;
}
.rail select option,.rail select optgroup{background:var(--surface);color:var(--ink)}
.nav{display:flex;overflow-x:auto;gap:2px;margin:12px -14px 0;padding:0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.grp{display:contents}
.grp-l{display:none}
.tab{
  position:relative;display:flex;align-items:center;gap:8px;flex:none;
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  color:var(--on-navy-2);font:inherit;font-size:.92rem;font-weight:500;
  padding:12px 12px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass)}
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{padding:20px 14px 36px;min-width:0}
.main-in{max-width:1040px;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h2{margin:0;font-size:1.55rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:.95rem;max-width:42rem}

/* ---------- panels ---------- */
.hero{
  background:var(--hero-bg);color:#fff;border-radius:14px;padding:13px 18px 14px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;
  box-shadow:0 8px 22px rgba(8,18,40,.22);
}
.hero-label{display:block;color:var(--on-navy-2);font-size:.88rem}
.hero-value{
  font-family:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;font-weight:500;
  font-size:clamp(1.75rem,7.5vw,3.1rem);line-height:1.12;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere;
}
.hero-sub{display:none;color:var(--on-navy-2);font-size:.9rem;margin-top:4px}

.inputs{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-top:14px;
}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 12px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:.83rem;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{display:block;margin-top:5px;font-size:.78rem;color:var(--ink-2);line-height:1.4}
.control{
  display:flex;direction:ltr;align-items:center;gap:6px;
  background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:0 12px;min-height:44px;
}
.control:focus-within,.field select:focus,.inl-select:focus{
  border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 28%,transparent);
}
.control input{
  flex:1;min-width:0;width:100%;border:0;background:none;outline:0;color:var(--ink);
  font:inherit;font-weight:500;text-align:right;padding:8px 0;font-variant-numeric:tabular-nums;
}
.control input:focus-visible{outline:0}
.control .u{flex:none;color:var(--ink-2);font-size:.9rem}
.control.sm{display:inline-flex;width:8.6em;min-height:38px}
.field select,.inl-select{
  width:100%;min-height:44px;font:inherit;font-weight:500;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:0;
}
.inl-select{width:auto;min-height:38px}
.btn{
  width:100%;min-height:42px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
}
.btn:hover{border-color:var(--brass)}

.detail{margin-top:10px}
.ledger{margin:0;padding:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row dt{color:var(--ink-2);font-size:.95rem}
.row dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.row.key{border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.row.key dt{color:var(--ink);font-weight:600}
.row.key dd{font-size:1.08rem}
.fine{margin:12px 2px 0;color:var(--ink-2);font-size:.82rem;line-height:1.5}

.chart{margin:20px 0 0;padding:16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chart figcaption{font-weight:600;font-size:.95rem;margin-bottom:10px}
.svgwrap{width:100%}
.svgwrap svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.c-ink{fill:var(--c1);background:var(--c1)}
.c-accent{fill:var(--c2);background:var(--c2)}
.c-warm{fill:var(--c3);background:var(--c3)}
.c-soft{fill:var(--c4);background:var(--c4)}
.bar{display:flex;gap:2px;height:24px;border-radius:7px;overflow:hidden;direction:ltr}
.bar span{display:block;min-width:3px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--ink-2);font-size:11px;font-family:inherit}

.sched{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.sched summary{cursor:pointer;padding:9px 0;font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th{color:var(--ink-2);font-weight:500;position:sticky;top:0;background:var(--bg)}
.tbl tbody th{font-weight:500}
.tbl td{direction:ltr}
:root[dir="rtl"] .tbl th,:root[dir="rtl"] .tbl td{text-align:right}
:root[dir="ltr"] .tbl th,:root[dir="ltr"] .tbl td{text-align:left}

.panel-flat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.sentence{padding:18px 0;border-bottom:1px solid var(--line)}
.sentence:last-child{border-bottom:0}
.s-line{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.05rem}
.s-result{margin:0;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.9rem;font-weight:500;line-height:1.25}

.note{margin:28px 0 0;color:var(--ink-2);font-size:.82rem;line-height:1.55;max-width:48rem}
.note a{color:inherit}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
  .rail{
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 16px 20px;
    display:flex;flex-direction:column;
  }
  .rail-top{display:contents}
  .brand{order:0;margin:0 6px 22px}
  .nav{order:1;flex:1;display:block;margin:0;padding:0;overflow:visible}
  .grp{display:block;margin-bottom:18px}
  .grp-l{display:block;margin:0 14px 6px;color:var(--on-navy-2);font-size:.78rem;font-weight:500;opacity:.85}
  .tab{
    width:100%;height:44px;padding:0 14px;border-bottom:0;border-radius:10px;font-size:.95rem;
  }
  .tab::before{
    content:"";position:absolute;inset-block:11px;inset-inline-start:0;width:3px;border-radius:3px;background:transparent;
  }
  .tab:hover{background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{background:rgba(255,255,255,.1)}
  .tab[aria-selected="true"]::before{background:var(--brass)}
  .rail-ctrls{
    order:2;flex-direction:column;align-items:stretch;gap:8px;margin-top:12px;
    border-top:1px solid var(--nav-line);padding-top:16px;
  }
  .cap{display:block;font-size:.76rem;color:var(--on-navy-2);margin:2px 2px 0}
  .seg{display:flex}
  .seg button{flex:1}
  .rail select{max-width:none;width:100%}
  .main{padding:38px 44px 48px}
  .page-head{margin-bottom:22px}
}
@media (min-width:1180px){
  .panel:not(.panel-flat){
    display:grid;grid-template-columns:minmax(310px,370px) minmax(0,1fr);column-gap:44px;
    grid-template-areas:"inputs hero" "inputs detail";align-items:start;
  }
  .panel .hero{grid-area:hero;position:static;padding:22px 26px 24px;box-shadow:none}
  .panel .hero-label{font-size:.95rem}
  .panel .hero-sub{display:block}
  .panel .inputs{grid-area:inputs;position:sticky;top:20px;margin-top:0}
  .panel .detail{grid-area:detail;margin-top:12px}
  .fields{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>

</div>

const nfc = {};
function N(x, d, max){
  if (!isFinite(x)) return '—';
  const key = lang + '|' + d + '|' + max;
  let f = nfc[key];
  if (!f){
    const o = max != null ? {maximumFractionDigits:max}
            : d == null ? {maximumFractionDigits:2}
            : {minimumFractionDigits:d, maximumFractionDigits:d};
    f = nfc[key] = new Intl.NumberFormat(LOC[lang], o);
  }
  return f.format(x);
}
const symCache = {};
function symOf(c){
  if (symCache[c]) return symCache[c];
  let s = c;
  try {
    const p = new Intl.NumberFormat('en', {style:'currency', currency:c, currencyDisplay:'narrowSymbol'})
      .formatToParts(0).find(x => x.type === 'currency');
    if (p) s = p.value;
  } catch(e) {}
  return symCache[c] = s;
}
function M(x, d=0, c=cur){
  if (!isFinite(x)) return '—';
  const s = x < 0 ? '-' : '';
  const a = N(Math.abs(x), d);
  if (c === 'ILS') return `${s}${a} ₪`;
  const sy = symOf(c);
  return sy.length > 1 ? `${s}${sy} ${a}` : `${s}${sy}${a}`;
}
const MI = (x, d=0) => M(x, d, 'ILS');
const PC = x => isFinite(x) ? `${N(x,2)}%` : '—';
const v = id => { const n = parseFloat($('#'+id).value); return isFinite(n) ? n : 0; };
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));

/* ================= chart ================= */
function niceMax(x){
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / p;
  const nm = m <= 1 ? 1 : m <= 2 ? 2 : m <= 4 ? 4 : m <= 8 ? 8 : 10;
  return nm * p;
}
function compact(x){
  const f = (n, s) => (n >= 10 ? Math.round(n) : Math.round(n*10)/10) + s;
  if (x >= 1e9) return f(x/1e9, 'B');
  if (x >= 1e6) return f(x/1e6, 'M');
  if (x >= 1e3) return f(x/1e3, 'K');
  return String(Math.round(x*100)/100);
}
function drawChart(el){
  const s = el._spec; if (!s) return;
  const wrap = $('.svgwrap', el);
  const W = Math.max(260, Math.floor(wrap.clientWidth) || 600), H = 240;
  const pl = 44, pr = 6, pt = 8, pb = 26, ih = H - pt - pb;
  const n = s.labels.length;
  const totals = s.labels.map((_, i) => s.layers.reduce((a, l) => a + (isFinite(l.values[i]) ? Math.max(0, l.values[i] || 0) : 0), 0));
  const top = Math.max(1e-9, ...totals.filter(isFinite)), nm = niceMax(top), max = isFinite(nm) ? nm : top;
  const bw = (W - pl - pr) / n, gap = Math.min(5, bw * 0.2);
  const step = Math.ceil(n / Math.max(1, Math.floor((W - pl) / 36)));
  let g = '';
  for (let k = 0; k <= 4; k++){
    const y = pt + ih * (1 - k/4);
    g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${compact(max*k/4)}</text>`;
  }
  for (let i = 0; i < n; i++){
    let acc = 0;
    s.layers.forEach(l => {
      const val = isFinite(l.values[i]) ? Math.max(0, l.values[i] || 0) : 0;
      const h = val / max * ih;
      if (h > 0){
        const y = pt + ih - (acc / max * ih) - h;
        g += `<rect class="${l.cls}" rx="2" x="${(pl + i*bw + gap/2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw-gap).toFixed(1)}" height="${h.toFixed(1)}"><title>${s.unit ? s.unit + ' ' : ''}${s.labels[i]}: ${l.name} – ${s.fmt(val)}</title></rect>`;
      }
      acc += val;
    });
    if (i % step === 0){
      g += `<text class="ax" x="${(pl + i*bw + bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${s.labels[i]}</text>`;
    }
  }
  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.title}" style="direction:ltr">${g}</svg>`;
}

  if (res.split){

    const tot = items.reduce((a, i) => a + i.v, 0) || 1;
    sp.hidden = false;

      `<span class="${i.cls}" style="flex:${i.v} 1 0" title="${i.name}: ${i.fmt}"></span>`).join('');

  const ch = $('#ch-'+id);
  if (res.chart){
    ch.hidden = false; ch._spec = res.chart;
    $('figcaption', ch).textContent = res.chart.title;
    $('.legend', ch).innerHTML = res.chart.layers.map(l => `<span><i class="sw ${l.cls}"></i>${l.name}</span>`).join('');
    drawChart(ch);
  } else { ch.hidden = true; ch._spec = null; }

  const tb = $('#tb-'+id);
  if (res.table){
    tb.hidden = false;
    if (res.table.open && !tb._init){ tb.open = true; tb._init = true; }
    $('summary', tb).textContent = res.table.title;
    $('.scroll', tb).innerHTML = `<table class="tbl"><thead><tr>${res.table.head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${
      res.table.rows.map(r => `<tr>${r.map((c,i) => i ? `<td>${c}</td>` : `<th scope="row">${c}</th>`).join('')}</tr>`).join('')
    }</tbody></table>`;
  } else tb.hidden = true;
}

/* ================= calculators ================= */
/* --- converter --- */
const rateOf = (from, to) => RATES[to] / RATES[from];
const dec = x => Math.abs(x) >= 1 ? 2 : 4;
function dateStr(){
  try {
    return new Intl.DateTimeFormat(LOC[lang], {dateStyle:'medium', timeStyle:'short', timeZone:'UTC'})
      .format(new Date(META.unix * 1000)) + ' UTC';
  } catch(e) { return new Date(META.unix * 1000).toUTCString(); }
}
function calcConvert(){
  const amt = v('x_amount');
  const from = $('#x_from').value, to = $('#x_to').value;
  if (!RATES[from] || !RATES[to]) return null;
  const raw = parseFloat($('#x_rate').value);
  const manual = isFinite(raw) && raw > 0 ? raw : null;
  const r = manual != null ? manual : rateOf(from, to);
  const out = amt * r;
  return {
    hero: {label: `<bdi dir="ltr">${N(amt, null, 2)} ${from} =</bdi>`, value: M(out, dec(out), to),
           sub: `<bdi dir="ltr">1 ${from} = ${N(r, null, 4)} ${to}</bdi>`},
    rows: [
      [t('r_rate'),    `1 ${from} = ${N(r, null, 4)} ${to}`],
      [t('r_rateInv'), `1 ${to} = ${N(1 / r, null, 4)} ${from}`],
      [t('r_rateSrc'), manual != null ? t('s_manual') : (META.live ? t('s_live') : t('s_snap'))],
      [t('r_rateDate'), dateStr()]
    ],
    table: {
      title: t('t_otherCur'), open: true,
      head: [t('h_currency'), t('f_amount')],
      rows: PIN.filter(c => c !== from && RATES[c]).map(c => {
        const val = amt * rateOf(from, c);
        return [`${c} – ${curName(c)}`, M(val, dec(val), c)];
      })
    }
  };
}

/* --- VAT --- */
function calcVat(){
  const amt = v('v_amount'), rate = Math.max(0, v('v_rate')) / 100, mode = $('#v_mode').value;
  const net = mode === 'add' ? amt : amt / (1 + rate);
  const gross = mode === 'add' ? amt * (1 + rate) : amt;
  const vat = gross - net;
  return {
    hero: mode === 'add'
      ? {label: t('r_vatTotal'), value: M(gross, 2), sub: t('s_vatSub', {v: M(vat, 2)})}
      : {label: t('r_vatNet'),   value: M(net, 2),   sub: t('s_vatSub', {v: M(vat, 2)})},
    rows: [
      [t('r_vatNet'), M(net, 2)],
      [t('r_vatAmt'), M(vat, 2)],
      [t('r_vatTotal'), M(gross, 2), 'key'],
      [t('r_vatShare'), PC(gross ? vat / gross * 100 : NaN)]
    ]
  };
}

/* --- percentages --- */
function calcPercent(){
  const set = (id, html) => { $('#'+id).innerHTML = html; };
  set('pr_a', numHTML(N(v('pa_x') / 100 * v('pa_y'))));
  const w = v('pb_y');
  set('pr_b', numHTML(w ? PC(v('pb_x') / w * 100) : '—'));
  const a = v('pc_a'), b = v('pc_b');
  if (a === 0) set('pr_c', numHTML('—'));
  else {
    const ch = (b - a) / Math.abs(a) * 100;
    set('pr_c', ch === 0 ? t('r_none') : t(ch > 0 ? 'r_inc' : 'r_dec', {p: numHTML(PC(Math.abs(ch)))}));
  }
  const sign = $('#pd_op').value === 'add' ? 1 : -1;
  set('pr_d', numHTML(N(v('pd_x') * (1 + sign * v('pd_p') / 100))));
}

/* --- Israeli income tax helpers --- */
function taxByBrackets(income){
  let prev = 0, tax = 0;
  const parts = [];
  for (const [lim, r] of TAX.brackets){
    const amt = Math.max(0, Math.min(income, lim) - prev);
    parts.push({from: prev, to: lim, rate: r, amt, tax: amt * r});
    tax += amt * r;
    prev = lim;
  }
  const sur = Math.max(0, income - TAX.surtaxFrom) * TAX.surtaxRate;
  return {tax, sur, parts};
}
function marginalRate(income){
  let rate = TAX.brackets[0][1];
  for (const [lim, r] of TAX.brackets){ rate = r; if (income <= lim) break; }
  return rate + (income > TAX.surtaxFrom ? TAX.surtaxRate : 0);
}
function salaryCalc(g, pts, pensPct, studyPct){
  const b = taxByBrackets(g * 12);
  const pens = g * pensPct / 100;
  const qual = Math.min(pens, TAX.pensDepRate * Math.min(g, TAX.pensSalaryCap));
  const credits = pts * TAX.point + TAX.pensCreditRate * qual * 12;
  const before = b.tax + b.sur;
  const used = Math.min(credits, before);
  const tax = (before - used) / 12;
  const low = Math.min(g, TAX.niCut), high = Math.max(0, Math.min(g, TAX.niMax) - TAX.niCut);
  const ni = low * TAX.niLow + high * TAX.niHigh;
  const health = low * TAX.hLow + high * TAX.hHigh;
  const study = g * studyPct / 100;
  const ded = tax + ni + health + pens + study;
  const employer = g * (1 + TAX.erPension + TAX.erSeverance) + low * TAX.erNiLow + high * TAX.erNiHigh;
  return {gross: g, net: g - ded, tax, ni, health, pens, study, ded, credits: used / 12, employer};
}

/* --- salary --- */
function calcSalary(){
  const amt = Math.max(0, v('s_amount')), mode = $('#s_mode').value;
  const pts = Math.max(0, v('s_points')), pens = clamp(v('s_pension'), 0, 30), study = clamp(v('s_study'), 0, 30);
  let g = amt;
  if (mode === 'n2g'){
    let lo = amt, hi = amt * 4 + 1000;
    for (let i = 0; i < 80; i++){
      const mid = (lo + hi) / 2;
      if (salaryCalc(mid, pts, pens, study).net < amt) lo = mid; else hi = mid;
    }
    g = (lo + hi) / 2;
  }
  const r = salaryCalc(g, pts, pens, study);
  const step = 100;
  const r2 = salaryCalc(g + step, pts, pens, study);
  const marginal = (1 - (r2.net - r.net) / step) * 100;
  const rows = [
    [t('r_grossMonthly'), MI(r.gross)],
    [t('r_incomeTax'), MI(-r.tax)],
    [t('r_ni'), MI(-r.ni)],
    [t('r_health'), MI(-r.health)]
  ];
  if (r.pens > 0) rows.push([t('r_pensionRow'), MI(-r.pens)]);
  if (r.study > 0) rows.push([t('r_studyRow'), MI(-r.study)]);
  rows.push(
    [t('r_totalDed'), MI(-r.ded), 'key'],
    [t('r_netMonthly'), MI(r.net), 'key'],
    [t('r_dedShare'), PC(r.gross > 0 ? r.ded / r.gross * 100 : NaN)],
    [t('r_creditsUsed'), MI(r.credits)],
    [t('r_marginal'), PC(marginal)],
    [t('r_netAnnual'), MI(r.net * 12)],
    [t('r_employerCost'), MI(r.employer)]
  );
  return {
    hero: mode === 'g2n'
      ? {label: t('r_netMonthly'), value: MI(r.net), sub: t('s_fromGross', {g: MI(r.gross)})}
      : {label: t('r_grossMonthly'), value: MI(r.gross), sub: t('s_toNet', {g: MI(r.net)})},
    rows,
    note: t('n_salary'),
    split: {
      title: t('c_split'),
      items: [
        {name: t('l_netPay'),    v: r.net,                   cls:'c-ink',    fmt: MI(r.net)},
        {name: t('l_incTax'),    v: r.tax,                   cls:'c-accent', fmt: MI(r.tax)},
        {name: t('l_niHealth'),  v: r.ni + r.health,         cls:'c-warm',   fmt: MI(r.ni + r.health)},
        {name: t('l_savings'),   v: r.pens + r.study,        cls:'c-soft',   fmt: MI(r.pens + r.study)}
      ]
    }
  };
}

/* --- income tax --- */
function calcTaxTab(){
  const monthly = $('#t_period').value === 'm';
  const income = Math.max(0, v('t_income')) * (monthly ? 12 : 1);
  const pts = Math.max(0, v('t_points')), other = Math.max(0, v('t_other'));
  const b = taxByBrackets(income);
  const before = b.tax + b.sur;
  const credits = pts * TAX.point + other;
  const used = Math.min(credits, before);
  const payable = Math.max(0, before - used);
  const eff = income > 0 ? payable / income * 100 : NaN;
  const marg = marginalRate(income) * 100;
  const rows = [
    [t('r_incomeYear'), MI(income)],
    [t('r_taxBefore'), MI(b.tax)]
  ];
  if (b.sur > 0) rows.push([t('r_surtax'), MI(b.sur)]);
  rows.push(
    [t('r_credApplied'), MI(-used)],
    [t('r_taxPayable'), MI(payable), 'key'],
    [t('r_effRate'), PC(eff)],
    [t('r_margRate'), PC(marg)],
    [t('r_perMonth'), MI(payable / 12)],
    [t('r_afterTax'), MI(income - payable)]
  );
  const parts = b.parts.filter(p => p.amt > 0);
  const tableRows = parts.map(p => [
    `${N(p.from)} – ${isFinite(p.to) ? N(p.to) : '∞'}`, PC(p.rate * 100), MI(p.amt), MI(p.tax)
  ]);
  if (b.sur > 0) tableRows.push([`${t('r_surtax')} ${N(TAX.surtaxFrom)}+`, PC(TAX.surtaxRate * 100), MI(income - TAX.surtaxFrom), MI(b.sur)]);
  return {
    hero: {
      label: t(monthly ? 'r_taxMonth' : 'r_taxYear'),
      value: MI(payable / (monthly ? 12 : 1)),
      sub: t('s_taxSub', {e: PC(eff), m: PC(marg)})
    },
    rows,
    note: t('n_tax'),
    chart: {
      title: t('c_taxBracket'), unit: '', fmt: x => MI(x),
      layers: [{name: t('l_tax'), cls:'c-ink', values: parts.map(p => p.tax)}],
      labels: parts.map(p => `${N(p.rate * 100)}%`)
    },
    table: {
      title: t('t_brackets'),
      head: [t('h_bracket'), t('h_rate'), t('h_inBracket'), t('h_taxCol')],
      rows: tableRows
    }
  };
}

/* --- dividends --- */
function calcDividends(){
  const price = v('d_price'), shares = v('d_shares'), dps = v('d_dps');
  const f = parseInt($('#d_freq').value, 10) || 1;
  const tax = clamp(v('d_tax'), 0, 100) / 100;
  const years = clamp(Math.round(v('d_years')), 1, 60);
  const g = v('d_growth') / 100;
  const invest = price * shares, gross = dps * shares, net = gross * (1 - tax);
  const yld = price > 0 ? dps / price : NaN;
  const grossY = [], netY = [], cumY = [];
  let cum = 0;
  for (let i = 0; i < years; i++){
    const gy = gross * Math.pow(1 + g, i), ny = gy * (1 - tax);
    cum += ny; grossY.push(gy); netY.push(ny); cumY.push(cum);
  }
  const lastGross = grossY[years - 1];
  const rows = [
    [t('r_invest'), M(invest)],
    [t('r_divGross'), M(gross)],
    [t('r_tax', {n: N(tax*100)}), M(-(gross - net))],
    [t('r_divNet'), M(net), 'key'],
    [t('r_netPay'), M(net / f, 2)],
    [t('r_yGross'), PC(yld * 100)],
    [t('r_yNet'), PC(yld * (1 - tax) * 100)],
    [t('r_grossYear', {n: years}), M(lastGross)],
    [t('r_cumNet', {n: years}), M(cum)]
  ];
  if (invest > 0) rows.push([t('r_yoc'), PC(lastGross / invest * 100)]);
  return {
    hero: {label: t('r_divNet'), value: M(net), sub: t('r_yNet') + ': ' + PC(yld * (1 - tax) * 100)},
    rows,
    chart: {
      title: t('c_divChart'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_netDiv'), cls:'c-ink', values: netY}],
      labels: netY.map((_, i) => i + 1)
    },
    table: {
      title: t('t_yearly'),
      head: [t('w_year'), t('h_gross'), t('h_net'), t('h_cumNet')],
      rows: netY.map((x, i) => [i + 1, M(grossY[i]), M(x), M(cumY[i])])
    }
  };
}

/* --- loans --- */
function calcLoan(){
  const amt = Math.max(0, v('l_amount')), rate = Math.max(0, v('l_rate'));
  const yrs = clamp(v('l_years'), 0.25, 50), type = $('#l_type').value;
  const n = Math.max(1, Math.round(yrs * 12)), r = rate / 1200;
  const pmt = r === 0 ? amt / n : amt * r / (1 - Math.pow(1 + r, -n));
  let bal = amt, totalInt = 0, first = 0, last = 0;
  const Y = [];
  for (let m = 1; m <= n; m++){
    const int = bal * r;
    const pr = type === 'annuity' ? pmt - int : amt / n;
    const pay = int + pr;
    if (m === 1) first = pay;
    if (m === n) last = pay;
    bal = Math.max(0, bal - pr);
    totalInt += int;
    const y = Math.ceil(m / 12) - 1;
    if (!Y[y]) Y[y] = {pr:0, int:0, end:0};
    Y[y].pr += pr; Y[y].int += int; Y[y].end = bal;
  }
  const total = amt + totalInt;
  const rows = type === 'annuity'
    ? [[t('r_monthlyFixed'), M(first, 2)]]
    : [[t('r_firstPay'), M(first, 2)], [t('r_lastPay'), M(last, 2)]];
  rows.push(
    [t('r_loanAmt'), M(amt)],
    [t('r_totInt'), M(totalInt)],
    [t('r_totPaid'), M(total), 'key'],
    [t('r_intPct'), PC(amt > 0 ? totalInt / amt * 100 : NaN)],
    [t('r_numPay'), N(n, 0)]
  );
  return {
    hero: {label: t(type === 'annuity' ? 'r_monthly' : 'r_firstPay'), value: M(first, 2),
           sub: t('r_totInt') + ': ' + M(totalInt)},
    rows,
    chart: {
      title: t('c_loanChart'), unit: t('w_year'), fmt: x => M(x),
      layers: [
        {name: t('l_principal'), cls:'c-ink',  values: Y.map(y => y.pr)},
        {name: t('l_interest'),  cls:'c-warm', values: Y.map(y => y.int)}
      ],
      labels: Y.map((_, i) => i + 1)
    },
    table: {
      title: t('t_amort'),
      head: [t('w_year'), t('l_principal'), t('l_interest'), t('h_balance')],
      rows: Y.map((y, i) => [i + 1, M(y.pr), M(y.int), M(y.end)])
    }
  };
}

/* --- return --- */
function calcYield(){
  const a = v('y_start'), b = Math.max(0, v('y_end')), yrs = v('y_years');
  const tax = clamp(v('y_tax'), 0, 100) / 100, infl = v('y_infl') / 100;
  if (!(a > 0) || !(yrs > 0)){
    return {hero:{label: t('r_avgAnnual'), value:'—'}, rows:[[t('r_invalidY'), '—']]};
  }
  const gain = b - a;
  const netGain = gain > 0 ? gain * (1 - tax) : gain;
  const bNet = a + netGain;
  const cagr = Math.pow(b / a, 1 / yrs) - 1;
  const cagrNet = Math.pow(bNet / a, 1 / yrs) - 1;
  const rows = [
    [t('r_gainLoss'), M(gain)],
    [t('r_totReturn'), PC(gain / a * 100)]
  ];
  if (tax > 0) rows.push([t('r_gainNet'), M(netGain)], [t('r_annNet'), PC(cagrNet * 100)]);
  if (infl > 0) rows.push([t('r_annReal'), PC(((1 + cagrNet) / (1 + infl) - 1) * 100)]);
  if (cagr > 0) rows.push([t('r_double'), `${N(Math.log(2) / Math.log(1 + cagr), 1)} ${t('w_years')}`]);
  return {hero:{label: t('r_avgAnnual'), value: PC(cagr * 100), sub: t('r_totReturn') + ': ' + PC(gain / a * 100)}, rows};
}

/* --- compound interest --- */
function calcCompound(){
  const p0 = Math.max(0, v('c_init')), mo = Math.max(0, v('c_monthly'));
  const rate = v('c_rate') / 100;
  const yrs = clamp(Math.round(v('c_years')), 1, 60);
  const f = parseInt($('#c_freq').value, 10) || 12;
  const infl = v('c_infl') / 100, tax = clamp(v('c_tax'), 0, 100) / 100;
  const rm = Math.pow(1 + rate / f, f / 12) - 1;
  let bal = p0, dep = p0;
  const Y = [];
  for (let y = 1; y <= yrs; y++){
    for (let k = 0; k < 12; k++){ bal = bal * (1 + rm) + mo; dep += mo; }
    Y.push({y, dep, int: bal - dep, bal});
  }
  const gain = bal - dep;
  const ear = Math.pow(1 + rate / f, f) - 1;
  let base = bal;
  const rows = [
    [t('r_deposited'), M(dep)],
    [t('r_intEarned'), M(gain)],
    [t('r_final'), M(bal), 'key'],
    [t('r_intShare'), PC(bal > 0 ? gain / bal * 100 : NaN)],
    [t('r_ear'), PC(ear * 100)]
  ];
  if (tax > 0 && gain > 0){
    base = dep + gain * (1 - tax);
    rows.push([t('r_netAfterTax'), M(base)]);
  }
  if (infl > 0) rows.push([t('r_real'), M(base / Math.pow(1 + infl, yrs))]);
  return {
    hero: {label: t('r_final'), value: M(bal), sub: t('r_intEarned') + ': ' + M(gain)},
    rows,
    chart: {
      title: t('c_growth'), unit: t('w_year'), fmt: x => M(x),
      layers: [
        {name: t('l_deposits'), cls:'c-ink',    values: Y.map(y => y.dep)},
        {name: t('l_interest'), cls:'c-accent', values: Y.map(y => y.int)}
      ],
      labels: Y.map(y => y.y)
    },
    table: {
      title: t('t_yearly'),
      head: [t('w_year'), t('h_deposited'), t('l_interest'), t('w_total')],
      rows: Y.map(y => [y.y, M(y.dep), M(y.int), M(y.bal)])
    }
  };
}

const CALC = {convert: calcConvert, vat: calcVat, percent: calcPercent, salary: calcSalary, tax: calcTaxTab,
              loan: calcLoan, compound: calcCompound, yield: calcYield, dividends: calcDividends};
function calc(id){
  const res = CALC[id]();
  if (res) show(id, res);
}

/* ================= navigation ================= */
function activate(id, focus){
  tab = id;
  TABS.forEach(x => {
    const on = x === id;
    const b = $('#tab-'+x);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    $('#panel-'+x).hidden = !on;
    if (on && focus) b.focus();
  });
  try { localStorage.setItem('fin-tab', id); } catch(e) {}
  updateHead();
  calc(id);
}
navEl.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) activate(b.dataset.tab);
});
navEl.addEventListener('keydown', e => {
  const i = TABS.indexOf(tab);
  const rtl = document.documentElement.dir === 'rtl';
  const next = rtl ? 'ArrowLeft' : 'ArrowRight', prev = rtl ? 'ArrowRight' : 'ArrowLeft';
  let j = -1;
  if (e.key === next || e.key === 'ArrowDown') j = (i + 1) % TABS.length;
  else if (e.key === prev || e.key === 'ArrowUp') j = (i - 1 + TABS.length) % TABS.length;
  else if (e.key === 'Home') j = 0;
  else if (e.key === 'End') j = TABS.length - 1;
  if (j >= 0){ e.preventDefault(); activate(TABS[j], true); }
});

/* ================= live updates ================= */
const refresh = () => calc(tab);
panelsEl.addEventListener('input', refresh);
panelsEl.addEventListener('change', refresh);
panelsEl.addEventListener('click', e => {
  if (e.target.closest('#x_swap')){
    const a = $('#x_from'), b = $('#x_to');
    const tmp = a.value; a.value = b.value; b.value = tmp;
    $('#x_rate').value = '';
    calc(tab);
  } else if (e.target.closest('#x_refresh')){
    tryLive(true);
  }
});
$('#cur').addEventListener('change', e => {
  cur = e.target.value;
  try { localStorage.setItem('fin-cur', cur); } catch(err) {}
  $$('.u.cur').forEach(el => { el.textContent = symOf(cur); });
  calc(tab);
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('fin-lang', lang); } catch(err) {}
  applyLang(true);
});
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { const ch = $('#ch-'+tab); if (ch) drawChart(ch); }, 120);
});

/* Where the page may call out (for example when saved and hosted elsewhere),
   pull fresh rates; in this hosted page the request is blocked, so the stored
   daily snapshot stays and the status line says so. */
async function tryLive(manual){
  const st = $('#x_status');
  if (manual && st) st.textContent = t('st_loading');
  let ok = false;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://open.er-api.com/v6/latest/USD', {signal: ctl.signal});
    clearTimeout(to);
    if (r.ok){
      const j = await r.json();
      if (j && j.result === 'success' && j.rates && j.rates.ILS && j.rates.USD){
        RATES = j.rates;
        META.live = true;
        META.unix = j.time_last_update_unix || META.unix;
        ok = true;
        fillCurSelects();
        calc(tab);
      }
    }
  } catch(e) { /* keep snapshot */ }
  if (manual && st) st.textContent = ok ? t('st_ok', {d: dateStr()}) : t('st_fail', {d: dateStr()});
}

/* ================= init ================= */
applyLang(false);
activate(tab);
tryLive(false);
})();
