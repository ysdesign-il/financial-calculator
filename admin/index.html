<style>
:root{
  color-scheme: dark;
  --bg:#060C1C; --surface:#0E1830; --field:#0A1329;
  --ink:#EEF2FB; --ink-2:#8E9DBB; --line:rgba(255,255,255,.09);
  --navy:#070D1E; --hero-bg:#0E1830; --on-navy:#EEF2FB; --on-navy-2:#8E9DBB; --nav-line:rgba(255,255,255,.1);
  --brass:#F2C45A; --gold:#F2C45A; --gold-2:#C9972E; --focus:#F2C45A; --green:#2FD08A;
  --gold-ui:#F2C45A; --g1:rgba(255,255,255,.06); --g2:rgba(255,255,255,.02); --track:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.28);
  --hero-label:#BFD3C9; --hero-val:#46E3A4; --hero-grad:linear-gradient(135deg,rgba(47,208,138,.20),rgba(14,24,48,.92) 62%); --hero-bd:rgba(47,208,138,.35);
  --c1:#4F8CFF; --c2:#F5A524; --c3:#F0705A; --c4:#2FD08A;
}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rail :focus-visible{outline-color:#E0B65A}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.rail{background:var(--navy);color:var(--on-navy);padding:14px 14px 0}
.rail-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;color:#fff}
.mark{width:30px;height:30px;flex:none}
.rail-ctrls{display:flex;gap:8px;align-items:center}
.cap{display:none}
.seg{display:inline-flex;background:rgba(255,255,255,.09);border-radius:10px;padding:3px}
.seg button{
  appearance:none;border:0;background:none;color:var(--on-navy-2);font:inherit;font-size:.82rem;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer;min-width:38px;
}
.seg button[aria-pressed="true"]{background:#fff;color:#0B1F3F}
.rail select{
  font:inherit;font-size:.86rem;color:#fff;background:rgba(255,255,255,.09);
  border:1px solid var(--nav-line);border-radius:10px;padding:7px 10px;min-height:38px;max-width:11rem;
}
.rail select option,.rail select optgroup{background:var(--surface);color:var(--ink)}
.nav{display:flex;overflow-x:auto;gap:2px;margin:12px -14px 0;padding:0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.grp{display:contents}
.grp-l{display:none}
.tab{
  position:relative;display:flex;align-items:center;gap:8px;flex:none;
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  color:var(--on-navy-2);font:inherit;font-size:.92rem;font-weight:500;
  padding:12px 12px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass)}
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{padding:20px 14px 36px;min-width:0}
.main-in{max-width:1040px;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h2{margin:0;font-size:1.55rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:.95rem;max-width:42rem}

/* ---------- panels ---------- */
.hero{
  background:var(--hero-bg);color:#fff;border-radius:14px;padding:13px 18px 14px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;
  box-shadow:0 8px 22px rgba(8,18,40,.22);
}
.hero-label{display:block;color:var(--on-navy-2);font-size:.88rem}
.hero-value{
  font-family:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;font-weight:500;
  font-size:clamp(1.75rem,7.5vw,3.1rem);line-height:1.12;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere;
}
.hero-sub{display:none;color:var(--on-navy-2);font-size:.9rem;margin-top:4px}

.inputs{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-top:14px;
}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 12px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:.83rem;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{display:block;margin-top:5px;font-size:.78rem;color:var(--ink-2);line-height:1.4}
.control{
  display:flex;direction:ltr;align-items:center;gap:6px;
  background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:0 12px;min-height:44px;
}
.control:focus-within,.field select:focus,.inl-select:focus{
  border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 28%,transparent);
}
.control input{
  flex:1;min-width:0;width:100%;border:0;background:none;outline:0;color:var(--ink);
  font:inherit;font-weight:500;text-align:right;padding:8px 0;font-variant-numeric:tabular-nums;
}
.control input:focus-visible{outline:0}
.control .u{flex:none;color:var(--ink-2);font-size:.9rem}
.control.sm{display:inline-flex;width:8.6em;min-height:38px}
.field select,.inl-select{
  width:100%;min-height:44px;font:inherit;font-weight:500;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:0;
}
.inl-select{width:auto;min-height:38px}
.btn{
  width:100%;min-height:42px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
}
.btn:hover{border-color:var(--brass)}

.detail{margin-top:10px}
.ledger{margin:0;padding:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row dt{color:var(--ink-2);font-size:.95rem}
.row dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.row.key{border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.row.key dt{color:var(--ink);font-weight:600}
.row.key dd{font-size:1.08rem}
.fine{margin:12px 2px 0;color:var(--ink-2);font-size:.82rem;line-height:1.5}

.chart{margin:20px 0 0;padding:16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chart figcaption{font-weight:600;font-size:.95rem;margin-bottom:10px}
.svgwrap{width:100%}
.svgwrap svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.c-ink{fill:var(--c1);background:var(--c1)}
.c-accent{fill:var(--c2);background:var(--c2)}
.c-warm{fill:var(--c3);background:var(--c3)}
.c-soft{fill:var(--c4);background:var(--c4)}
.bar{display:flex;gap:2px;height:24px;border-radius:7px;overflow:hidden;direction:ltr}
.bar span{display:block;min-width:3px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--ink-2);font-size:11px;font-family:inherit}

.sched{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.sched summary{cursor:pointer;padding:9px 0;font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th{color:var(--ink-2);font-weight:500;position:sticky;top:0;background:var(--bg)}
.tbl tbody th{font-weight:500}
.tbl td{direction:ltr}
:root[dir="rtl"] .tbl th,:root[dir="rtl"] .tbl td{text-align:right}
:root[dir="ltr"] .tbl th,:root[dir="ltr"] .tbl td{text-align:left}

.panel-flat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.sentence{padding:18px 0;border-bottom:1px solid var(--line)}
.sentence:last-child{border-bottom:0}
.s-line{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.05rem}
.s-result{margin:0;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.9rem;font-weight:500;line-height:1.25}

.note{margin:28px 0 0;color:var(--ink-2);font-size:.82rem;line-height:1.55;max-width:48rem}
.note a{color:inherit}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
  .rail{
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 16px 20px;
    display:flex;flex-direction:column;
  }
  .rail-top{display:contents}
  .brand{order:0;margin:0 6px 22px}
  .nav{order:1;flex:1;display:block;margin:0;padding:0;overflow:visible}
  .grp{display:block;margin-bottom:18px}
  .grp-l{display:block;margin:0 14px 6px;color:var(--on-navy-2);font-size:.78rem;font-weight:500;opacity:.85}
  .tab{
    width:100%;height:44px;padding:0 14px;border-bottom:0;border-radius:10px;font-size:.95rem;
  }
  .tab::before{
    content:"";position:absolute;inset-block:11px;inset-inline-start:0;width:3px;border-radius:3px;background:transparent;
  }
  .tab:hover{background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{background:rgba(255,255,255,.1)}
  .tab[aria-selected="true"]::before{background:var(--brass)}
  .rail-ctrls{
    order:2;flex-direction:column;align-items:stretch;gap:8px;margin-top:12px;
    border-top:1px solid var(--nav-line);padding-top:16px;
  }
  .cap{display:block;font-size:.76rem;color:var(--on-navy-2);margin:2px 2px 0}
  .seg{display:flex}
  .seg button{flex:1}
  .rail select{max-width:none;width:100%}
  .main{padding:38px 44px 48px}
  .page-head{margin-bottom:22px}
}
@media (min-width:1180px){
  .panel:not(.panel-flat){
    display:grid;grid-template-columns:minmax(310px,370px) minmax(0,1fr);column-gap:44px;
    grid-template-areas:"inputs hero" "inputs detail";align-items:start;
  }
  .panel .hero{grid-area:hero;position:static;padding:22px 26px 24px;box-shadow:none}
  .panel .hero-label{font-size:.95rem}
  .panel .hero-sub{display:block}
  .panel .inputs{grid-area:inputs;position:sticky;top:20px;margin-top:0}
  .panel .detail{grid-area:detail;margin-top:12px}
  .fields{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.adv summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:.92rem;color:var(--ink)}
.adv .fields{margin-top:6px}
.sub-h{grid-column:1/-1;margin:6px 0 -4px;font-size:.8rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1px solid var(--c3);color:var(--ink);font-size:.88rem;background:color-mix(in srgb,var(--c3) 10%,transparent)}
.ok-note{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,transparent)}
.warn[hidden]{display:none}
.lookup{width:100%;margin:0 0 10px;min-height:40px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

/* ===== dark gold theme ===== */
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(79,140,255,.10),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(242,196,90,.07),transparent 55%),var(--bg);background-attachment:fixed}
.rail{background:linear-gradient(180deg,#0A1226,#070D1E);border-inline-end:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold-ui);color:#1a1202}
.tab[aria-selected="true"]{color:var(--gold-ui)}
.tab[aria-selected="true"]::before{background:var(--gold-ui)}
.page-head{display:flex;align-items:center;gap:12px}
.page-head h2{font-size:1.45rem}
.back{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--g1);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[dir="ltr"] .back svg{transform:scaleX(-1)}
.inputs,.chart,.panel-flat,.sched,.warn{background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px var(--shadow)}
.sched{padding:6px 16px 10px;border-top:1px solid var(--line)}
.hero{border-radius:20px;background:var(--hero-grad);border:1px solid var(--hero-bd);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.hero-value{color:var(--hero-val)}
.hero-label{color:var(--hero-label)}
.control{background:var(--field);border-radius:14px;border-color:var(--line)}
.field select,.inl-select{background:var(--field);border-radius:14px;border-color:var(--line);color:var(--ink)}
.field select option{background:var(--surface);color:var(--ink)}
.btn{border-radius:14px;background:var(--g1)}
.row.key{border-top-color:var(--gold)}
.row.key dd{color:var(--gold)}
.warn{padding:12px 14px;border-color:rgba(240,112,90,.55);background:rgba(240,112,90,.10)}
.warn.ok-note{border-color:rgba(47,208,138,.5);background:rgba(47,208,138,.09)}
.tbl thead th{background:var(--surface)}
/* field with icon + slider */
.field.ic-field{display:flex;gap:12px;align-items:flex-start}
.fi{flex:none;width:44px;height:44px;margin-top:22px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);color:var(--gold)}
.fi svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fb{flex:1;min-width:0}
.rng{display:block;width:100%;margin:10px 0 0;height:20px;background:none;-webkit-appearance:none;appearance:none;direction:ltr;--p:0%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--gold) var(--p),var(--track) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--gold)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;background:var(--gold);border:3px solid var(--field);box-shadow:0 0 0 1px var(--gold),0 2px 8px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--field)}
.rl{display:flex;justify-content:space-between;direction:ltr;font-size:.72rem;color:var(--ink-2);margin-top:-2px}
/* advanced */
.adv{border-top:0;margin-top:14px;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--g2)}
.adv summary{padding:14px 16px;list-style:none;display:flex;align-items:center;justify-content:space-between}
.adv summary::after{content:"⚙";color:var(--gold);font-size:1.1rem}
.adv summary::-webkit-details-marker{display:none}
.adv .fields{padding:4px 16px 16px}
/* donut */
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{flex:none;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15}
.donut .c-ink{stroke:var(--c1)}.donut .c-accent{stroke:var(--c2)}.donut .c-warm{stroke:var(--c3)}.donut .c-soft{stroke:var(--c4)}
.donutwrap .legend{flex:1;min-width:190px;flex-direction:column;align-items:stretch;gap:10px;margin:0}
.donutwrap .legend>span{display:flex;gap:8px;align-items:center}
/* home */
.home-hello{margin:0 0 4px;font-size:1.5rem;font-weight:600}
.home-sub{margin:0 0 18px;color:var(--ink-2)}
.hhero{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px 16px;background:linear-gradient(135deg,#6b4d12,#2a1f08 55%,#171108);border:1px solid rgba(242,196,90,.45);box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.hhero .l{color:#E8D4A0;font-size:.9rem}
.hhero .v{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:clamp(2rem,9vw,3.2rem);font-weight:500;color:#FFE29A;line-height:1.15}
.hhero .s{color:#CDBB8C;font-size:.82rem;margin-top:4px;max-width:72%}
.hhero svg.spark{position:absolute;inset-inline-end:0;bottom:0;width:62%;height:70%;opacity:.95;direction:ltr}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.stat{padding:14px 8px;border-radius:16px;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line)}
.stat b{display:block;font-size:1.02rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--ink-2)}
.sec-t{margin:22px 0 10px;font-size:1.05rem;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{appearance:none;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 6px;text-align:center;font-size:.86rem;line-height:1.25;border-radius:16px;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);transition:transform .15s,border-color .15s}

/* theme gallery */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:0 0 16px}
.skin-c{appearance:none;font:inherit;color:var(--ink);text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:16px;border:1px solid var(--line);background:var(--g1);position:relative}
.skin-c[aria-checked="true"]{border-color:var(--gold-ui);box-shadow:0 0 0 2px var(--gold-ui)}
.skin-c[aria-checked="true"]::after{content:"✓";position:absolute;top:12px;inset-inline-end:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--gold-ui);color:#140d02}

.skin-pv{display:grid;grid-template-columns:22% 1fr;grid-template-rows:auto auto 1fr;gap:5px;height:92px;padding:6px;border-radius:11px;background:var(--pv-bg);overflow:hidden;direction:ltr}

.skin-n{font-weight:650;font-size:.95rem;line-height:1.2}

.skin-btn{appearance:none;width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--nav-line);background:rgba(255,255,255,.06);color:var(--on-navy);display:grid;place-items:center;cursor:pointer}

/* clock: iPhone-style looks and the numeral studio */
.ck .ck-num{font-family:var(--ckf);font-weight:var(--ckw,var(--ckw0,600));color:var(--ckc,var(--gold-ui));font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ck-grad .ck .ck-num,.ck-grad .ck-num,.ck-grad .ck-tile{background:var(--ckg);-webkit-background-clip:text;background-clip:text;color:transparent}
.ck-grad .ck-outline .ck-num{-webkit-text-stroke-color:#8B5CF6}
.ck .ck-big{font-size:calc(clamp(2.4rem,12vw,3.4rem) * var(--cks,1))}
.ck .ck-big2{font-size:calc(1.7rem * var(--cks,1))}
.ck-rim{stroke:var(--ckc,var(--gold-ui))}.ck-s{stroke:var(--ckc,var(--gold-ui))}.ck-pin{fill:var(--ckc,var(--gold-ui))}
.ck-top{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:1rem;color:var(--ink)}
.ck-dot{opacity:.5}
.ck-sub{display:flex;justify-content:center;gap:4px 14px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-2)}
/* lock screen */
.ck-lock{--ckw0:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 12px 14px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0%,var(--g2),var(--g1))}
.ck-lock .ck-num{font-size:calc(clamp(4.2rem,24vw,6.4rem) * var(--cks,1));line-height:.95;letter-spacing:-.03em}
/* standby: huge two-tone numerals */
.ck-sb{--ckw0:800;padding:14px 16px;border-radius:24px;background:#0B0B0F;color:#F5F5F7;border:1px solid rgba(255,255,255,.08)}
.ck-sbt{display:flex;align-items:baseline;justify-content:center;gap:.08em;line-height:.9}
.ck-sbt b{font-size:calc(clamp(4.4rem,26vw,7rem) * var(--cks,1))}
.ck-sb .ck-sbt .ck-mm{color:#F5F5F7;-webkit-text-fill-color:#F5F5F7;background:none}
.ck-sb .ck-ss{font-size:calc(1.8rem * var(--cks,1));opacity:.7;align-self:flex-end}
.ck-sb .ck-ap{font-size:1rem;opacity:.7;align-self:flex-start}
.ck-sbd{display:flex;justify-content:center;gap:4px 12px;flex-wrap:wrap;margin-top:8px;font-size:.92rem;color:#C7C7CC}
.ck-sbd .ck-wd{font-weight:700;color:#F5F5F7}
/* stacked hours over minutes */
.ck-stack{--ckw0:800;display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--g1),var(--g2))}
.ck-stk{display:flex;flex-direction:column;align-items:center;line-height:.86;flex:none}
.ck-stk b{font-size:calc(clamp(3.4rem,19vw,4.8rem) * var(--cks,1));letter-spacing:-.03em}
.ck-stk .ck-ss{font-size:calc(1.3rem * var(--cks,1));margin-top:6px;opacity:.75}
.ck-stk .ck-ap{font-size:.85rem;margin-top:4px;color:var(--ink-2)}
/* liquid glass */
.ck-glass{--ckw0:300;position:relative;overflow:hidden;border-radius:26px;padding:6px;background:linear-gradient(135deg,#1e3a8a,#7c3aed 55%,#db2777)}
.ck-blob{position:absolute;border-radius:50%;filter:blur(26px);opacity:.75}
.ck-blob.b1{width:60%;height:120%;inset-inline-start:-10%;top:-30%;background:#22d3ee}
.ck-blob.b2{width:50%;height:100%;inset-inline-end:-8%;bottom:-40%;background:#f59e0b}
.ck-gl{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.18);text-align:center}
.ck-glass .ck-num{font-size:calc(clamp(4rem,23vw,6rem) * var(--cks,1));line-height:.95;color:rgba(255,255,255,.92);text-shadow:0 2px 18px rgba(255,255,255,.35)}
.ck-glass:not(.x) .ck-num{color:var(--ckc-glass,rgba(255,255,255,.92))}
.ck-glass .ck-top{color:#fff}.ck-glass .ck-sub{color:rgba(255,255,255,.85)}
/* outline */
.ck-outline{--ckw0:800;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 12px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--g1),var(--g2))}
.ck-outline .ck-num{font-size:calc(clamp(4rem,23vw,6rem) * var(--cks,1));line-height:.95;color:transparent;-webkit-text-stroke:2px var(--ckc,var(--gold-ui));letter-spacing:.01em}
.ck-grad .ck-outline .ck-num{background:none}
/* flip tiles */
.ck-flip{--ckw0:700;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--g1),var(--g2))}
.ck-tiles{display:flex;align-items:center;gap:6px}
.ck-pair{display:flex;gap:4px}
.ck-tile{position:relative;display:inline-grid;place-items:center;width:calc(2.6rem * var(--cks,1));height:calc(3.6rem * var(--cks,1));border-radius:10px;background:linear-gradient(180deg,#2b2b31 0 49.5%,#1f1f24 50.5% 100%);font-size:calc(2.6rem * var(--cks,1));line-height:1;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.ck-tile::after{content:'';position:absolute;inset-inline:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.ck-colon{font-size:calc(2rem * var(--cks,1));font-weight:700;color:var(--ink-2)}
.ck-flip .ck-ap{font-size:.85rem;color:var(--ink-2);margin-inline-start:4px}
.ck-fl-d{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.92rem;color:var(--ink-2)}
.ck-fl-d .ck-wd{color:var(--ink)}
.ck-min .ck-num{font-size:calc(1.15rem * var(--cks,1))}
/* studio */
.ck-st-h{margin:4px 2px 8px;font-size:.9rem;color:var(--ink-2)}
.ck-studio{display:grid;gap:12px;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--g1)}
.ck-st-r{display:grid;gap:8px}

.ck-st-o{display:flex;flex-wrap:wrap;gap:8px}
.ck-chip{appearance:none;font:inherit;color:var(--ink);cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:7px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.82rem}

/* ================= 7.8: app designs (ORBIT, AURUM); the default design has none of these rules ================= */
.dz-ban{display:none}
.dz-h{margin-top:0}
.dz-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px;grid-column:1/-1}
.dz-in{grid-column:1/-1}
.dz-c{appearance:none;font:inherit;color:var(--ink);text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:7px 7px 10px;border-radius:16px;border:1px solid var(--line);background:var(--g1);min-width:0}

/* ================= 8.0: holiday effects ================= */
.fx-back,.fx-front{position:fixed;inset:0;pointer-events:none}
.fx-back{z-index:0}
.fx-front{z-index:45}
:root[data-fx] .shell{position:relative;z-index:1}
.fx-gar{position:relative;height:52px;margin:-6px 0 4px;pointer-events:none}
.fx-str{position:absolute;inset:0 0 auto;width:100%;height:30px;overflow:visible}
.fx-str path{fill:none;stroke:color-mix(in srgb,var(--ink) 45%,transparent);stroke-width:.6;vector-effect:non-scaling-stroke}
.fx-f{position:absolute;width:22px;transform-origin:50% 0;animation:fxSway 3.2s ease-in-out infinite alternate}
.fx-f svg{display:block;width:22px;height:16px;filter:drop-shadow(0 2px 3px rgba(0,20,80,.35))}
.fx-l{width:20px}.fx-l svg{width:20px;height:34px;margin-top:var(--ln,10px);filter:drop-shadow(0 0 6px rgba(255,200,90,.55))}
.fx-l .fx-glow{animation:fxFlick 1.6s ease-in-out infinite alternate}
@keyframes fxSway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes fxFlick{from{opacity:.65}to{opacity:1}}
.fx-hol{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:14px 16px;border-radius:22px;border:1px solid var(--sk-hh-bd,var(--hero-bd));background:var(--sk-hh,var(--hero-grad));color:var(--sk-hh-v,var(--ink));box-shadow:0 14px 34px var(--shadow)}
.fx-hol::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);transform:translateX(-100%);animation:fxShine 5s ease-in-out 1s infinite;pointer-events:none}
@keyframes fxShine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.fx-txt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.fx-txt b{font-size:1.2rem;line-height:1.2;color:var(--sk-hh-v,var(--ink))}
.fx-txt small{font-size:.86rem;color:var(--sk-hh-l,var(--ink-2))}
.fx-emo{font-size:2.6rem;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:fxBob 2.6s ease-in-out infinite alternate}
@keyframes fxBob{from{transform:translateY(-2px) rotate(-4deg)}to{transform:translateY(3px) rotate(4deg)}}
.fx-wave{width:132px;height:96px;flex:none;margin:-6px -4px -10px -6px}
.fx-go{flex:none;appearance:none;border:1px solid color-mix(in srgb,var(--sk-hh-v,#fff) 40%,transparent);background:rgba(255,255,255,.14);border-radius:999px;width:44px;height:44px;font-size:1.25rem;cursor:pointer;position:relative;z-index:1}
.fx-go:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
/* Independence Day: blue and white, a band of stars, and the flag waving */
.fx-hol-atzmaut{background:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(135deg,#0038B8 0%,#1E5BD8 55%,#0A2A86 100%);border-color:rgba(255,255,255,.55);color:#fff}
.fx-hol-atzmaut .fx-txt b{color:#fff;font-size:1.32rem;text-shadow:0 2px 10px rgba(0,0,40,.5)}
.fx-hol-atzmaut .fx-txt small{color:#DCE7FF}
.fx-hol-atzmaut::before{content:"";position:absolute;inset:auto 0 0;height:6px;background:repeating-linear-gradient(90deg,#fff 0 18px,#0038B8 18px 36px);opacity:.85}
@media (prefers-reduced-motion:reduce){.fx-f,.fx-l .fx-glow,.fx-hol::after,.fx-emo{animation:none}}
:root[data-motion="reduced"] .fx-front{display:none}
@media print{.fx-back,.fx-front,.fx-gar,.fx-hol{display:none !important}}

/* ================= 8.2: Settings in folding sections ================= */
.set-sec:has(> details.sec-acc){padding:0 !important;overflow:hidden}
details.sec-acc > summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:14px 16px;min-height:56px;-webkit-tap-highlight-color:transparent}
details.sec-acc > summary::-webkit-details-marker,details.sub-acc > summary::-webkit-details-marker{display:none}
details.sec-acc > summary .sec-h{margin:0;flex:none;display:flex;align-items:center;gap:10px}
details.sec-acc > summary .sec-h .sec-t{margin:0;font-size:1rem}
.sec-sum{flex:1;min-width:0;color:var(--ink-2);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:end}
.acc-chev{flex:none;width:20px;height:20px;fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details.sec-acc[open] > summary .acc-chev{transform:rotate(180deg)}
details.sec-acc[open] > summary{border-bottom:1px solid var(--line)}
details.sec-acc[open] > summary .sec-sum{visibility:hidden}
.sec-body{padding:12px 16px 16px}
details.sec-acc > summary:focus-visible,details.sub-acc > summary:focus-visible{outline:2px solid var(--gold-ui);outline-offset:-2px;border-radius:12px}
details.sub-acc{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--g1)}
details.sub-acc > summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
details.sub-acc > summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .2s}
details.sub-acc[open] > summary::after{transform:rotate(-135deg)}
details.sub-acc > :not(summary){margin:0 12px 12px}
details.sub-acc .dz-h{display:none}

/* ================= 8.3: smoother scrolling on phones ================= */
/* the theme background stays put without background-attachment:fixed, which makes phones repaint the whole page while scrolling */
:root[data-skin] body{background:var(--bg);background-attachment:scroll}
:root[data-skin] body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--sk-body);pointer-events:none}
/* frosted glass costs a lot on a phone's graphics chip when every card has it: on touch screens only the bottom bar and the
   page header keep the blur; cards get a slightly more solid surface instead */
@media (hover:none),(pointer:coarse){
  :root[data-design] :is(.inputs,.chart,.panel-flat,.sched,.mk,.set-cat .set-sec,.hclock,.svbar,.tile,.hero){-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
  :root[data-design="orbit"] :is(.inputs,.chart,.panel-flat,.sched,.mk,.set-cat .set-sec,.hclock,.svbar){background:linear-gradient(160deg,color-mix(in srgb,var(--surface) 90%,var(--dz-a3) 10%),var(--surface))}
  :root[data-design="aurora"] :is(.inputs,.chart,.panel-flat,.sched,.mk,.set-cat .set-sec,.hclock,.svbar,.tile,.hero){background:color-mix(in srgb,var(--surface) 84%,transparent)}
}
/* taps respond at once (no double-tap zoom wait) */
button,a,select,input,.tile,.bt,summary,label{touch-action:manipulation}
