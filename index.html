  pol_fail:['לא הצלחנו לשמור את ההגדרה בענן. נסו שוב.','تعذّر حفظ الإعداد في السحابة. حاول مرة أخرى.','Could not save the setting in the cloud. Try again.'],
  acc_uniqWarn:['נא לבחור שם משתמש וסיסמה ייחודיים לאפליקציה הזו בלבד! אל תשתמשו בסיסמה של המייל, הבנק או כל שירות אחר.','يرجى اختيار اسم مستخدم وكلمة مرور خاصّين بهذا التطبيق فقط! لا تستخدم كلمة مرور البريد أو البنك أو أي خدمة أخرى.','Please choose a username and password unique to this app only! Do not reuse the password of your email, bank or any other service.'],
  rc_noMailPw:['רק כתובת המייל. האפליקציה לעולם לא תבקש את הסיסמה של חשבון המייל שלכם, ואין להקליד אותה כאן.','عنوان البريد فقط. لن يطلب التطبيق أبدًا كلمة مرور حساب بريدك، فلا تكتبها هنا.','Only the email address. The app will never ask for your email account password, so do not type it here.'],
  rc_newPw:['סיסמה חדשה לאפליקציה','كلمة مرور جديدة للتطبيق','New password for the app'],
  rc_newPw2:['הקלידו שוב את הסיסמה החדשה לאפליקציה','أعد كتابة كلمة مرور التطبيق الجديدة','Type the new app password again'],
  rc_appPwOnly:['זו הסיסמה של האפליקציה בלבד, לא של המייל. בחרו סיסמה ייחודית שלא משמשת בשום מקום אחר.','هذه كلمة مرور التطبيق فقط وليست كلمة مرور البريد. اختر كلمة مرور فريدة لا تُستخدم في أي مكان آخر.','This is the app password only, not your email password. Choose a unique one not used anywhere else.'],
  rc_oneAcc:['כל אימייל יכול להיות משויך לחשבון אחד בלבד. גם גרסאות של אותה תיבה, כמו אותיות גדולות, נקודות ב-Gmail או תוספת +, נחשבות לאותו אימייל.','يمكن ربط كل بريد بحساب واحد فقط. وتُعدّ نسخ الصندوق نفسه، مثل الأحرف الكبيرة أو النقاط في Gmail أو إضافة +، البريد نفسه.','Each email can belong to one account only. Variants of the same inbox, such as capitals, Gmail dots or a +tag, count as the same email.'],
  rc_checking:['בודק שהאימייל פנוי…','جارٍ التحقق من أن البريد غير مستخدم…','Checking that the email is free…'],
  rc_mailTaken:['האימייל הזה כבר משויך לחשבון אחר. כל אימייל יכול להיות רק בחשבון אחד, אז בחרו כתובת אחרת.','هذا البريد مرتبط بحساب آخر. يمكن ربط كل بريد بحساب واحد فقط، فاختر عنوانًا آخر.','This email already belongs to another account. Each email can be used by one account only, so choose another address.'],
  rc_mailCheckFail:['לא הצלחנו לבדוק שהאימייל פנוי. בדקו את החיבור ונסו שוב.','تعذّر التحقق من أن البريد غير مستخدم. تحقق من الاتصال وحاول مرة أخرى.','Could not check that the email is free. Check the connection and try again.'],
  gk_eInP:['בתוך Claude אין גישה ל-Google, ולכן Gemini עובד רק באתר. כאן העוזר עונה עם המודל האישי.','داخل Claude لا يمكن الوصول إلى Google، لذلك يعمل Gemini في الموقع فقط. هنا يجيب المساعد بالنموذج الشخصي.','Inside Claude, Google cannot be reached, so Gemini works only on the website. Here the assistant answers with the personal model.'],
  gk_inClaude:['בתוך Claude העוזר עונה עם המודל האישי, בלי מפתח. מפתח Gemini עובד באתר.','داخل Claude يجيب المساعد بالنموذج الشخصي دون مفتاح. مفتاح Gemini يعمل في الموقع.','Inside Claude the assistant answers with the personal model, no key needed. A Gemini key works on the website.'],

  sp_hint_ex:['מה שלא שויך לאף אחד מתחלק שווה בשווה, והטיפ לפי החלק של כל אחד.','ما لم يُنسب لأحد يُقسم بالتساوي، والبقشيش حسب حصة كل شخص.','Anything not assigned is split equally, and the tip follows each share.'],
  sp_hint_paid:['הקלידו כמה כל אחד שילם בפועל. נחשב מי מעביר למי, עם כמה שפחות העברות.','اكتب كم دفع كل شخص فعلًا. سنحسب من يحوّل لمن بأقل عدد من التحويلات.','Type how much each person actually paid. We work out who pays whom, with as few transfers as possible.'],

  n_sp2:['אפשר לחלק שווה בשווה, לפי הכנסה, אחוזים, חלקים או לפי מה שכל אחד הזמין. בהתחשבנות מחושב מי מעביר למי כדי שכולם ישלמו אותו דבר.','يمكن التقسيم بالتساوي أو حسب الدخل أو النسب أو الحصص أو حسب ما طلبه كل شخص. في التسوية نحسب من يحوّل لمن ليدفع الجميع المبلغ نفسه.','Split equally, by income, percentages, parts or by what each ordered. Settle up works out who pays whom so everyone pays the same.'],

  w_trDonMin:['זיכוי על תרומות ניתן רק מעל סכום מינימלי של כ-200 ₪ בשנה.','خصم التبرعات يُمنح فقط فوق حد أدنى نحو 200 ₪ سنويًا.','The donation credit applies only above a minimum of about 200 ₪ a year.'],
  n_tr:['הערכה בלבד לפי מדרגות המס ונקודות הזיכוי של 2026. אפשר לבקש החזר על 6 השנים האחרונות בטופס 135 או באזור האישי של רשות המסים. סיבות נפוצות להחזר: עבודה רק בחלק מהשנה, כמה מעסיקים, תרומות, ילדים, תואר אקדמי ושירות מילואים.','تقدير فقط حسب شرائح الضريبة ونقاط الخصم لعام 2026. يمكن طلب الاسترداد عن آخر 6 سنوات بنموذج 135 أو في المنطقة الشخصية لسلطة الضرائب. أسباب شائعة: العمل جزءًا من السنة، عدة مشغّلين، تبرعات، أولاد، شهادة جامعية وخدمة الاحتياط.','An estimate only, using the 2026 tax brackets and credit points. You can claim a refund for the last 6 years with form 135 or in the Tax Authority personal area. Common reasons: working part of the year, several employers, donations, children, a degree and reserve duty.'],

  n_jo:['הנטו מחושב לפי 2026, עם הפרשת עובד של 6% לפנסיה ו-2.5% לקרן השתלמות כשיש הפקדת מעסיק. שווי רכב מוסיף מס אבל חוסך הוצאות, ולכן אפשר להזין כמה הרכב חוסך לך. החבילה הכוללת = נטו + כל ההפקדות לחיסכון + רכב והטבות.','يُحسب الصافي حسب 2026 مع اقتطاع 6% للتقاعد و2.5% لصندوق الاستكمال عند وجود إيداع المشغّل. قيمة السيارة تضيف ضريبة لكنها توفّر مصاريف، لذا يمكن إدخال كم توفّر. الحزمة = الصافي + كل الإيداعات + السيارة والمزايا.','Net pay uses 2026 rules, with a 6% employee pension deduction and 2.5% study fund when the employer deposits. A company car adds tax but saves costs, so enter what it saves you. Full package = net + all savings deposits + car and perks.'],

  n_fl:['החישוב מניח 9 ימי חג בשנה, מס הכנסה וביטוח לאומי של עצמאי לפי 2026 (52% מדמי הביטוח מוכרים כהוצאה) ואת נקודות הזיכוי שהזנתם. לא כולל הפקדה לפנסיה, שכדאי להוסיף להוצאות.','يفترض الحساب 9 أيام عطل سنويًا وضريبة الدخل والتأمين الوطني للمستقل حسب 2026 (52% من رسوم التأمين مصروف معترف به) ونقاط الخصم التي أدخلتها. لا يشمل إيداع التقاعد، ويُفضّل إضافته إلى المصاريف.','Assumes 9 holidays a year, 2026 self-employed income tax and National Insurance (52% of NI is deductible) and your credit points. Pension deposits are not included, so add them to costs.'],

  n_ec:['לפי שיעורי 2026: ביטוח לאומי מעסיק 4.51% עד 7,703 ₪ ו-7.6% מעליו, פנסיה 6.5% ופיצויים 8.33% (או 6% לפי ההסכם). לא כולל דמי הבראה וימי חופשה ומחלה, שכבר כלולים בשכר.','حسب نسب 2026: تأمين وطني على المشغّل 4.51% حتى 7,703 ₪ و7.6% فوقه، تقاعد 6.5% وتعويضات 8.33% (أو 6% حسب الاتفاق). لا يشمل بدل الاستجمام وأيام الإجازة والمرض المشمولة في الراتب.','2026 rates: employer National Insurance 4.51% up to 7,703 ₪ and 7.6% above, pension 6.5% and severance 8.33% (or 6% by agreement). Recreation pay, vacation and sick days are already part of pay and not added.'],

  w_mfMax:['דמי הניהול שהוזנו גבוהים מהתקרה בקרן פנסיה (6% מהפקדה, 0.5% מצבירה).','الرسوم المدخلة أعلى من سقف صندوق التقاعد (6% من الإيداع، 0.5% من المتراكم).','These fees are above the pension fund caps (6% of deposits, 0.5% of balance).'],
  n_mf:['דמי ניהול מהפקדה יורדים מכל הפקדה, ודמי ניהול מצבירה מכל הכסף שנצבר. התקרות בחוק: בקרן פנסיה עד 6% מהפקדה ו-0.5% מצבירה; בקופת גמל ובקרן השתלמות עד 4% מהפקדה ו-1.05% מצבירה. אפשר לבקש הנחה או לעבור לקרן זולה יותר.','رسوم الإيداع تُخصم من كل إيداع، ورسوم المتراكم من كل المال المتجمع. السقوف القانونية: صندوق التقاعد حتى 6% من الإيداع و0.5% من المتراكم؛ صندوق الادخار والاستكمال حتى 4% و1.05%. يمكن طلب خصم أو الانتقال لصندوق أرخص.','Deposit fees come off every deposit, balance fees off everything saved. Legal caps: pension funds up to 6% of deposits and 0.5% of balance; provident and study funds up to 4% and 1.05%. You can ask for a discount or move to a cheaper fund.'],

  n_kh:['שכיר: המעסיק מפקיד עד 7.5% והעובד 2.5%, והפקדת המעסיק פטורה ממס עד שכר של 15,712 ₪ בחודש (2026). עצמאי: אפשר לנכות 4.5% מההכנסה עד 13,203 ₪ בשנה, ופטור ממס רווחי הון על הפקדות עד 20,566 ₪ בשנה. הכסף נזיל אחרי 6 שנים (או 3 סמוך לגיל פרישה).','الموظف: المشغّل يودع حتى 7.5% والموظف 2.5%، وإيداع المشغّل معفى حتى راتب 15,712 ₪ شهريًا (2026). المستقل: خصم 4.5% من الدخل حتى 13,203 ₪ سنويًا، وإعفاء من ضريبة الأرباح على إيداعات حتى 20,566 ₪. المال سائل بعد 6 سنوات (أو 3 قرب سن التقاعد).','Employees: the employer deposits up to 7.5% and the employee 2.5%, tax-free up to a salary of 15,712 ₪ a month (2026). Self-employed: deduct 4.5% of income up to 13,203 ₪ a year, with capital gains exemption on deposits up to 20,566 ₪. The money is liquid after 6 years (or 3 near retirement age).'],

  n_ks:['ביטוח לאומי מפקיד 58 ₪ בחודש לכל ילד עד גיל 18 (2026), וההורים יכולים להוסיף 58 ₪ מקצבת הילדים. בגיל 18 מתקבל מענק של 500 ₪, ומי שלא מושך עד גיל 21 מקבל מענק נוסף של 500 ₪. הסכומים מתעדכנים כל שנה, והתשואה תלויה במסלול.','يودع التأمين الوطني 58 ₪ شهريًا لكل طفل حتى سن 18 (2026)، ويمكن للأهل إضافة 58 ₪ من مخصصات الأولاد. في سن 18 تُمنح 500 ₪، ومن لا يسحب حتى 21 يحصل على 500 ₪ إضافية. المبالغ تتحدث سنويًا والعائد حسب المسار.','National Insurance deposits 58 ₪ a month per child until 18 (2026), and parents can add 58 ₪ from the child allowance. A 500 ₪ grant comes at 18, and another 500 ₪ at 21 if the money is left in. Amounts are updated yearly and the return depends on the track.'],

  w_bnCap:['השכר גבוה מהתקרה, ולכן הקצבה מוגבלת ל-{m} ליום.','الأجر أعلى من السقف، لذا الإعانة محددة بـ{m} لليوم.','Pay is above the cap, so the benefit is limited to {m} a day.'],
  n_bnUn:['הערכה לפי כללי 2026: השכר היומי = שכר 6 החודשים האחרונים חלקי 150, והקצבה מחושבת במדרגות (עד גיל 28 בשיעורים נמוכים יותר). תקרה: 550.76 ₪ ליום ב-125 הימים הראשונים ו-367.17 ₪ אחר כך. הקצבה החודשית לפי 25 ימים. מנוכים מס הכנסה ודמי ביטוח, ויש ימי המתנה בתחילת התקופה.','تقدير حسب قواعد 2026: الأجر اليومي = أجر آخر 6 أشهر مقسومًا على 150، وتُحسب الإعانة بشرائح (أقل لمن هم دون 28). السقف: 550.76 ₪ يوميًا لأول 125 يومًا و367.17 ₪ بعدها. الإعانة الشهرية على أساس 25 يومًا. تُخصم ضريبة الدخل ورسوم التأمين، وهناك أيام انتظار.','2026 estimate: daily pay = last 6 months of pay divided by 150, and the benefit is tiered (lower rates under 28). Cap: 550.76 ₪ a day for the first 125 days and 367.17 ₪ after. Monthly figure uses 25 days. Income tax and contributions are deducted, and there are waiting days at the start.'],
  n_bnMat:['הערכה לפי כללי 2026: דמי לידה = השכר ב-3 החודשים שלפני הלידה חלקי 90, עד 1,752.33 ₪ ליום. זכאות מלאה ל-15 שבועות (105 ימים) למי שעבדה 10 חודשים מתוך 14 שלפני הלידה או 15 מתוך 22, ו-8 שבועות למי שעבדה 6 מתוך 14. אם עדיף, השכר נבדק גם לפי 6 חודשים חלקי 180. מנוכים מס הכנסה ודמי ביטוח.','تقدير حسب قواعد 2026: بدل الولادة = أجر 3 أشهر قبل الولادة مقسومًا على 90، حتى 1,752.33 ₪ يوميًا. استحقاق كامل 15 أسبوعًا (105 أيام) لمن عملت 10 أشهر من 14 أو 15 من 22، و8 أسابيع لمن عملت 6 من 14. إن كان أفضل يُفحص أيضًا 6 أشهر على 180. تُخصم الضرائب والرسوم.','2026 estimate: maternity pay = pay in the 3 months before birth divided by 90, up to 1,752.33 ₪ a day. Full entitlement of 15 weeks (105 days) after working 10 of the last 14 months or 15 of 22, and 8 weeks after 6 of 14. If better, 6 months divided by 180 is checked too. Income tax and contributions are deducted.'],

  n_cb:['שווי שימוש 2026: 2.48% ממחיר המחירון בחודש, עד תקרת מחיר של 596,860 ₪. הפחתה חודשית: היברידי 580 ₪, פלאג-אין 1,150 ₪, חשמלי 1,380 ₪. השווי מתווסף להכנסה החייבת, ולכן העלות היא כמה הנטו שלך יורד. לבדיקה מדויקת יש סימולטור ברשות המסים.','قيمة الاستخدام 2026: 2.48% من سعر القائمة شهريًا حتى سقف 596,860 ₪. خصم شهري: هجين 580 ₪، قابل للشحن 1,150 ₪، كهربائي 1,380 ₪. القيمة تُضاف إلى الدخل الخاضع، فالتكلفة هي انخفاض صافيك. للتدقيق يوجد محاكي في سلطة الضرائب.','2026 benefit value: 2.48% of the list price a month, up to a price cap of 596,860 ₪. Monthly reduction: hybrid 580 ₪, plug-in 1,150 ₪, electric 1,380 ₪. The value is added to taxable income, so the cost is how much your net pay drops. The Tax Authority has a simulator for exact figures.'],

function panelHTML(id){
  const defs = DEFS[id];
  const basic = defs.filter(f => !f.adv);
  const groups = [];
  defs.filter(f => f.adv).forEach(f => {
    let g = groups.find(x => x[0] === f.adv);
    if (!g) groups.push(g = [f.adv, []]);
    g[1].push(f);
  });
  const advHTML = groups.map(([k, fs]) =>
    `<details class="adv"><summary data-i="${k}"></summary><div class="fields">${fs.map(fieldHTML).join('')}</div></details>`).join('');

function sparkSVG(vals){
  const pts = vals.filter(x => isFinite(x));
  if (pts.length < 2) return '';
  const mx = Math.max(...pts), mn = Math.min(0, ...pts), W = 200, H = 100, span = (mx - mn) || 1;
  const xy = pts.map((b, i) => [i / (pts.length - 1) * W, H - 6 - (b - mn) / span * (H - 16)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C45A" stop-opacity=".45"/><stop offset="1" stop-color="#F2C45A" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W} ${H} L0 ${H}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#FFD97A" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function chartTotals(ch){
  if (!ch || !ch.layers || !ch.layers.length) return [];
  const n = Math.max(...ch.layers.map(l => (l.values || []).length));
  const out = [];
  for (let i = 0; i < n; i++) out.push(ch.layers.reduce((s, l) => s + (+(l.values || [])[i] || 0), 0));
  return out;
}
const hmTime = () => new Intl.DateTimeFormat(locOf(), {hour:'2-digit', minute:'2-digit', second:'2-digit'}).format(new Date());
function renderMarket(){
  const box = $('#hm'); if (!box) return;
  const fx = (a, b) => RATES[a] && RATES[b] ? RATES[b] / RATES[a] : NaN;
  const dOnly = u => { try { return new Intl.DateTimeFormat(locOf(), {dateStyle:'medium', timeZone:'UTC'}).format(new Date(u * 1000)); } catch (e) { return ''; } };
  const liveS = t('mk_liveAt', {t: hmTime()});
  const fxS = META.live ? liveS : META.official ? t('mk_official', {d: dOnly(META.unix)}) : t('mk_asof', {d: dOnly(META.unix)}), cd = dOnly(META.cunix);
  const btc = RATES.BTC ? 1 / RATES.BTC : NaN;
  const cards = [
    ['mk_usd', N(fx('USD', 'ILS'), null, 4) + ' ₪', fxS, fx('USD', 'ILS')],
    ['mk_eur', N(fx('EUR', 'ILS'), null, 4) + ' ₪', fxS, fx('EUR', 'ILS')],
    ['mk_btc', '$' + N(btc, null, 0), META.cryptoLive ? liveS : t('mk_asof', {d: cd}), btc],
    ['mk_boi', PC(MKT.boi), t('mk_boi_s', {d: MKT.boiDate, n: MKT.boiNext})],
    ['mk_prime', PC(MKT.boi + 1.5), t('mk_prime_s')],
    ['mk_cpi', PC(MKT.cpi), t('mk_cpi_s', {m: MKT.cpiMonth})]
  ];
  const prev = renderMarket.prev || {};
  box.innerHTML = cards.map(c => {
    const raw = c[3], p = prev[c[0]];
    const cls = raw != null && p != null && raw !== p ? (raw > p ? ' up' : ' down') : '';
    return `<div class="mk${cls}"><span class="mk-l">${t(c[0])}</span><b class="num">${c[1]}</b><small>${c[2]}</small></div>`;
  }).join('');
  renderMarket.prev = {}; cards.forEach(c => { if (c[3] != null) renderMarket.prev[c[0]] = c[3]; });
  const n = $('#hm_n'); if (n) n.textContent = t('mk_note');
}
function calcHome(){
  const items = [];
  TOUCHED.forEach(id => { const r = dashResult(id); if (r) items.push({id, r}); });
  const hh = $('#hh'), hs = $('#hs'), ht = $('#hs_t');
  if (items.length){
    const top = items[0], r = top.r;
    hh.classList.remove('empty');
    hh.innerHTML = `<div class="l">${t('tab_' + top.id)} · ${strip(r.hero.label)}</div><div class="v num">${r.hero.value}</div>
      <div class="s">${r.hero.sub ? strip(r.hero.sub) + '<br>' : ''}<span class="live-dot"></span>${t('home_live', {t: hmTime()})}</div>
      ${sparkSVG(chartTotals(r.chart))}
      <button type="button" class="hh-go" data-go="${top.id}" data-i="home_open">${t('home_open')}</button>`;
    const rest = items.slice(1);
    ht.hidden = !rest.length;
    hs.innerHTML = rest.map(({id, r}) => `<button type="button" class="mine-c" data-go="${id}">${ICON[id] || ''}
      <span class="mine-t">${t('tab_' + id)}</span><b class="num">${r.hero.value}</b><small>${strip(r.hero.label)}</small></button>`).join('');
  } else {
    hh.classList.add('empty');
    hh.innerHTML = `<div class="l">${t('home_empty_t')}</div><div class="s">${t('home_empty_s')}</div>
      <button type="button" class="gold-btn hh-start" data-go="compound">${t('home_empty_b')}</button>`;
    ht.hidden = true; hs.innerHTML = '';
  }
  const rem = $('#hrem');
  if (rem) rem.innerHTML = items.length && SET.remember !== '1'
    ? `<p class="home-rem">${t('home_rem')} <button type="button" class="as-go" id="home_rem">${t('home_rem_b')}</button></p>` : '';
  renderMarket();
  return null;
}

function clDue(c, kind, now){

    if ((c.done || {})[key]) continue;

/* ================= chart ================= */
function niceMax(x){
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / p;
  const nm = m <= 1 ? 1 : m <= 2 ? 2 : m <= 4 ? 4 : m <= 8 ? 8 : 10;
  return nm * p;
}
function compact(x){
  const f = (n, s) => (n >= 10 ? Math.round(n) : Math.round(n*10)/10) + s;
  if (x >= 1e9) return f(x/1e9, 'B');
  if (x >= 1e6) return f(x/1e6, 'M');
  if (x >= 1e3) return f(x/1e3, 'K');
  return String(Math.round(x*100)/100);
}
function drawChart(el){
  const s = el._spec; if (!s) return;
  const wrap = $('.svgwrap', el);
  const W = Math.max(260, Math.floor(wrap.clientWidth) || 600), H = 240;
  const pl = 44, pr = 6, pt = 8, pb = 26, ih = H - pt - pb;
  const n = s.labels.length;
  const totals = s.labels.map((_, i) => s.layers.reduce((a, l) => a + Math.max(0, l.values[i] || 0), 0));
  const max = niceMax(Math.max(1e-9, ...totals));
  const bw = (W - pl - pr) / n, gap = Math.min(5, bw * 0.2);
  const step = Math.ceil(n / Math.max(1, Math.floor((W - pl) / 36)));
  let g = '';
  for (let k = 0; k <= 4; k++){
    const y = pt + ih * (1 - k/4);
    g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${compact(max*k/4)}</text>`;
  }
  for (let i = 0; i < n; i++){
    let acc = 0;
    s.layers.forEach(l => {
      const val = Math.max(0, l.values[i] || 0);
      const h = val / max * ih;
      if (h > 0){
        const y = pt + ih - (acc / max * ih) - h;
        g += `<rect class="${l.cls}" rx="2" x="${(pl + i*bw + gap/2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw-gap).toFixed(1)}" height="${h.toFixed(1)}"><title>${s.unit ? s.unit + ' ' : ''}${s.labels[i]}: ${l.name} – ${s.fmt(val)}</title></rect>`;
      }
      acc += val;
    });
    if (i % step === 0){
      g += `<text class="ax" x="${(pl + i*bw + bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${s.labels[i]}</text>`;
    }
  }
  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.title}" style="direction:ltr">${g}</svg>`;
}

const rateOf = (from, to) => RATES[to] / RATES[from];

/* --- converter --- */
function calcConvert(){
  const amt = v('x_amount');
  const from = $('#x_from').value, to = $('#x_to').value;
  if (!RATES[from] || !RATES[to]) return null;
  const raw = parseFloat($('#x_rate').value);
  const manual = isFinite(raw) && raw > 0 ? raw : null;
  const fee = clamp(v('x_fee'), 0, 50) / 100;
  const r = manual != null ? manual : rateOf(from, to);
  const gross = amt * r, out = gross * (1 - fee);
  const rows = [
    [t('r_rate'),    `1 ${from} = ${RN(r)} ${to}`],
    [t('r_rateInv'), `1 ${to} = ${RN(1 / r)} ${from}`]
  ];
  if (fee > 0) rows.push(
    [t('r_feeAmt'), M(gross - out, dec(gross, to), to)],
    [t('r_afterFee'), M(out, dec(out, to), to), 'key'],
    [t('r_effRateFee'), `1 ${from} = ${RN(r * (1 - fee))} ${to}`]);
  rows.push(
    [t('r_rateSrc'), manual != null ? t('s_manual') : (META.live ? t('s_live') : META.official ? t('s_official') : t('s_snap'))],
    [t('r_rateDate'), dateStr()]);
  const all = $('#x_list').value === 'all';
  const lm = $('#x_list').value;
  const list = (lm === 'crypto' ? Object.keys(CRYPTO) : all ? Object.keys(RATES).filter(c => !CRYPTO[c]).sort() : pinList()).filter(c => c !== from && RATES[c]);
  return {
    hero: {label: `<bdi dir="ltr">${N(amt, null, 2)} ${from} =</bdi>`, value: M(out, dec(out, to), to),
           sub: `<bdi dir="ltr">1 ${from} = ${RN(r * (1 - fee))} ${to}</bdi>`},
    rows, warn: (staleWarn() || []).concat(cryptoWarn(from, to)),
    table: {
      title: t('t_otherCur'), open: true,
      head: [t('h_currency'), t('f_amount')],
      rows: list.map(c => {
        const val = amt * rateOf(from, c) * (1 - fee);
        return [`${c} – ${curName(c)}`, M(val, dec(val, c), c)];
      })
    }
  };
}
/* --- VAT --- */
function calcVat(){
  const amt = Math.max(0, v('v_amount')), mode = $('#v_mode').value, preset = $('#v_preset').value;
  const rate = Math.max(0, preset === 'c' ? v('v_rate') : parseFloat(preset)) / 100;
  const qty = v('v_qty') > 0 ? v('v_qty') : 1, disc = clamp(v('v_disc'), 0, 100) / 100;
  let uNet, uVat, preNet;
  if (mode === 'add'){ preNet = amt; uNet = amt * (1 - disc); uVat = uNet * rate; }
  else if (mode === 'extract'){ preNet = amt / (1 + rate); uNet = amt * (1 - disc) / (1 + rate); uVat = uNet * rate; }
  else { uVat = amt; uNet = rate > 0 ? amt / rate : 0; preNet = uNet; }
  const uGross = uNet + uVat;
  const net = uNet * qty, vat = uVat * qty, gross = uGross * qty;
  const rows = [];
  if (disc > 0 && mode !== 'fromvat') rows.push([t('r_discAmt'), M(-(preNet - uNet) * qty, 2)]);
  rows.push([t('r_vatNet'), M(net, 2)], [t('r_vatAmt'), M(vat, 2)], [t('r_vatTotal'), M(gross, 2), 'key'],
            [t('r_vatShare'), PC(gross ? vat / gross * 100 : NaN)]);
  if (qty !== 1) rows.push([t('r_unitNet'), M(uNet, 2)], [t('r_unitGross'), M(uGross, 2)]);
  const showNet = mode === 'extract';
  return {
    hero: {label: t(showNet ? 'r_vatNet' : 'r_vatTotal'), value: M(showNet ? net : gross, 2), sub: t('s_vatSub', {v: M(vat, 2)})},
    rows, note: t('n_vat')
  };
}

/* --- Israeli income tax helpers --- */
function taxByBrackets(income){
  let prev = 0, tax = 0;
  const parts = [];
  for (const [lim, r] of TAX.brackets){
    const amt = Math.max(0, Math.min(income, lim) - prev);
    parts.push({from: prev, to: lim, rate: r, amt, tax: amt * r});
    tax += amt * r;
    prev = lim;
  }
  const sur = Math.max(0, income - TAX.surtaxFrom) * TAX.surtaxRate;
  return {tax, sur, parts};
}
function surtaxOf(total, cap){
  const ex = Math.max(0, total - TAX.surtaxFrom);
  return {s3: ex * TAX.surtaxRate, s2: Math.min(Math.max(0, cap), ex) * 0.02};
}
function marginalRate(income){
  let rate = TAX.brackets[0][1];
  for (const [lim, r] of TAX.brackets){ rate = r; if (income <= lim) break; }
  return rate + (income > TAX.surtaxFrom ? TAX.surtaxRate : 0);
}
function niSelf(annual){
  const m = annual / 12;
  const low = Math.min(m, TAX.niCut), high = Math.max(0, Math.min(m, TAX.niMax) - TAX.niCut);
  return (low * 0.077 + high * 0.18) * 12;
}
function salaryCalc(g, pts, pensPct, studyPct, o){
  const bonus = o.bonus / 12, base = g + bonus, cash = o.cash || 0, carPay = o.carPay || 0, taxBase = base + o.benefit + cash;
  const b = taxByBrackets(taxBase * 12);
  const pens = base * pensPct / 100;
  const qual = Math.min(pens, TAX.pensDepRate * Math.min(base, TAX.pensSalaryCap));
  const credits = pts * TAX.point + TAX.pensCreditRate * qual * 12;
  const used = Math.min(credits, b.tax);
  const tax = (b.tax - used + b.sur) / 12;
  const low = Math.min(taxBase, TAX.niCut), high = Math.max(0, Math.min(taxBase, TAX.niMax) - TAX.niCut);
  const ni = low * TAX.niLow + high * TAX.niHigh;
  const health = low * TAX.hLow + high * TAX.hHigh;
  const study = base * studyPct / 100;
  const ded = tax + ni + health + pens + study + carPay;
  const erP = base * o.erPens / 100, erS = base * o.erSev / 100, erSt = base * o.erStudy / 100;
  const erNi = low * TAX.erNiLow + high * TAX.erNiHigh;
  return {gross: base, bonus, net: base + cash - ded, tax, ni, health, pens, study, ded, credits: used / 12, cash, carPay,
          erP, erS, erSt, erNi, employer: base + cash + erP + erS + erSt + erNi};
}
/* --- work car inside the salary --- */
function salCar(){
  const sel = document.getElementById('s_car');
  if (!sel || sel.value !== 'co' || typeof IL26 === 'undefined') return null;
  const price = Math.max(0, v('s_carPrice')), kind = $('#s_carKind').value, pay = Math.max(0, v('s_carPay')), extra = Math.max(0, v('s_carExtra'));
  const base = Math.min(price, IL26.carCap) * IL26.carPct, dd = Math.min(base, IL26.carDed[kind] || 0), val = Math.max(0, base - dd - pay);
  return {price, kind, pay, extra, gil: $('#s_carGil').value === 'y', base, dd, val};
}
function carBrackets(tb0, add, r, r0){
  const A = taxByBrackets(tb0 * 12), B = taxByBrackets((tb0 + add) * 12), rows = [];
  let sum = 0;
  B.parts.forEach((p, i) => {
    const amt = (p.amt - A.parts[i].amt) / 12;
    if (amt < 0.5) return;
    const tx = amt * p.rate, a = p.from / 12, b = p.to / 12;
    sum += tx;
    rows.push({c: [!a ? t('r_brUpTo', {b: N(b)}) : isFinite(b) ? t('r_brFromTo', {a: N(a), b: N(b)}) : t('r_brOver', {a: N(a)}), PC(p.rate * 100), MI(amt), MI(tx)]});
  });
  const sur = (B.sur - A.sur) / 12, cred = (r.tax - r0.tax) - sum - sur, ni = (r.ni + r.health) - (r0.ni + r0.health);
  if (sur > 0.5) rows.push({c: [t('r_brSur'), PC(TAX.surtaxRate * 100), MI(add), MI(sur)]});
  if (Math.abs(cred) > 0.5) rows.push({c: [t('r_brCred'), '', '', MI(cred)]});
  rows.push({c: [t('r_brNi'), PC(add > 0 ? ni / add * 100 : NaN), MI(add), MI(ni)]});
  const tot = r.tax - r0.tax + ni;
  rows.push({key: true, c: [t('r_brTotal'), PC(add > 0 ? tot / add * 100 : NaN), MI(add), MI(tot)]});
  return {rows, m0: marginalRate(tb0 * 12), m1: marginalRate((tb0 + add) * 12)};
}
function withCar(g, pts, pens, study, o, car){
  if (!car) return o;
  const oc = Object.assign({}, o, {benefit: o.benefit + car.val, carPay: car.pay + car.extra});
  if (!car.gil || car.val <= 0) return oc;
  const want = salaryCalc(g, pts, pens, study, Object.assign({}, o, {carPay: oc.carPay})).net;
  let lo = 0, hi = car.val * 3 + 100;
  for (let i = 0; i < 50; i++){
    const mid = (lo + hi) / 2;
    if (salaryCalc(g, pts, pens, study, Object.assign({}, oc, {cash: mid})).net < want) lo = mid; else hi = mid;
  }
  oc.cash = (lo + hi) / 2;
  return oc;
}

function payslipRows(r, o){
  const pc = x => PC(r.gross > 0 ? x / r.gross * 100 : NaN);
  const L = [[t('r_grossMonthly'), r.gross], [t('r_incomeTax'), -r.tax], [t('r_ni'), -r.ni], [t('r_health'), -r.health]];
  if (r.pens > 0) L.push([t('r_pensionRow'), -r.pens]);
  if (r.study > 0) L.push([t('r_studyRow'), -r.study]);
  if (r.carPay > 0) L.push([t('r_sCarPay'), -r.carPay]);

  L.push([t('r_totalDed'), -r.ded], [t('r_netMonthly'), r.net]);
  return L.map(([a, b]) => [a, MI(b), pc(Math.abs(b))]);
}

function calcTaxTab(){
  const monthly = $('#t_period').value === 'm';
  const earned = Math.max(0, v('t_income')) * (monthly ? 12 : 1);
  const cap = Math.max(0, v('t_cap')), deduct = Math.max(0, v('t_deduct'));
  const income = Math.max(0, earned - deduct);
  const pts = pointsOf('t');
  const b = taxByBrackets(income);
  const sr = surtaxOf(income + cap, cap);
  const ptsCred = pts * TAX.point;
  const pensCred = TAX.pensCreditRate * Math.min(Math.max(0, v('t_pensDep')), TAX.pensDepRate * Math.min(earned, TAX.pensSalaryCap * 12));
  const donCred = 0.35 * Math.min(Math.max(0, v('t_donation')), 0.3 * income);
  const locCred = clamp(v('t_locRate'), 0, 100) / 100 * Math.min(income, Math.max(0, v('t_locCap')));
  const other = Math.max(0, v('t_other'));
  const credits = ptsCred + pensCred + donCred + locCred + other;
  const used = Math.min(credits, b.tax);
  const payable = b.tax - used + sr.s3 + sr.s2;
  const eff = income > 0 ? payable / income * 100 : NaN;
  const marg = marginalRate(income + cap) * 100;
  const rows = [[t('r_incomeYear'), MI(earned)]];
  if (deduct > 0) rows.push([t('r_deducted'), MI(-deduct)]);
  rows.push([t('r_taxBefore'), MI(b.tax)]);
  if (sr.s3 > 0) rows.push([t('r_surtax'), MI(sr.s3)]);
  if (sr.s2 > 0) rows.push([t('r_surCap'), MI(sr.s2)]);
  rows.push([t('r_points'), ptsTxt('t', pts)], [t('r_ptsCred'), MI(-Math.min(ptsCred, b.tax))]);
  if (pensCred > 0) rows.push([t('r_pensCred'), MI(-pensCred)]);
  if (donCred > 0) rows.push([t('r_donCred'), MI(-donCred)]);
  if (locCred > 0) rows.push([t('r_locCred'), MI(-locCred)]);
  rows.push(
    [t('r_credApplied'), MI(-used)],
    [t('r_taxPayable'), MI(payable), 'key'],
    [t('r_effRate'), PC(eff)],
    [t('r_margRate'), PC(marg)],
    [t('r_perMonth'), MI(payable / 12)],
    [t('r_afterTax'), MI(earned - payable)]);
  const parts = b.parts.filter(p => p.amt > 0);
  const tableRows = parts.map(p => [`${N(p.from)} – ${isFinite(p.to) ? N(p.to) : '∞'}`, PC(p.rate * 100), MI(p.amt), MI(p.tax)]);
  if (sr.s3 > 0) tableRows.push([`${t('r_surtax')} ${N(TAX.surtaxFrom)}+`, PC(TAX.surtaxRate * 100), MI(income + cap - TAX.surtaxFrom), MI(sr.s3)]);
  return {
    hero: {
      label: t(monthly ? 'r_taxMonth' : 'r_taxYear'),
      value: MI(payable / (monthly ? 12 : 1)),
      sub: t('s_taxSub', {e: PC(eff), m: PC(marg)})
    },
    rows,
    note: t('n_tax2') + ' ' + t('n_points'),
    chart: {
      title: t('c_taxBracket'), unit: '', fmt: x => MI(x),
      layers: [{name: t('l_tax'), cls:'c-ink', values: parts.map(p => p.tax)}],
      labels: parts.map(p => `${N(p.rate * 100)}%`)
    },
    table: {
      title: t('t_brackets'),
      head: [t('h_bracket'), t('h_rate'), t('h_inBracket'), t('h_taxCol')],
      rows: tableRows
    }
  };
}

function calcSelfemp(){
  const rev = Math.max(0, v('e_rev')), exp = Math.max(0, v('e_exp'));
  const profit = Math.max(0, rev - exp);
  const ni = niSelf(profit), niDed = ni * 0.52;
  const pensIn = Math.max(0, v('e_pens'));
  const qual = Math.min(profit, 232800);
  const credPart = Math.min(pensIn, 0.055 * qual);
  const dedPart = Math.min(Math.max(0, pensIn - credPart), 0.11 * qual);
  const pens = credPart + dedPart;
  const taxable = Math.max(0, profit - niDed - dedPart);
  const pts = pointsOf('e');
  const b = taxByBrackets(taxable);
  const credits = pts * TAX.point + TAX.pensCreditRate * credPart;
  const used = Math.min(credits, b.tax);
  const tax = b.tax - used + b.sur;
  const net = profit - ni - tax - pens;
  const burden = profit > 0 ? (ni + tax) / profit * 100 : NaN;
  const corpNet = profit * (1 - 0.23) * (1 - 0.30);
  const rows = [
    [t('f_revenue'), MI(rev)], [t('f_expenses'), MI(-exp)],
    [t('r_profit'), MI(profit), 'key'],
    [t('r_niSelf'), MI(-ni)],
    [t('r_niDed'), MI(niDed)]
  ];
  if (dedPart > 0) rows.push([t('r_pensDed'), MI(dedPart)]);
  rows.push(
    [t('r_taxableSelf'), MI(taxable)],
    [t('r_points'), ptsTxt('e', pts)],
    [t('r_taxSelf'), MI(-tax)]);
  if (pens > 0) rows.push([t('r_pensionRow'), MI(-pens)]);
  rows.push(
    [t('r_netSelfY'), MI(net), 'key'],
    [t('r_netSelfM'), MI(net / 12), 'key'],
    [t('r_burden'), PC(burden)],
    [t('r_margRate'), PC(marginalRate(taxable) * 100)]);
  if ($('#e_dealer').value === 'murshe') rows.push([t('r_vatNote', {v: MI(rev)}), MI(rev * 0.18)]);
  rows.push([t('r_corpCompare'), MI(corpNet)]);
  return {
    hero: {label: t('r_netSelfM'), value: MI(net / 12), sub: t('r_netSelfY') + ': ' + MI(net)},
    rows, note: t('n_selfemp') + ' ' + t('n_points'),
    split: {
      title: t('c_split'),
      items: [
        {name: t('l_netPay'),   v: net,   cls:'c-ink',    fmt: MI(net)},
        {name: t('l_incTax'),   v: tax,   cls:'c-accent', fmt: MI(tax)},
        {name: t('l_niHealth'), v: ni,    cls:'c-warm',   fmt: MI(ni)},
        {name: t('l_savings'),  v: pens,  cls:'c-soft',   fmt: MI(pens)}
      ]
    }
  };
}
/* --- rental income --- */
function calcRental(){
  const rentM = Math.max(0, v('r_rent')), yr = rentM * 12, other = Math.max(0, v('r_other'));
  const exp = Math.max(0, v('r_exp')), dep = Math.max(0, v('r_dep'));
  const pts = pointsOf('r');
  const E1 = 5654, E2 = 11308;
  const incTax = inc => { const b = taxByBrackets(inc); return Math.max(0, b.tax - pts * TAX.point) + b.sur; };
  const base = incTax(other);
  const taxableM = rentM <= E1 ? 0 : rentM >= E2 ? rentM : 2 * rentM - E2;
  const exemptAvail = rentM < E2;
  const tExempt = incTax(other + taxableM * 12) - base;
  const t10 = yr * 0.10;
  const tReg = incTax(other + Math.max(0, yr - exp - dep)) - base;
  const opts = [[t('r_trackReg'), tReg]];
  opts.push([t('r_track10'), t10]);
  if (exemptAvail) opts.push([t('r_trackExempt'), tExempt]);
  const best = opts.reduce((a, b) => b[1] < a[1] ? b : a);
  const rows = [
    [t('r_rentYear'), MI(yr)],
    [t('r_exemptCeil'), MI(E1)],
    [t('r_points'), ptsTxt('r', pts)],
    [t('r_trackExempt'), exemptAvail ? MI(tExempt) : t('r_na')],
    [t('r_track10'), MI(t10)],
    [t('r_trackReg'), MI(tReg)],
    [t('r_best'), best[0], 'key'],
    [t('r_netRent'), MI(yr - best[1]), 'key']
  ];
  return {
    hero: {label: t('r_best') + ': ' + best[0], value: MI(best[1]), sub: t('r_netRent') + ': ' + MI(yr - best[1])},
    rows, note: t('n_rental') + ' ' + t('n_points'),
    chart: {
      title: t('r_best'), unit: '', fmt: x => MI(x),
      layers: [{name: t('l_tax'), cls:'c-warm', values: opts.map(o => o[1])}],
      labels: opts.map(o => o[0].split(' ').pop())
    },
    table: {
      title: t('r_best'), open: true,
      head: [t('h_bracket'), t('l_tax'), t('r_netRent')],
      rows: opts.map(o => [o[0], MI(o[1]), MI(yr - o[1])])
    }
  };
}
/* --- capital gains --- */
function calcCapital(){
  const kind = $('#cp_kind').value;
  const rates = {sec:.25, sub:.30, crypto:.25, div:.25, divsub:.30, int15:.15, int25:.25};
  const rate = rates[kind], isGain = ['sec','sub','crypto'].includes(kind);
  const sell = Math.max(0, v('cp_sell')), buy = Math.max(0, v('cp_buy')), fee = Math.max(0, v('cp_fee'));
  const cpi = kind === 'crypto' ? 0 : Math.max(0, v('cp_cpi'));
  const lossCf = Math.max(0, v('cp_loss')), other = Math.max(0, v('cp_other'));
  let nom = sell, infl = 0, real = sell, lossUsed = 0, taxable;
  if (isGain){
    nom = sell - buy - fee;
    infl = nom > 0 ? Math.min(nom, buy * cpi / 100) : 0;
    real = nom - infl;
    lossUsed = Math.min(Math.max(0, real), lossCf);
    taxable = Math.max(0, real - lossUsed);
  } else taxable = sell;
  const tax = taxable * rate;
  const a = surtaxOf(other + taxable, taxable), z = surtaxOf(other, 0);
  const sur = a.s3 - z.s3 + a.s2;
  const totalTax = tax + sur;
  const proceeds = (isGain ? sell - fee : sell) - totalTax;
  const rows = [];
  if (isGain){
    rows.push([t('r_nomGain'), M(nom)]);
    if (cpi > 0) rows.push([t('r_inflPart'), M(-infl)], [t('r_realGain'), M(real)]);
    if (lossUsed > 0) rows.push([t('r_lossUsed'), M(-lossUsed)]);
  }
  rows.push([t('r_taxableGain'), M(taxable)], [t('r_taxRate'), PC(rate * 100)], [t('r_taxAmt'), M(tax)]);
  if (sur > 0) rows.push([t('r_surCapTax'), M(sur)]);
  rows.push([t('r_netProceeds'), M(proceeds), 'key'], [t('r_effTax'), PC(isGain ? (nom > 0 ? totalTax / nom * 100 : NaN) : (sell > 0 ? totalTax / sell * 100 : NaN))]);
  return {
    hero: {label: t('r_taxAmt'), value: M(totalTax), sub: t('r_netProceeds') + ': ' + M(proceeds)},
    rows, note: t('n_capital'),
    split: {
      title: t('r_netProceeds'),
      items: [
        {name: t('r_netProceeds'), v: Math.max(0, proceeds), cls:'c-ink', fmt: M(proceeds)},
        {name: t('r_taxAmt'), v: totalTax, cls:'c-warm', fmt: M(totalTax)}
      ]
    }
  };
}

/* --- loan engine --- */
function loanSim(o){
  const r = o.rate / 1200, ci = Math.pow(1 + o.ci / 100, 1 / 12) - 1;
  let bal = o.amt, m = 0;
  const out = [];
  while (bal > 0.005 && m < o.n){
    m++;
    const idx = bal * ci; bal += idx;
    const int = bal * r, rem = o.n - m + 1;
    let pr;
    if (m <= o.grace) pr = 0;
    else if (o.type === 'annuity'){
      const pay = r === 0 ? bal / rem : bal * r / (1 - Math.pow(1 + r, -rem));
      pr = pay - int;
    } else if (o.type === 'equal') pr = bal / rem;
    else pr = m >= o.n ? bal : 0;
    if (o.base && o.mode === 'shorten' && m > o.grace && o.base[m - 1] != null) pr = Math.max(0, o.base[m - 1] - int);
    if (o.extra) pr += o.extra;
    if (o.pre && m === o.preM) pr += o.pre;
    pr = Math.min(pr, bal);
    if (m === o.n) pr = bal;
    bal -= pr;
    out.push({int, pr, idx, pay: int + pr, bal: Math.max(0, bal)});
  }
  return out;
}
function yearsOf(sim){
  const Y = [];
  sim.forEach((s, i) => {
    const y = Math.floor(i / 12);
    if (!Y[y]) Y[y] = {pr:0, int:0, idx:0, pay:0, end:0};
    Y[y].pr += s.pr; Y[y].int += s.int; Y[y].idx += s.idx; Y[y].pay += s.pay; Y[y].end = s.bal;
  });
  return Y;
}
function fmtDur(months){
  return t('w_yrsMonths', {y: Math.floor(months / 12), m: months % 12});
}
function calcLoan(){
  const amt = Math.max(0, v('l_amount')), rate = Math.max(0, v('l_rate'));
  const yrs = clamp(v('l_years'), 0.25, 50), type = $('#l_type').value;
  const n = Math.max(1, Math.round(yrs * 12));
  const grace = clamp(Math.round(v('l_grace')), 0, n - 1);
  const extra = Math.max(0, v('l_extra')), pre = Math.max(0, v('l_pre')), preM = clamp(Math.round(v('l_preM')), 1, n);
  const cpi = clamp(v('l_cpi'), 0, 30), feePct = Math.max(0, v('l_feePct')), feeFix = Math.max(0, v('l_feeFix'));
  const cfg = {amt, rate, n, type, grace, ci: cpi, extra: 0, pre: 0, preM};
  const base = loanSim(cfg);
  const has = extra > 0 || pre > 0;
  const sim = has ? loanSim(Object.assign({}, cfg, {extra, pre, mode: $('#l_after').value, base: base.map(x => x.pay)})) : base;
  const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);
  const totalInt = sum(sim, 'int'), idxTot = sum(sim, 'idx'), paid = sum(sim, 'pay');
  const fee = amt * feePct / 100 + feeFix;
  /* effective annual cost (IRR on cash flows) */
  const net0 = amt - fee;
  let lo = 0, hi = 1;
  const f = x => sim.reduce((s, c, i) => s + c.pay / Math.pow(1 + x, i + 1), 0) - net0;
  for (let i = 0; i < 100; i++){ const mid = (lo + hi) / 2; if (f(mid) > 0) lo = mid; else hi = mid; }

  return {

}

  const loan = Math.max(0, price - down), ltv = price > 0 ? loan / price * 100 : 0;

                       grace: 0, ci: kind === 'cpi' ? cpi : 0, extra: 0, pre: 0, preM: 0});

      rows.push([t('r_trackPay', {n: i}), M(s[0].pay)]);
    }
  });
  const sum = k => sims.reduce((a, s) => a + s.reduce((b, x) => b + x[k], 0), 0);
  const totalInt = sum('int') + sum('idx'), paid = sum('pay');
  const pti = income > 0 ? firstTotal / income * 100 : NaN;

    [t('r_mTotInt'), M(totalInt)], [t('r_mTotPaid'), M(paid), 'key'],

  if (isFinite(pti) && pti > 50) warn.push(t('w_pti', {a: N(pti, 1)}));
  const Ys = sims.map(yearsOf), len = Math.max(0, ...Ys.map(y => y.length));
  const agg = k => Array.from({length: len}, (_, i) => Ys.reduce((a, y) => a + (y[i] ? y[i][k] : 0), 0));
  const prY = agg('pr'), intY = agg('int').map((x, i) => x + agg('idx')[i]);
  const endY = Array.from({length: len}, (_, i) => Ys.reduce((a, y) => a + (y[i] ? y[i].end : 0), 0));
  return {
    hero: {label: t('r_firstTotal'), value: M(firstTotal), sub: t('r_mLoan') + ': ' + M(loan) + ' · ' + t('r_ltv') + ' ' + PC(ltv)},
    rows, note: t('n_mortgage'),
    warn: warn.length ? warn : [t('w_ok')], warnOk: !warn.length,

      title: t('c_mortChart'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_principal'), cls:'c-ink', values: prY}, {name: t('l_interest'), cls:'c-warm', values: intY}],

    },

      title: t('t_amort'),
      head: [t('w_year'), t('l_principal'), t('l_interest'), t('h_balance')],
      rows: prY.map((x, i) => [i + 1, M(x), M(intY[i]), M(endY[i])])
    }

/* --- compound interest --- */
function compSim(o, months){
  const rate = (o.rate - o.fee) / 100, f = o.f;
  const rm = Math.pow(1 + rate / f, f / 12) - 1;
  let bal = o.p0, dep = o.p0, m = 0;
  const hist = [];
  for (; m < months; m++){
    const k = m % 12, y = Math.floor(m / 12);
    if (k === 0 && o.yearly){ bal += o.yearly; dep += o.yearly; }
    const d = o.mo * Math.pow(1 + o.g, y);
    if (o.start){ bal += d; dep += d; bal *= 1 + rm; }
    else { bal *= 1 + rm; bal += d; dep += d; }
    if (k === 11 || m === months - 1) hist.push({y: y + 1, dep, int: bal - dep, bal});
    if (o.goal && bal >= o.goal){ if (k !== 11) hist.push({y: y + 1, dep, int: bal - dep, bal}); m++; break; }
  }
  return {bal, dep, hist, months: m};
}
function calcCompound(){
  const mode = $('#c_mode').value;
  const o = {p0: Math.max(0, v('c_init')), mo: Math.max(0, v('c_monthly')), rate: v('c_rate'), fee: Math.max(0, v('c_mgmt')),
             f: parseInt($('#c_freq').value, 10) || 12, g: v('c_depG') / 100, yearly: Math.max(0, v('c_yearly')),
             start: $('#c_time').value === 'start'};
  const goal = Math.max(0, v('c_goal'));
  const tax = clamp(v('c_tax'), 0, 100) / 100, infl = v('c_infl') / 100;
  let months = clamp(Math.round(v('c_years')), 1, 60) * 12, sim, reached = true;
  if (mode === 'dep'){
    const s0 = compSim(Object.assign({}, o, {mo: 0}), months).bal;
    const s1 = compSim(Object.assign({}, o, {mo: 1}), months).bal;
    o.mo = goal > s0 && s1 > s0 ? (goal - s0) / (s1 - s0) : 0;
    sim = compSim(o, months);
  } else if (mode === 'years'){
    sim = compSim(Object.assign({}, o, {goal}), 1200);
    reached = sim.bal >= goal && goal > 0;
    months = sim.months;
  } else sim = compSim(o, months);
  const yrsUsed = months / 12;
  const bal = sim.bal, dep = sim.dep, gain = bal - dep;
  const ear = Math.pow(1 + (o.rate - o.fee) / 100 / o.f, o.f) - 1;
  const rows = [];
  if (mode !== 'final') rows.push([t('r_goal'), M(goal)]);
  if (mode === 'dep') rows.push([t('r_needDep'), M(o.mo, 2), 'key']);
  if (mode === 'years') rows.push([t('r_needYears'), reached ? fmtDur(months) : t('r_notReach'), 'key']);
  rows.push([t('r_deposited'), M(dep)], [t('r_intEarned'), M(gain)], [t('r_final'), M(bal), 'key'],
            [t('r_intShare'), PC(bal > 0 ? gain / bal * 100 : NaN)], [t('r_ear'), PC(ear * 100)]);
  if (o.fee > 0){
    rows.push([t('r_netRate'), PC(o.rate - o.fee)]);
    const noFee = compSim(Object.assign({}, o, {fee: 0}), months).bal;
    rows.push([t('r_feeLost'), M(noFee - bal)]);
  }
  let base = bal;
  if (tax > 0 && gain > 0){ base = dep + gain * (1 - tax); rows.push([t('r_netAfterTax'), M(base)]); }
  if (infl > 0) rows.push([t('r_real'), M(base / Math.pow(1 + infl, yrsUsed))]);
  const heroMap = {
    final: {label: t('r_final'), value: M(bal), sub: t('r_intEarned') + ': ' + M(gain)},
    dep: {label: t('r_needDep'), value: M(o.mo, 2), sub: t('r_goal') + ': ' + M(goal)},
    years: {label: t('r_needYears'), value: reached ? fmtDur(months) : '—', sub: reached ? t('r_goal') + ': ' + M(goal) : t('r_notReach')}
  };
  const Y = sim.hist;
  return {
    hero: heroMap[mode], rows,
    chart: {
      title: t('c_growth'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_deposits'), cls:'c-ink', values: Y.map(y => y.dep)}, {name: t('l_interest'), cls:'c-accent', values: Y.map(y => Math.max(0, y.int))}],
      labels: Y.map(y => y.y)
    },
    table: {
      title: t('t_yearly'),
      head: [t('w_year'), t('h_deposited'), t('l_interest'), t('w_total')],
      rows: Y.map(y => [y.y, M(y.dep), M(y.int), M(y.bal)])
    }
  };
}
/* --- return --- */
const fvOf = (A, D, R, M) => {
  const i = Math.pow(1 + R, 1 / 12) - 1;
  return Math.abs(i) < 1e-12 ? A + D * M : A * Math.pow(1 + i, M) + D * (Math.pow(1 + i, M) - 1) / i;
};
function solveRate(A, D, B, M){
  let lo = -0.99, hi = 20;
  for (let k = 0; k < 120; k++){ const mid = (lo + hi) / 2; if (fvOf(A, D, mid, M) < B) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function calcYield(){
  const mode = $('#y_mode').value;
  const A = Math.max(0, v('y_start')), D = Math.max(0, v('y_dep'));
  const tax = clamp(v('y_tax'), 0, 100) / 100, infl = v('y_infl') / 100;
  let B = Math.max(0, v('y_end')), R = v('y_rate') / 100;
  let M = v('y_years') * ($('#y_unit').value === 'y' ? 12 : 1);
  if (!(A + D > 0) || (mode !== 'years' && !(M > 0))) return {hero:{label: t('r_avgAnnual'), value:'—'}, rows:[[t('r_invalidY'), '—']]};
  let ok = true;
  if (mode === 'rate') R = solveRate(A, D, B, M);
  else if (mode === 'end') B = fvOf(A, D, R, M);
  else {
    ok = false;
    for (let m = 1; m <= 1200; m++){ if (fvOf(A, D, R, m) >= B){ M = m; ok = true; break; } }
    if (!ok) M = 0;
  }
  const put = A + D * M, gain = B - put;
  const netGain = gain > 0 ? gain * (1 - tax) : gain, Bn = put + netGain;
  const Rn = M > 0 ? solveRate(A, D, Bn, M) : 0;
  const rows = [];
  rows.push([t('r_yPut'), M_(put)], [t('r_yEnd'), M_(B), 'key'], [t('r_gainLoss'), M_(gain)],
            [t('r_totReturn'), PC(put > 0 ? gain / put * 100 : NaN)]);
  if (mode !== 'rate') rows.push([t('r_avgAnnual'), PC(R * 100)]);
  if (mode !== 'years' && M > 0) rows.push([t('r_yYears'), fmtDur(Math.round(M))]);
  if (tax > 0) rows.push([t('r_gainNet'), M_(netGain)], [t('r_annNet'), PC(Rn * 100)]);
  if (infl > 0) rows.push([t('r_annReal'), PC(((1 + Rn) / (1 + infl) - 1) * 100)], [t('r_realFinal'), M_(Bn / Math.pow(1 + infl, M / 12))]);
  if (R > 0) rows.push([t('r_double'), `${N(Math.log(2) / Math.log(1 + R), 1)} ${t('w_years')}`]);
  if (D > 0) rows.push([t('r_xirrNote'), '']);
  const hero = {
    rate: {label: t('r_avgAnnual'), value: PC(R * 100), sub: t('r_totReturn') + ': ' + PC(put > 0 ? gain / put * 100 : NaN)},
    end: {label: t('r_yEnd'), value: M_(B), sub: t('r_gainLoss') + ': ' + M_(gain)},
    years: {label: t('r_yYears'), value: ok ? fmtDur(Math.round(M)) : '—', sub: ok ? t('r_yEnd') + ': ' + M_(B) : t('r_notReach')}
  }[mode];
  return {hero, rows};
}
function M_(x){ return M(x); }
/* --- dividends --- */
function calcDividends(){
  const price = v('d_price'), shares0 = v('d_shares'), dps = v('d_dps');
  const f = parseInt($('#d_freq').value, 10) || 1;
  const tp = $('#d_taxP').value;
  const tax = clamp(tp === 'c' ? v('d_tax') : parseFloat(tp), 0, 100) / 100;
  const years = clamp(Math.round(v('d_years')), 1, 60);
  const g = v('d_growth') / 100, pg = v('d_pg') / 100, drip = $('#d_drip').value === '1';
  const invest = price * shares0, yld = price > 0 ? dps / price : NaN;
  const net1 = dps * shares0 * (1 - tax), gross1 = dps * shares0;
  const R = [];
  let sh = shares0, cum = 0;
  for (let i = 0; i < years; i++){
    const d = dps * Math.pow(1 + g, i), gross = sh * d, net = gross * (1 - tax);
    const pEnd = price * Math.pow(1 + pg, i + 1);
    const shStart = sh;
    if (drip) sh += pEnd > 0 ? net / pEnd : 0; else cum += net;
    R.push({i: i + 1, shStart, gross, net, pEnd, cum, value: sh * pEnd, sh});
  }
  const last = R[years - 1];
  const totalNet = R.reduce((a, r) => a + r.net, 0);
  const tr = invest > 0 ? Math.pow((last.value + last.cum) / invest, 1 / years) - 1 : NaN;
  const rows = [
    [t('r_invest'), M(invest)],
    [t('r_divGross'), M(gross1)],
    [t('r_tax', {n: N(tax * 100)}), M(-(gross1 - net1))],
    [t('r_divNet'), M(net1), 'key'],
    [t('r_netPay'), M(net1 / f, 2)],
    [t('r_yGross'), PC(yld * 100)],
    [t('r_yNet'), PC(yld * (1 - tax) * 100)],
    [t('r_grossYear', {n: years}), M(last.gross)],
    [t('r_cumNet', {n: years}), M(totalNet)]
  ];
  if (invest > 0) rows.push([t('r_yoc'), PC(last.gross / invest * 100)]);
  rows.push([t('r_shares'), N(last.sh, 2)], [t('r_portfolio'), M(last.value + last.cum), 'key']);
  if (isFinite(tr)) rows.push([t('r_annualTotal'), PC(tr * 100)]);
  return {
    hero: {label: t('r_divNet'), value: M(net1), sub: t('r_yNet') + ': ' + PC(yld * (1 - tax) * 100)},
    rows, note: t('n_div'),
    chart: {
      title: t('c_portfolio'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_valueOnly'), cls:'c-ink', values: R.map(r => r.value)}, {name: t('h_cumNet'), cls:'c-accent', values: R.map(r => r.cum)}],
      labels: R.map(r => r.i)
    },
    table: {
      title: t('t_yearly'),
      head: [t('w_year'), t('h_shares'), t('h_sharePrice'), t('h_net'), t('h_value'), t('h_cumNet')],
      rows: R.map(r => [r.i, N(r.shStart, 2), M(r.pEnd, 2), M(r.net), M(r.value), M(r.cum)])
    }
  };
}

const incTaxOf = (inc, pts) => { const b = taxByBrackets(inc); return Math.max(0, b.tax - pts * TAX.point) + b.sur; };
const pmtOf = (amt, rate, n) => { const r = rate / 1200; return n <= 0 ? 0 : r === 0 ? amt / n : amt * r / (1 - Math.pow(1 + r, -n)); };
const mRate = pct => Math.pow(1 + pct / 100, 1 / 12) - 1;
const fvAnn = (pmt, rm, n) => rm === 0 ? pmt * n : pmt * (Math.pow(1 + rm, n) - 1) / rm;
const bracketTax = (price, br) => { let prev = 0, tot = 0; const parts = br.map(([lim, r]) => { const a = Math.max(0, Math.min(price, lim) - prev); prev = lim; tot += a * r; return {a, r, tax: a * r}; }); return {tot, parts}; };
const vatPct = () => { const x = parseFloat(SET.vat); return isFinite(x) ? x : 18; };

/* --- severance --- */
const SEV_CEIL = 13750;
function calcSeverance(){
  const sal = Math.max(0, v('sv_sal')), yrs = Math.max(0, v('sv_years')), other = Math.max(0, v('sv_other'));
  const pts = pointsOf('q'), entitled = $('#sv_why').value === 'yes';
  const owed = entitled ? sal * yrs : 0;
  const exempt = Math.min(owed, Math.min(sal, SEV_CEIL) * yrs), taxable = owed - exempt;
  const base = incTaxOf(other, pts);
  const taxNo = incTaxOf(other + taxable, pts) - base;
  const N = clamp(Math.ceil(yrs), 1, 6);
  const taxSp = N * (incTaxOf(other + taxable / N, pts) - base);
  const tax = Math.min(taxNo, taxSp);
  const net = owed - tax;
  return {
    hero: {label: t('r_svNet'), value: MI(net), sub: t('r_svTaxLine', {n: MI(tax)})},
    rows: [
      [t('r_svOwed'), MI(owed)], [t('r_svCeil'), MI(SEV_CEIL)], [t('r_svExempt'), MI(exempt)], [t('r_svTaxable'), MI(taxable)],
      [t('r_svTaxNo'), MI(taxNo)], [t('r_svSpreadYrs'), N], [t('r_svTaxSp'), MI(taxSp)],
      [t('r_svTax'), MI(tax), 'key'], [t('r_svNet'), MI(net), 'key'], [t('r_effTax'), PC(owed > 0 ? tax / owed * 100 : NaN)],
      [t('r_points'), ptsTxt('q', pts)]
    ],
    warn: entitled ? [] : [t('w_svNo')],
    note: t('n_sev') + ' ' + t('n_points'),
    split: {title: t('r_svNet'), items: [
      {name: t('r_svNet'), v: Math.max(0, net), cls:'c-ink', fmt: MI(net)},
      {name: t('r_svTax'), v: tax, cls:'c-warm', fmt: MI(tax)}]}
  };
}
function N_(x){ return N(x, 2); }

function calcNotice(){
  const m = Math.max(0, Math.floor(v('nt_months'))), type = $('#nt_type').value, sal = Math.max(0, v('nt_sal'));
  let days;
  if (type === 'm') days = m >= 12 ? 30 : m <= 6 ? m : 6 + 2.5 * (m - 6);
  else days = m < 12 ? m : m < 24 ? 14 + Math.floor((m - 12) / 2) : m < 36 ? 21 + Math.floor((m - 24) / 2) : 30;
  days = Math.min(30, days);
  const val = sal * days / 30;
  const end = new Date(); end.setDate(end.getDate() + Math.ceil(days));
  const fmtD = new Intl.DateTimeFormat(locOf(), {year:'numeric', month:'long', day:'numeric'}).format(end);
  return {

}

/* --- vacation, recuperation, sick --- */
const HAV_RATE = 451.5;
const havDays = y => y <= 1 ? 5 : y <= 3 ? 6 : y <= 10 ? 7 : y <= 15 ? 8 : y <= 19 ? 9 : 10;
function calcLeave(){
  const sal = Math.max(0, v('lv_sal')), div = Math.max(1, v('lv_div'));
  const daily = sal / div;
  const ent = Math.max(0, v('lv_ent')), mo = clamp(v('lv_mo'), 0, 12), used = Math.max(0, v('lv_used')), carry = Math.max(0, v('lv_carry'));
  const accrued = ent * mo / 12;
  const bal = Math.max(0, carry + accrued - used);
  const vacVal = bal * daily;
  const yrs = Math.max(1, Math.floor(v('lv_yrs'))), hd = havDays(yrs), scope = clamp(v('lv_scope'), 0, 100) / 100;
  const hav = hd * HAV_RATE * (mo / 12) * scope;
  const havLeft = Math.max(0, hav - Math.max(0, v('lv_hpaid')));
  const tmo = Math.max(0, v('lv_tmo')), sick = Math.min(90, 1.5 * tmo);
  return {
    hero: {label: t('r_lvTotal'), value: MI(vacVal + havLeft), sub: t('r_lvDaily', {n: MI(daily)})},
    rows: [
      [t('r_lvDailyW'), MI(daily)], [t('r_lvAccrued'), N(accrued, 1)], [t('r_lvBal'), N(bal, 1)], [t('r_lvVac'), MI(vacVal), 'key'],
      [t('r_lvHavDays'), hd], [t('r_lvHavRate'), MI(HAV_RATE)], [t('r_lvHav'), MI(hav)], [t('r_lvHavLeft'), MI(havLeft), 'key'],
      [t('r_lvSick'), N(sick, 1)], [t('r_lvSickVal'), MI(sick * daily)],
      [t('r_lvTotal'), MI(vacVal + havLeft), 'key']
    ],
    note: t('n_leave')

/* --- land appreciation tax --- */
function calcLandTax(){
  const sell = Math.max(0, v('lt_sell')), buy = Math.max(0, v('lt_buy')), bexp = Math.max(0, v('lt_bexp')), sexp = Math.max(0, v('lt_sexp'));
  const impr = Math.max(0, v('lt_impr')), cpi = Math.max(0, v('lt_cpi')), ex = $('#lt_exempt').value === '1';
  const ceil = Math.max(0, v('lt_ceil')), other = Math.max(0, v('lt_other'));
  const cost = buy + bexp + impr;
  const nom = sell - sexp - cost;
  const infl = nom > 0 ? Math.min(nom, cost * cpi / 100) : 0;
  const real = Math.max(0, nom - infl);
  const share = ex ? (sell <= ceil ? 0 : (sell - ceil) / sell) : 1;
  const taxable = real * share;
  const tax = taxable * 0.25;
  const a = surtaxOf(other + taxable, taxable), z = surtaxOf(other, 0);
  const sur = a.s3 - z.s3 + a.s2;
  const total = tax + sur;
  const net = sell - sexp - total;
  return {
    hero: {label: t('r_ltTax'), value: MI(total), sub: t('r_netProceeds') + ': ' + MI(net)},
    rows: [
      [t('r_ltNom'), MI(nom)], [t('r_inflPart'), MI(-infl)], [t('r_ltReal'), MI(real)],
      [t('r_ltExempt'), ex ? PC((1 - share) * 100) : t('r_na')], [t('r_taxableGain'), MI(taxable)],
      [t('r_ltRate'), PC(25)], [t('r_taxAmt'), MI(tax)], [t('r_surCapTax'), MI(sur)],
      [t('r_ltTax'), MI(total), 'key'], [t('r_netProceeds'), MI(net), 'key'], [t('r_effTax'), PC(nom > 0 ? total / nom * 100 : NaN)]

}

/* --- loan comparison --- */
function aprOf(net, pay, n){
  let lo = 0, hi = 1;
  for (let i = 0; i < 90; i++){
    const mid = (lo + hi) / 2;
    const pv = mid === 0 ? pay * n : pay * (1 - Math.pow(1 + mid, -n)) / mid;
    if (pv > net) lo = mid; else hi = mid;
  }
  return (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100;
}
/* any number of named offers (a bank name instead of "offer A/B") */
function lcRateFromPmt(amt, n, pm){       // the annual rate that makes this monthly payment repay the loan
  if (!(amt > 0) || !(pm > 0) || pm * n <= amt) return 0;
  let lo = 0, hi = 300;
  for (let k = 0; k < 80; k++){ const mid = (lo + hi) / 2; if (pmtOf(amt, mid, n) > pm) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}
function loanCmpSide(o){
  const amt = Math.max(0, +o.amt || 0), n = Math.max(1, Math.round((+o.yrs || 0) * 12) || 1), rt = o.rt || 'fix';
  const up = Math.max(0, +o.fee || 0) + amt * Math.max(0, +o.pct || 0) / 100, mf = Math.max(0, +o.mon || 0);
  let rate = Math.max(0, +o.rate || 0), pm, low = false;
  if (rt === 'prime') rate = Math.max(0, lcPrime() + (+o.mg || 0));
  if (rt === 'pmt'){ pm = Math.max(0, +o.pay || 0); low = pm * n < amt; rate = lcRateFromPmt(amt, n, pm); }
  else pm = pmtOf(amt, rate, n);
  const total = (pm + mf) * n + up;
  return {amt, n, pm, mf, up, total, rate, rt, low, int: pm * n - amt, apr: amt - up > 0 ? aprOf(amt - up, pm + mf, n) : NaN};
}
function calcLoanCmp(){
  const L = lcList().map((o, i) => Object.assign(loanCmpSide(o), {name: asEsc(lcName(o, i))}));
  const S = L.slice().sort((a, b) => a.total - b.total), best = S[0], next = S[1];
  const star = s => (next && s === best ? '★ ' : '') + s.name;
  return {
    hero: next ? {label: t('r_lcBestN', {x: best.name}), value: M(next.total - best.total), sub: t('r_lcVs', {x: next.name, r: PC(best.apr)})}
      : {label: t('r_lcTotalOf', {x: best.name}), value: M(best.total), sub: t('r_lcApr') + ': ' + PC(best.apr)},
    rows: (next ? [[t('r_lcBestN', {x: best.name}), M(next.total - best.total), 'key']] : [])
      .concat(S.filter(s => s.rt !== 'fix').map(s => [t(s.rt === 'pmt' ? 'r_lcRateCalcOf' : 'r_lcRatePrimeOf', {x: s.name}), PC(s.rate), 'key']))
      .concat(S.map(s => [t('r_lcAprOf', {x: s.name}), PC(s.apr)])),
    note: t('n_lc') + (L.some(s => s.rt === 'prime') ? ' ' + t('n_lcPrime', {p: PC(lcPrime())}) : ''),
    warn: L.filter(s => s.low).map(s => t('w_lcLow', {x: s.name})),
    table: {
      title: t('t_compare'), open: true, head: ['', t('r_lcRate'), t('r_lcPmt'), t('r_lcInt'), t('r_lcUp'), t('r_lcTotal'), t('r_lcApr')],
      rows: S.map(s => [star(s), PC(s.rate) + (s.rt === 'prime' ? ' (P)' : s.rt === 'pmt' ? ' *' : ''), M(s.pm + s.mf), M(s.int), M(s.up), M(s.total), PC(s.apr)])
    }
  };
}

/* --- prepay vs invest --- */
function calcPrepay(){
  const bal = Math.max(0, v('pp_bal')), rate = Math.max(0, v('pp_rate')), n = Math.max(1, Math.round(v('pp_yrs') * 12));
  const lump = clamp(v('pp_lump'), 0, bal), ret = v('pp_ret'), tax = clamp(v('pp_tax'), 0, 60) / 100;
  const p0 = pmtOf(bal, rate, n), p1 = pmtOf(bal - lump, rate, n), save = p0 - p1;
  const rm = mRate(ret);
  const fvA = fvAnn(save, rm, n), gainA = fvA - save * n, aftA = fvA - Math.max(0, gainA) * tax;
  const fvB = lump * Math.pow(1 + rm, n), aftB = fvB - Math.max(0, fvB - lump) * tax;
  const diff = aftA - aftB;
  const retB = lump > 0 ? (Math.pow(aftB / lump, 12 / n) - 1) * 100 : NaN;

/* --- savings goal --- */
function calcSaveGoal(){
  const mode = $('#sg_mode').value, goal = Math.max(0, v('sg_goal')), now = Math.max(0, v('sg_now')), rate = v('sg_rate'), infl = Math.max(0, v('sg_infl'));

  let n, dep;
  if (mode === 'dep'){
    n = Math.max(1, Math.round(v('sg_years') * 12));
    const g = Math.pow(1 + rm, n);
    dep = Math.max(0, rm === 0 ? (goal - now) / n : (goal - now * g) * rm / (g - 1));
  } else {
    dep = Math.max(0, v('sg_dep'));
    if (now >= goal) n = 0;
    else if (rm === 0) n = dep > 0 ? Math.ceil((goal - now) / dep) : NaN;
    else if (dep <= 0 && now <= 0) n = NaN;
    else n = Math.min(1200, Math.ceil(Math.log((goal * rm + dep) / (now * rm + dep)) / Math.log(1 + rm)));
  }
  if (!isFinite(n)) return {hero: {label: t('r_sgDep'), value: '—'}, rows: [], note: t('n_sg')};
  let b = now; const Y = [];
  for (let m = 1; m <= n; m++){
    b = b * (1 + rm) + dep;
    if (m % 12 === 0 || m === n) Y.push({y: Math.ceil(m / 12), bal: b, dep: now + dep * m});
  }
  const total = now + dep * n;
  const real = goal / Math.pow(1 + infl / 100, n / 12);
  return {
    hero: mode === 'dep' ? {label: t('r_sgDep'), value: M(dep), sub: t('r_sgTotal', {n: M(total)})} : {label: t('r_sgTime'), value: fmtDur(n), sub: t('r_sgTotal', {n: M(total)})},

      labels: Y.map(y => y.y)},
    table: {title: t('t_yearly'), head: [t('w_year'), t('h_value')], rows: Y.map(y => [y.y, M(y.bal)])}
  };
}

/* --- retirement --- */
function calcRetire(){
  const age = v('rt_age'), ret = Math.max(age, v('rt_ret')), life = Math.max(ret + 1, v('rt_life'));
  const have = Math.max(0, v('rt_have')), dep = Math.max(0, v('rt_dep')), r1 = v('rt_r1'), r2 = v('rt_r2');
  const need = Math.max(0, v('rt_need')), other = Math.max(0, v('rt_other')), infl = Math.max(0, v('rt_infl'));
  const y = ret - age, n = Math.round(y * 12), m = Math.round((life - ret) * 12);
  const rm = mRate(r1);
  const fv = have * Math.pow(1 + rm, n) + fvAnn(dep, rm, n);
  const f = Math.pow(1 + infl / 100, y);
  const gapM = Math.max(0, need - other);
  const needNom = gapM * f;
  const rr = (1 + r2 / 100) / (1 + infl / 100) - 1, rrm = Math.pow(1 + rr, 1 / 12) - 1;
  const fac = rrm === 0 ? m : (1 - Math.pow(1 + rrm, -m)) / rrm;
  const K = needNom * fac;
  const sust = fv / fac / f;
  const lack = Math.max(0, K - fv);
  const g = Math.pow(1 + rm, n);
  const extra = lack > 0 && n > 0 ? (rm === 0 ? lack / n : lack * rm / (g - 1)) : 0;
  return {
    hero: {label: t('r_rtSust'), value: M(sust + other), sub: t('r_rtTarget', {n: M(need)})},
    rows: [
      [t('r_rtYears'), N(y, 1)], [t('r_rtFv'), M(fv)], [t('r_rtNeedCap'), M(K)], [t('r_rtGap'), M(lack), 'key'],
      [t('r_rtExtra'), M(extra), 'key'], [t('r_rtSust'), M(sust + other)], [t('r_rtNeedNom'), M(needNom)],
      [t('r_rtDur'), N(life - ret, 1)]
    ],
    warn: lack > 0 ? [t('w_rtLack')] : [],
    warnOk: lack <= 0,
    note: t('n_rt')
  };
}

/* --- credit card --- */
function calcCredit(){
  const bal0 = Math.max(0, v('cc_bal')), apr = Math.max(0, v('cc_apr')), mode = $('#cc_mode').value;
  const pct = Math.max(0, v('cc_minPct')) / 100, floor = Math.max(0, v('cc_floor')), fix = Math.max(0, v('cc_pay'));
  let bal = bal0, m = 0, paid = 0, int = 0, stuck = false;
  const Y = [];
  while (bal > 0.005 && m < 1200){
    m++;
    const i = bal * apr / 1200;
    let pay = mode === 'min' ? Math.max(floor, bal * pct + i) : fix;
    pay = Math.min(pay, bal + i);
    if (pay <= i + 0.005 && bal + i > pay){ stuck = true; break; }
    int += i; bal = bal + i - pay; paid += pay;
    if (m % 12 === 0) Y.push([m / 12, M(Math.max(0, bal))]);
  }
  if (stuck) return {hero: {label: t('r_ccMonths'), value: '—'}, rows: [[t('r_ccMonths'), '—']], warn: [t('w_ccStuck')], note: t('n_cc')};
  return {
    hero: {label: t('r_ccMonths'), value: fmtDur(m), sub: t('r_ccIntLine', {n: M(int)})},
    rows: [[t('r_ccMonths'), fmtDur(m)], [t('r_ccPaid'), M(paid)], [t('r_ccInt'), M(int), 'key'], [t('r_ccShare'), PC(paid > 0 ? int / paid * 100 : NaN)]],
    warn: m >= 1200 ? [t('w_ccLong')] : [],
    note: t('n_cc'),
    split: {title: t('r_ccPaid'), items: [
      {name: t('r_ccPrincipal'), v: bal0, cls:'c-ink', fmt: M(bal0)}, {name: t('r_ccInt'), v: int, cls:'c-warm', fmt: M(int)}]},

}

/* --- rent vs buy --- */
function calcRentBuy(){
  const price = Math.max(0, v('rb_price')), down = clamp(v('rb_down'), 0, price), rate = Math.max(0, v('rb_rate'));
  const term = Math.max(1, Math.round(v('rb_yrs') * 12)), g = v('rb_g'), rent0 = Math.max(0, v('rb_rent')), rg = v('rb_rg');
  const ret = v('rb_ret'), hz = clamp(Math.round(v('rb_hz') * 12), 1, 600), cost = Math.max(0, v('rb_cost')) / 100, sellC = Math.max(0, v('rb_sell')) / 100, maint = Math.max(0, v('rb_maint')) / 100;
  const loan = price - down, pm = pmtOf(loan, rate, term), r = rate / 1200, gm = mRate(g), rm = mRate(ret);
  let bal = loan, val = price, invB = 0, invR = down + price * cost;
  const Y = [];
  for (let k = 0; k < hz; k++){
    const int = bal * r; const pr = k < term ? Math.min(bal, pm - int) : 0;
    const pay = k < term ? pm : 0;
    bal -= pr; val *= 1 + gm;
    const buyCost = pay + val * maint / 12;
    const rent = rent0 * Math.pow(1 + rg / 100, Math.floor(k / 12));
    const d = buyCost - rent;
    invB *= 1 + rm; invR *= 1 + rm;
    if (d > 0) invR += d; else invB += -d;
    if ((k + 1) % 12 === 0 || k === hz - 1){
      const wb = val - bal - val * sellC + invB;
      Y.push([Math.ceil((k + 1) / 12), M(wb), M(invR), M(wb - invR)]);
    }
  }
  const wBuy = val - bal - val * sellC + invB, wRent = invR, diff = wBuy - wRent;
  return {
    hero: {label: diff >= 0 ? t('r_rbBuy') : t('r_rbRent'), value: M(Math.abs(diff)), sub: t('r_rbSub', {y: N(hz / 12, hz % 12 ? 1 : 0)})},
    rows: [
      [t('r_rbPmt'), M(pm)], [t('r_rbValue'), M(val)], [t('r_rbBal'), M(bal)],
      [t('r_rbWBuy'), M(wBuy), 'key'], [t('r_rbWRent'), M(wRent), 'key'], [t('r_rbDiff'), M(diff)]
    ],
    note: t('n_rb'),
    table: {title: t('t_yearly'), head: [t('w_year'), t('r_rbWBuy'), t('r_rbWRent'), t('r_rbDiff')], rows: Y}
  };
}

/* --- car lease vs buy --- */
function calcCar(){
  const price = Math.max(0, v('cl_price')), down = clamp(v('cl_down'), 0, price), rate = Math.max(0, v('cl_rate')), n = Math.max(1, Math.round(v('cl_n')));
  const resale = price * clamp(v('cl_resale'), 0, 100) / 100, brun = Math.max(0, v('cl_brun')), lrun = Math.max(0, v('cl_lrun'));
  const lm = Math.max(0, v('cl_lm')), lup = Math.max(0, v('cl_lup')), opp = v('cl_opp'), yrs = n / 12;
  const pm = pmtOf(price - down, rate, n);
  const og = x => x * (Math.pow(1 + opp / 100, yrs) - 1);
  const buy = down + pm * n + brun * yrs - resale + og(down);
  const lease = lup + lm * n + lrun * yrs + og(lup);
  const diff = lease - buy;
  return {
    hero: {label: diff > 0 ? t('r_clBuy') : t('r_clLease'), value: M(Math.abs(diff)), sub: t('r_clSub')},
    rows: [
      [t('r_clPmt'), M(pm)], [t('r_clBuyTot'), M(buy), 'key'], [t('r_clLeaseTot'), M(lease), 'key'],
      [t('r_clBuyMo'), M(buy / n)], [t('r_clLeaseMo'), M(lease / n)], [t('r_clResale'), M(resale)]
    ],
    note: t('n_cl')
  };
}

/* --- break-even --- */
function calcBreakEven(){
  const fix = Math.max(0, v('be_fix')), price = Math.max(0, v('be_price')), vc = Math.max(0, v('be_var')), tg = Math.max(0, v('be_target')), cu = Math.max(0, v('be_units'));

  const u = fix / cm, ut = (fix + tg) / cm, profit = cu * cm - fix;
  const tbl = [0.5, 1, 1.5, 2].map(k => [N(u * k, 0), M(u * k * price), M(u * k * cm - fix)]);

/* --- split bill: equally, by income, %, parts, what each ordered, or settle up who paid what --- */
const SP_CLS = ['c-ink', 'c-accent', 'c-warm', 'c-soft'];
function spRoundUp(x, step){ return step > 0 ? Math.ceil(x / step - 1e-9) * step : x; }
function calcSplit(){
  const mode = $('#sp_mode').value, total = Math.max(0, v('sp_total')), tip = Math.max(0, v('sp_tip')) / 100, step = +(($('#sp_round') || {}).value || 0);
  const bill = total * (1 + tip);
  if (mode === 'eq'){
    const n = Math.max(1, Math.round(v('sp_n'))), each = bill / n, r = spRoundUp(each, step);
    const rows = [[t('r_spBillRow'), M(bill, 2)], [t('r_spTip'), M(total * tip, 2)], [t('r_spEach'), M(r, 2), 'key'], [t('r_spN'), n]];
    if (step) rows.push([t('r_spRoundExtra'), M(r * n - bill, 2)]);
    return {hero: {label: t('r_spEach'), value: M(r, 2), sub: t('r_spBill', {n: M(bill, 2)})}, rows, note: t('n_sp2')};
  }
  const P = spList(), N = P.length, nm = (p, i) => asEsc(spName(p, i));
  if (mode === 'paid'){
    const paid = P.map(p => Math.max(0, +p.paid || 0)), T = paid.reduce((a, b) => a + b, 0), each = T / (N || 1);
    const bal = paid.map(x => x - each);
    const cr = bal.map((b, i) => ({i, b})).filter(x => x.b > 0.005).sort((a, b) => b.b - a.b), db = bal.map((b, i) => ({i, b: -b})).filter(x => x.b > 0.005).sort((a, b) => b.b - a.b);
    const moves = []; let ci = 0, di = 0;
    while (ci < cr.length && di < db.length){ const amt = Math.min(cr[ci].b, db[di].b); moves.push([db[di].i, cr[ci].i, amt]); cr[ci].b -= amt; db[di].b -= amt; if (cr[ci].b < 0.005) ci++; if (db[di].b < 0.005) di++; }
    const rows = [[t('r_spTotalPaid'), M(T, 2)], [t('r_spEachShare'), M(each, 2), 'key']].concat(moves.length ? moves.map(([a, b, x]) => [t('r_spOwes', {a: nm(P[a], a), b: nm(P[b], b)}), M(x, 2), 'key']) : [[t('r_spSettled'), '✓']]);
    return {
      hero: {label: t('r_spEachShare'), value: M(each, 2), sub: moves.length ? t('r_spMoves', {n: moves.length}) : t('r_spSettled')},
      rows, note: t('n_sp2'),
      table: {title: t('t_spTable'), open: true, head: ['', t('sp_vPaid'), t('r_spEachShare'), t('r_spBal')], rows: P.map((p, i) => [nm(p, i), M(paid[i], 2), M(each, 2), (bal[i] > 0.005 ? '+' : '') + M(bal[i], 2)])}
    };
  }
  let share, warn = [];
  if (mode === 'ex'){
    const own = P.map(p => Math.max(0, +p.ex || 0)), sum = own.reduce((a, b) => a + b, 0), shared = Math.max(0, total - sum) / (N || 1);
    if (sum > total + 0.005) warn.push(t('w_spExOver'));
    share = own.map(x => (x + shared) * (1 + tip));
  } else {
    const key = mode === 'inc' ? 'inc' : mode === 'pct' ? 'pct' : 'sh';
    const w = P.map(p => Math.max(0, +p[key] || 0)), sw = w.reduce((a, b) => a + b, 0);
    if (mode === 'pct' && Math.abs(sw - 100) > 0.01) warn.push(t('w_spPctSum', {n: Math.round(sw * 100) / 100}));
    share = w.map(x => sw > 0 ? bill * x / sw : bill / (N || 1));
  }
  const r = share.map(x => spRoundUp(x, step)), sumR = r.reduce((a, b) => a + b, 0);
  const rows = [[t('r_spBillRow'), M(bill, 2)]].concat(P.map((p, i) => [t('r_spPays', {x: nm(p, i)}), M(r[i], 2), 'key']));
  if (step) rows.push([t('r_spRoundExtra'), M(sumR - bill, 2)]);
  const top = r.indexOf(Math.max(...r));
  return {
    hero: {label: t('r_spPays', {x: nm(P[top], top)}), value: M(r[top], 2), sub: t('r_spBill', {n: M(bill, 2)})},
    rows, note: t('n_sp2'), warn,
    table: {title: t('t_spTable'), open: N > 2, head: ['', t('r_spAmt'), t('r_spPct')], rows: P.map((p, i) => [nm(p, i), M(r[i], 2), PC(sumR > 0 ? r[i] / sumR * 100 : 0)])},
    split: {title: t('r_spBillRow'), items: P.map((p, i) => ({name: nm(p, i), v: r[i], cls: SP_CLS[i % SP_CLS.length], fmt: M(r[i], 2)}))}
  };
}

/* ================= from minus to financial freedom ================= */
const STAGE_KEYS = ['st_minus', 'st_debts', 'st_em', 'st_invest', 'st_free'];

/* --- personal balance sheet --- */
function calcNetWorth(){
  const g = id => Math.max(0, v(id));
  const A = {cash: g('nw_cash'), inv: g('nw_inv'), pen: g('nw_pen'), prop: g('nw_prop'), oth: g('nw_oa')};
  const Lb = {mort: g('nw_mort'), loan: g('nw_loan'), card: g('nw_card'), oth: g('nw_ol')};
  const ta = Object.values(A).reduce((a, b) => a + b, 0), tl = Object.values(Lb).reduce((a, b) => a + b, 0);
  const nw = ta - tl;
  const inc = g('nw_inc'), exp = g('nw_exp'), save = inc - exp;
  const liquid = A.cash + A.inv, bad = Lb.loan + Lb.card + Lb.oth;
  const runway = exp > 0 ? A.cash / exp : NaN;
  const passive = A.inv * 0.04 / 12;
  const stage = nw < 0 ? 0 : bad > 0 ? 1 : (exp > 0 && A.cash < exp * 3) ? 2 : (exp > 0 && passive < exp) ? 3 : 4;
  return {
    hero: {label: t('r_nwNet'), value: M(nw), sub: t('r_nwStage', {s: t(STAGE_KEYS[stage])})},
    rows: [
      [t('r_nwAssets'), M(ta)], [t('r_nwLiab'), M(tl)], [t('r_nwNet'), M(nw), 'key'],
      [t('r_nwLiquid'), M(liquid - bad)], [t('r_nwDebtRatio'), PC(ta > 0 ? tl / ta * 100 : NaN)],
      [t('r_nwSave'), M(save)], [t('r_nwSaveRate'), PC(inc > 0 ? save / inc * 100 : NaN)],
      [t('r_nwRunway'), isFinite(runway) ? N(runway, 1) : '—'], [t('r_nwPassive'), M(passive)],
      [t('r_nwStageRow'), t(STAGE_KEYS[stage]), 'key']
    ],
    warn: nw < 0 ? [t('w_nwMinus')] : [], warnOk: false,
    note: t('n_nw'),
    split: ta > 0 ? {title: t('r_nwAssets'), items: [
      {name: t('o_nwCash'), v: A.cash, cls:'c-ink', fmt: M(A.cash)}, {name: t('o_nwInv'), v: A.inv, cls:'c-accent', fmt: M(A.inv)},
      {name: t('o_nwPen'), v: A.pen, cls:'c-soft', fmt: M(A.pen)}, {name: t('o_nwProp'), v: A.prop, cls:'c-warm', fmt: M(A.prop)}]} : undefined
  };
}

/* --- debt payoff plan --- */
function debtSim(method, extra){
  const D = [1, 2, 3, 4].map(i => ({i, bal: Math.max(0, v(`dp_b${i}`)), r: Math.max(0, v(`dp_r${i}`)) / 1200, min: Math.max(0, v(`dp_m${i}`)), done: 0})).filter(d => d.bal > 0);
  let m = 0, int = 0; const order = [];
  while (D.some(d => d.bal > 0.005) && m < 1200){
    m++;
    D.forEach(d => { if (d.bal > 0){ const i = d.bal * d.r; d.bal += i; int += i; } });
    let pool = extra;
    D.forEach(d => { if (d.bal > 0){ const p = Math.min(d.min, d.bal); d.bal -= p; } else pool += d.min; });
    if (method !== 'min'){
      const act = D.filter(d => d.bal > 0.005).sort((a, b) => method === 'ava' ? b.r - a.r : a.bal - b.bal);
      for (const d of act){ if (pool <= 0) break; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; }
    }
    D.forEach(d => { if (d.bal <= 0.005 && !d.done){ d.done = m; order.push(d.i); } });
  }
  return {m, int, order, left: D.reduce((a, d) => a + Math.max(0, d.bal), 0), total: D.reduce((a, d) => a + 0, 0)};
}
function calcDebtPlan(){
  const extra = Math.max(0, v('dp_extra')), method = $('#dp_method').value;
  const total = [1, 2, 3, 4].reduce((a, i) => a + Math.max(0, v(`dp_b${i}`)), 0);
  const res = {ava: debtSim('ava', extra), snow: debtSim('snow', extra), min: debtSim('min', 0)};
  const sel = res[method];
  const stuck = sel.left > 0.5;
  const nm = k => ({ava: t('o_dpAva'), snow: t('o_dpSnow'), min: t('o_dpMin')})[k];
  const d1 = new Date(); d1.setMonth(d1.getMonth() + sel.m);
  const when = new Intl.DateTimeFormat(locOf(), {year:'numeric', month:'long'}).format(d1);
  const saved = res.min.left > 0.5 ? NaN : res.min.int - sel.int;
  return {
    hero: stuck ? {label: t('r_dpTime'), value: '—', sub: t('w_dpStuck')} : {label: t('r_dpTime'), value: fmtDur(sel.m), sub: t('r_dpWhen', {d: when})},
    rows: [
      [t('r_dpTotal'), M(total)], [t('r_dpTime'), stuck ? '—' : fmtDur(sel.m), 'key'], [t('r_dpInt'), M(sel.int)],
      [t('r_dpSaved'), isFinite(saved) ? M(saved) : t('r_na')], [t('r_dpOrder'), sel.order.map(i => '#' + i).join(' → ') || '—']
    ],
    warn: stuck ? [t('w_dpStuck')] : [],
    note: t('n_dp'),
    table: {title: t('t_compare'), open: true, head: [t('f_dpMethod'), t('r_dpTime'), t('r_dpInt')],
      rows: ['ava', 'snow', 'min'].map(k => [nm(k), res[k].left > 0.5 ? '—' : fmtDur(res[k].m), M(res[k].int)])}
  };
}

/* --- FIRE --- */
function calcFire(){
  const age = v('fi_age'), exp = Math.max(0, v('fi_exp')), have = Math.max(0, v('fi_have')), dep = Math.max(0, v('fi_dep'));
  const r = v('fi_ret'), infl = Math.max(0, v('fi_infl')), wd = Math.max(0.5, v('fi_wd'));
  const rm = mRate(r), im = mRate(infl);
  const todayNum = exp * 12 / (wd / 100);
  let bal = have, m = 0, reached = bal >= todayNum;
  while (!reached && m < 1200){
    m++; bal = bal * (1 + rm) + dep * Math.pow(1 + im, 0);
    if (bal >= todayNum * Math.pow(1 + im, m / 12)) reached = true;
  }
  const yrs = m / 12, target = todayNum * Math.pow(1 + im, yrs);
  const coastAt = 65, cy = Math.max(0, coastAt - age);
  const coast = todayNum * Math.pow(1 + im, cy) / Math.pow(1 + rm, cy * 12);
  const alt = [3, 3.5, 4, 5].map(w => [PC(w), M(exp * 12 / (w / 100))]);
  return {
    hero: reached ? {label: t('r_fiYears'), value: fmtDur(m), sub: t('r_fiAge', {a: N(age + yrs, 1)})} : {label: t('r_fiYears'), value: '—', sub: t('w_fiFar')},
    rows: [
      [t('r_fiNum'), M(todayNum), 'key'], [t('r_fiNumNom'), reached ? M(target) : '—'], [t('r_fiIncome'), M(exp)],
      [t('r_fiYears'), reached ? fmtDur(m) : '—', 'key'], [t('r_fiProgress'), PC(todayNum > 0 ? Math.min(100, have / todayNum * 100) : NaN)],
      [t('r_fiCoast'), M(coast)], [t('r_fiCoastHave'), have >= coast ? t('o_yes') : t('o_no')]
    ],
    warn: reached ? [] : [t('w_fiFar')],
    note: t('n_fi'),
    table: {title: t('t_fiAlt'), head: [t('f_fiWd'), t('r_fiNum')], rows: alt}
  };
}

/* --- roadmap --- */
function calcFreedom(){
  const inc = Math.max(0, v('fr_inc')), exp = Math.max(0, v('fr_exp')), s0 = inc - exp;
  let debt = Math.max(0, v('fr_debt')), dr = Math.max(0, v('fr_drate')) / 1200, assets = Math.max(0, v('fr_assets'));
  const emT = Math.max(0, v('fr_em')) * exp, ret = v('fr_ret'), wd = Math.max(0.5, v('fr_wd')), raise = Math.max(0, v('fr_raise'));
  const rm = mRate(ret), fiT = exp * 12 / (wd / 100);
  const start = assets - debt;
  const st = {debt: debt <= 0 ? 0 : null, em: null, fi: null};
  if (s0 <= 0) return {hero: {label: t('r_frTime'), value: '—', sub: t('w_frNoSurplus')}, rows: [[t('r_frSurplus'), M(s0)], [t('r_frStart'), M(start)]], warn: [t('w_frNoSurplus')], note: t('n_fr')};
  let m = 0; const Y = [[0, M(start)]];
  while (m < 960 && st.fi === null){
    m++;
    const s = s0 * Math.pow(1 + raise / 100, Math.floor((m - 1) / 12));
    assets *= 1 + rm;
    let pool = s;
    if (debt > 0){
      debt += debt * dr; const p = Math.min(debt, pool); debt -= p; pool -= p;
      if (debt <= 0.005){ debt = 0; if (st.debt === null) st.debt = m; }
    }
    assets += pool;
    if (debt <= 0 && st.em === null && assets >= emT) st.em = m;
    if (debt <= 0 && assets >= fiT) st.fi = m;
    if (m % 12 === 0) Y.push([m / 12, M(assets - debt)]);
  }
  if (st.debt === 0 && st.em === null && assets >= emT) st.em = 0;
  if (st.em === null && st.fi !== null) st.em = Math.min(st.fi, st.debt || 0);
  const done = st.fi !== null;
  const fiDate = new Date(); fiDate.setMonth(fiDate.getMonth() + (st.fi || 0));
  const when = new Intl.DateTimeFormat(locOf(), {year:'numeric', month:'long'}).format(fiDate);
  const f = x => x === null ? '—' : x === 0 ? t('r_frNow') : fmtDur(x);
  return {
    hero: done ? {label: t('r_frTime'), value: fmtDur(st.fi), sub: t('r_frWhen', {d: when})} : {label: t('r_frTime'), value: '—', sub: t('w_frFar')},
    rows: [
      [t('r_frStart'), M(start), 'key'], [t('r_frSurplus'), M(s0)], [t('r_frS1'), f(st.debt)], [t('r_frS2'), f(st.em)], [t('r_frS3'), done ? fmtDur(st.fi) : '—', 'key'],
      [t('r_frEmT'), M(emT)], [t('r_frFiT'), M(fiT)]
    ],
    warn: done ? [] : [t('w_frFar')],
    note: t('n_fr'),
    table: {title: t('t_frYears'), head: [t('w_year'), t('r_nwNet')], rows: Y.slice(0, 41)}
  };
}
