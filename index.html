<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>מחשבון פיננסי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#060C1C; --surface:#0E1830; --field:#0A1329;
  --ink:#EEF2FB; --ink-2:#8E9DBB; --line:rgba(255,255,255,.09);
  --navy:#070D1E; --hero-bg:#0E1830; --on-navy:#EEF2FB; --on-navy-2:#8E9DBB; --nav-line:rgba(255,255,255,.1);
  --brass:#F2C45A; --gold:#F2C45A; --gold-2:#C9972E; --focus:#F2C45A; --green:#2FD08A;
  --gold-ui:#F2C45A; --g1:rgba(255,255,255,.06); --g2:rgba(255,255,255,.02); --track:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.28);
  --hero-label:#BFD3C9; --hero-val:#46E3A4; --hero-grad:linear-gradient(135deg,rgba(47,208,138,.20),rgba(14,24,48,.92) 62%); --hero-bd:rgba(47,208,138,.35);
  --c1:#4F8CFF; --c2:#F5A524; --c3:#F0705A; --c4:#2FD08A;
}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.55 'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rail :focus-visible{outline-color:#E0B65A}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.rail{background:var(--navy);color:var(--on-navy);padding:14px 14px 0}
.rail-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;color:#fff}
.mark{width:30px;height:30px;flex:none}
.rail-ctrls{display:flex;gap:8px;align-items:center}
.cap{display:none}
.seg{display:inline-flex;background:rgba(255,255,255,.09);border-radius:10px;padding:3px}
.seg button{
  appearance:none;border:0;background:none;color:var(--on-navy-2);font:inherit;font-size:.82rem;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer;min-width:38px;
}
.seg button[aria-pressed="true"]{background:#fff;color:#0B1F3F}
.rail select{
  font:inherit;font-size:.86rem;color:#fff;background:rgba(255,255,255,.09);
  border:1px solid var(--nav-line);border-radius:10px;padding:7px 10px;min-height:38px;max-width:11rem;
}
.rail select option,.rail select optgroup{background:var(--surface);color:var(--ink)}
.nav{display:flex;overflow-x:auto;gap:2px;margin:12px -14px 0;padding:0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.grp{display:contents}
.grp-l{display:none}
.tab{
  position:relative;display:flex;align-items:center;gap:8px;flex:none;
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  color:var(--on-navy-2);font:inherit;font-size:.92rem;font-weight:500;
  padding:12px 12px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass)}
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{padding:20px 14px 36px;min-width:0}
.main-in{max-width:1040px;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h2{margin:0;font-size:1.55rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:.95rem;max-width:42rem}

/* ---------- panels ---------- */
.hero{
  background:var(--hero-bg);color:#fff;border-radius:14px;padding:13px 18px 14px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;
  box-shadow:0 8px 22px rgba(8,18,40,.22);
}
.hero-label{display:block;color:var(--on-navy-2);font-size:.88rem}
.hero-value{
  font-family:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;font-weight:500;
  font-size:clamp(1.75rem,7.5vw,3.1rem);line-height:1.12;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere;
}
.hero-sub{display:none;color:var(--on-navy-2);font-size:.9rem;margin-top:4px}

.inputs{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-top:14px;
}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 12px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:.83rem;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{display:block;margin-top:5px;font-size:.78rem;color:var(--ink-2);line-height:1.4}
.control{
  display:flex;direction:ltr;align-items:center;gap:6px;
  background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:0 12px;min-height:44px;
}
.control:focus-within,.field select:focus,.inl-select:focus{
  border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 28%,transparent);
}
.control input{
  flex:1;min-width:0;width:100%;border:0;background:none;outline:0;color:var(--ink);
  font:inherit;font-weight:500;text-align:right;padding:8px 0;font-variant-numeric:tabular-nums;
}
.control input:focus-visible{outline:0}
.control .u{flex:none;color:var(--ink-2);font-size:.9rem}
.control.sm{display:inline-flex;width:8.6em;min-height:38px}
.field select,.inl-select{
  width:100%;min-height:44px;font:inherit;font-weight:500;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:0;
}
.inl-select{width:auto;min-height:38px}
.btn{
  width:100%;min-height:42px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
}
.btn:hover{border-color:var(--brass)}

.detail{margin-top:10px}
.ledger{margin:0;padding:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row dt{color:var(--ink-2);font-size:.95rem}
.row dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.row.key{border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.row.key dt{color:var(--ink);font-weight:600}
.row.key dd{font-size:1.08rem}
.fine{margin:12px 2px 0;color:var(--ink-2);font-size:.82rem;line-height:1.5}

.chart{margin:20px 0 0;padding:16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chart figcaption{font-weight:600;font-size:.95rem;margin-bottom:10px}
.svgwrap{width:100%}
.svgwrap svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.c-ink{fill:var(--c1);background:var(--c1)}
.c-accent{fill:var(--c2);background:var(--c2)}
.c-warm{fill:var(--c3);background:var(--c3)}
.c-soft{fill:var(--c4);background:var(--c4)}
.bar{display:flex;gap:2px;height:24px;border-radius:7px;overflow:hidden;direction:ltr}
.bar span{display:block;min-width:3px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--ink-2);font-size:11px;font-family:inherit}

.sched{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.sched summary{cursor:pointer;padding:9px 0;font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th{color:var(--ink-2);font-weight:500;position:sticky;top:0;background:var(--bg)}
.tbl tbody th{font-weight:500}
.tbl td{direction:ltr}
:root[dir="rtl"] .tbl th,:root[dir="rtl"] .tbl td{text-align:right}
:root[dir="ltr"] .tbl th,:root[dir="ltr"] .tbl td{text-align:left}

.panel-flat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.sentence{padding:18px 0;border-bottom:1px solid var(--line)}
.sentence:last-child{border-bottom:0}
.s-line{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.05rem}
.s-result{margin:0;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.9rem;font-weight:500;line-height:1.25}

.note{margin:28px 0 0;color:var(--ink-2);font-size:.82rem;line-height:1.55;max-width:48rem}
.note a{color:inherit}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
  .rail{
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 16px 20px;
    display:flex;flex-direction:column;
  }
  .rail-top{display:contents}
  .brand{order:0;margin:0 6px 22px}
  .nav{order:1;flex:1;display:block;margin:0;padding:0;overflow:visible}
  .grp{display:block;margin-bottom:18px}
  .grp-l{display:block;margin:0 14px 6px;color:var(--on-navy-2);font-size:.78rem;font-weight:500;opacity:.85}
  .tab{
    width:100%;height:44px;padding:0 14px;border-bottom:0;border-radius:10px;font-size:.95rem;
  }
  .tab::before{
    content:"";position:absolute;inset-block:11px;inset-inline-start:0;width:3px;border-radius:3px;background:transparent;
  }
  .tab:hover{background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{background:rgba(255,255,255,.1)}
  .tab[aria-selected="true"]::before{background:var(--brass)}
  .rail-ctrls{
    order:2;flex-direction:column;align-items:stretch;gap:8px;margin-top:12px;
    border-top:1px solid var(--nav-line);padding-top:16px;
  }
  .cap{display:block;font-size:.76rem;color:var(--on-navy-2);margin:2px 2px 0}
  .seg{display:flex}
  .seg button{flex:1}
  .rail select{max-width:none;width:100%}
  .main{padding:38px 44px 48px}
  .page-head{margin-bottom:22px}
}
@media (min-width:1180px){
  .panel:not(.panel-flat){
    display:grid;grid-template-columns:minmax(310px,370px) minmax(0,1fr);column-gap:44px;
    grid-template-areas:"inputs hero" "inputs detail";align-items:start;
  }
  .panel .hero{grid-area:hero;position:static;padding:22px 26px 24px;box-shadow:none}
  .panel .hero-label{font-size:.95rem}
  .panel .hero-sub{display:block}
  .panel .inputs{grid-area:inputs;position:sticky;top:20px;margin-top:0}
  .panel .detail{grid-area:detail;margin-top:12px}
  .fields{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}
.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.adv summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:.92rem;color:var(--ink)}
.adv .fields{margin-top:6px}
.sub-h{grid-column:1/-1;margin:6px 0 -4px;font-size:.8rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1px solid var(--c3);color:var(--ink);font-size:.88rem;background:color-mix(in srgb,var(--c3) 10%,transparent)}
.ok-note{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,transparent)}
.warn[hidden]{display:none}
.lookup{width:100%;margin:0 0 10px;min-height:40px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

/* ===== dark gold theme ===== */
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(79,140,255,.10),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(242,196,90,.07),transparent 55%),var(--bg);background-attachment:fixed}
.rail{background:linear-gradient(180deg,#0A1226,#070D1E);border-inline-end:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold-ui);color:#1a1202}
.tab[aria-selected="true"]{color:var(--gold-ui)}
.tab[aria-selected="true"]::before{background:var(--gold-ui)}
.page-head{display:flex;align-items:center;gap:12px}
.page-head h2{font-size:1.45rem}
.back{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--g1);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[dir="ltr"] .back svg{transform:scaleX(-1)}
.inputs,.chart,.panel-flat,.sched,.warn{background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px var(--shadow)}
.sched{padding:6px 16px 10px;border-top:1px solid var(--line)}
.hero{border-radius:20px;background:var(--hero-grad);border:1px solid var(--hero-bd);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.hero-value{color:var(--hero-val)}
.hero-label{color:var(--hero-label)}
.control{background:var(--field);border-radius:14px;border-color:var(--line)}
.field select,.inl-select{background:var(--field);border-radius:14px;border-color:var(--line);color:var(--ink)}
.field select option{background:var(--surface);color:var(--ink)}
.btn{border-radius:14px;background:var(--g1)}
.row.key{border-top-color:var(--gold)}
.row.key dd{color:var(--gold)}
.warn{padding:12px 14px;border-color:rgba(240,112,90,.55);background:rgba(240,112,90,.10)}
.warn.ok-note{border-color:rgba(47,208,138,.5);background:rgba(47,208,138,.09)}
.tbl thead th{background:var(--surface)}
/* field with icon + slider */
.field.ic-field{display:flex;gap:12px;align-items:flex-start}
.fi{flex:none;width:44px;height:44px;margin-top:22px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);color:var(--gold)}
.fi svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fb{flex:1;min-width:0}
.rng{display:block;width:100%;margin:10px 0 0;height:20px;background:none;-webkit-appearance:none;appearance:none;direction:ltr;--p:0%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--gold) var(--p),var(--track) var(--p))}
.rng::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
.rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--gold)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;background:var(--gold);border:3px solid var(--field);box-shadow:0 0 0 1px var(--gold),0 2px 8px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--field)}
.rl{display:flex;justify-content:space-between;direction:ltr;font-size:.72rem;color:var(--ink-2);margin-top:-2px}
/* advanced */
.adv{border-top:0;margin-top:14px;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--g2)}
.adv summary{padding:14px 16px;list-style:none;display:flex;align-items:center;justify-content:space-between}
.adv summary::after{content:"⚙";color:var(--gold);font-size:1.1rem}
.adv summary::-webkit-details-marker{display:none}
.adv .fields{padding:4px 16px 16px}
/* donut */
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{flex:none;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15}
.donut .c-ink{stroke:var(--c1)}.donut .c-accent{stroke:var(--c2)}.donut .c-warm{stroke:var(--c3)}.donut .c-soft{stroke:var(--c4)}
.donutwrap .legend{flex:1;min-width:190px;flex-direction:column;align-items:stretch;gap:10px;margin:0}
.donutwrap .legend>span{display:flex;gap:8px;align-items:center}
/* home */
.home-hello{margin:0 0 4px;font-size:1.5rem;font-weight:600}
.home-sub{margin:0 0 18px;color:var(--ink-2)}
.hhero{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px 16px;background:linear-gradient(135deg,#6b4d12,#2a1f08 55%,#171108);border:1px solid rgba(242,196,90,.45);box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.hhero .l{color:#E8D4A0;font-size:.9rem}
.hhero .v{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:clamp(2rem,9vw,3.2rem);font-weight:500;color:#FFE29A;line-height:1.15}
.hhero .s{color:#CDBB8C;font-size:.82rem;margin-top:4px;max-width:72%}
.hhero svg.spark{position:absolute;inset-inline-end:0;bottom:0;width:62%;height:70%;opacity:.95;direction:ltr}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.stat{padding:14px 8px;border-radius:16px;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line)}
.stat b{display:block;font-size:1.02rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--ink-2)}
.sec-t{margin:22px 0 10px;font-size:1.05rem;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{appearance:none;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 6px;text-align:center;font-size:.86rem;line-height:1.25;border-radius:16px;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);transition:transform .15s,border-color .15s}
.tile:hover{border-color:rgba(242,196,90,.55);transform:translateY(-2px)}
.tile .ic{width:28px;height:28px;color:var(--gold);stroke-width:1.5}
.goal{color:#EEF2FB;position:relative;overflow:hidden;margin-top:18px;border-radius:20px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,#13294f,#0c1830 60%,#2a2008);border:1px solid var(--line)}
.goal h3{margin:0;font-size:1.15rem}
.goal p{margin:2px 0 12px;color:#8E9DBB;font-size:.88rem}
.gold-btn{appearance:none;font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:10px 22px;color:#1d1403;background:linear-gradient(180deg,#FFD97A,#E0A93A);box-shadow:0 6px 18px rgba(224,169,58,.35)}
.goal svg{width:96px;height:96px;flex:none}
body[data-tab="home"] .note{margin-top:20px}
/* bottom nav */
.bottom{display:none}
@media (max-width:959px){
  .nav{display:none}
  .rail{padding-bottom:12px}
  .main{padding-bottom:104px}
  .bottom{display:flex;position:fixed;z-index:20;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px 6px;border-radius:22px;background:rgba(10,18,38,.92);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .bt{flex:1;appearance:none;background:none;border:0;font:inherit;color:#8E9DBB;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;padding:6px 2px;cursor:pointer;min-width:0}
  .bt span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bt.on{color:#F2C45A}
  .bt .ic{width:23px;height:23px}
}
@media (min-width:960px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1180px){.panel-home{max-width:860px}}
@media (min-width:960px){.back{display:none}}

.set-sec{padding:14px 0 18px;border-bottom:1px solid var(--line)}
.set-sec:last-child{border-bottom:0}
.set-sec .sec-t{margin:0 0 12px}
.set-sec .fields{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EDF1F8; --surface:#FFFFFF; --field:#FFFFFF; --ink:#0E1A33; --ink-2:#5B6781; --line:rgba(14,26,51,.12);
  --gold:#9A6A06; --brass:#9A6A06; --focus:#1F4FB8; --c1:#2A5FD6; --c2:#E0900A; --c3:#D2523B; --c4:#14A66B;
  --g1:#FFFFFF; --g2:#F4F7FC; --track:rgba(14,26,51,.16); --shadow:rgba(20,40,80,.10);
  --hero-label:#2D5646; --hero-val:#0D9A66; --hero-grad:linear-gradient(135deg,rgba(20,166,107,.16),#FFFFFF 65%); --hero-bd:rgba(20,166,107,.4);
}
:root[data-theme="light"] body{background:radial-gradient(1000px 500px at 80% -10%,rgba(79,140,255,.10),transparent 60%),var(--bg)}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{appearance:none;font:inherit;font-size:.82rem;color:var(--ink);cursor:pointer;padding:7px 14px;border-radius:999px;background:var(--g1);border:1px solid var(--line)}
.chip:hover{border-color:var(--gold)}
.ghost-btn{margin-inline-start:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--g1)}
.ghost-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph-t{min-width:0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.btnrow .btn{flex:1;min-width:150px;width:auto}
.btn.danger{border-color:rgba(240,112,90,.6);color:#F0705A}
.tabs-list{margin-top:8px}
.tl-g{margin:14px 0 4px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--g2)}
.trow .tn{flex:1;min-width:120px;font-weight:500}
.trow label{font-size:.82rem;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.mv{appearance:none;font:inherit;color:var(--ink);cursor:pointer;min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--g1)}
.mv.wide{padding:0 12px;font-size:.8rem}
.scn-b{padding:0 16px 16px}
.scn-l{display:block;font-size:.83rem;color:var(--ink-2);margin-bottom:5px}
.scn-form{display:flex;gap:8px}
.scn-form .lookup{margin:0;flex:1}
.scn-form .btn{width:auto;flex:none}
.scn-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.scn-n{flex:1;font-weight:500;overflow-wrap:anywhere}
.scn-v{color:var(--gold);font-weight:600}
.scn-cmp{margin-top:10px}
select[multiple]{min-height:9.5rem}
.lookup{background:var(--field)}
textarea.lookup{resize:vertical;direction:ltr;font-size:.8rem;font-family:ui-monospace,monospace}
.toast{position:fixed;z-index:50;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;padding:12px 16px;border-radius:14px;background:#0E1830;color:#EEF2FB;border:1px solid rgba(242,196,90,.5);text-align:center;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tile.pinned{border-color:rgba(242,196,90,.55);position:relative}
.tile.pinned::after{content:"★";position:absolute;top:6px;inset-inline-end:8px;color:var(--gold-ui);font-size:.8rem}
:root[data-contrast="high"]{--ink-2:#CCD6EA;--line:rgba(255,255,255,.3)}
:root[data-theme="light"][data-contrast="high"]{--ink-2:#1E2A44;--line:rgba(14,26,51,.5)}
:root[data-motion="reduced"] *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
:root[data-font="readable"] body,:root[data-font="readable"] .hero-value,:root[data-font="readable"] .s-result,:root[data-font="readable"] .hhero .v{font-family:Verdana,Arial,'Segoe UI',system-ui,sans-serif;letter-spacing:.01em}
:root[data-sliders="0"] .rng,:root[data-sliders="0"] .rl{display:none}
body[data-tab="home"] .ghost-btn,body[data-tab="settings"] .ghost-btn{display:none}
@media print{
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--ink:#111;--ink-2:#444;--line:#ccc;--hero-grad:#fff;--hero-val:#0a7a52;--hero-label:#333;--g1:#fff;--g2:#fff;--shadow:transparent}
  body{background:#fff !important}
  .rail,.bottom,.inputs,.acts,.scn,.back,.ghost-btn,.toast{display:none !important}
  .hero{position:static;box-shadow:none}.main{padding:0}.panel{display:block !important}
}

.refresh-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line,rgba(255,255,255,.18));background:transparent;color:inherit;border-radius:12px;padding:6px 10px;font:inherit;font-size:.78rem;cursor:pointer;max-width:100%}
.refresh-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.refresh-btn.spin svg{animation:rspin .8s linear infinite}
.refresh-btn #gStamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes rspin{to{transform:rotate(360deg)}}
:root[data-motion="reduce"] .refresh-btn.spin svg{animation:none}
.rail-ctrls{flex-wrap:wrap}
.refresh-btn{flex:1 1 100%;justify-content:center;order:9;margin-top:2px}
.panel-home:not([hidden]){display:block}

.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .ic{width:22px;height:22px;flex:none;fill:none;stroke:var(--gold-ui,#F2C45A);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set-sec .sec-h .sec-t{margin:0}
.trow .tn{display:flex;align-items:center;gap:8px}
.trow .tn svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--gold-ui,#F2C45A);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.panel-set .fi{margin-top:22px}

.home-user{margin:-8px 0 14px;color:var(--gold-ui,#F2C45A);font-weight:600}
.acc-who{margin:0 0 10px}
.acc-seg{margin:0 0 12px;max-width:260px}
.pwreq{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:4px;font-size:.85rem}
.pwreq li::before{content:"✗";display:inline-block;width:1.4em;color:#e0675f}
.pwreq li.ok::before{content:"✓";color:#3fb27f}
.acc-msg.ok{color:#3fb27f}
.acc-msg:not(.ok):not(:empty){color:#e0675f}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.acc-seg button.on{background:var(--gold-ui);color:#1a1202}
.acc-seg{max-width:380px}
#acc_xout,#acc_icode{font-family:ui-monospace,monospace;font-size:.75rem;direction:ltr;text-align:left}

.as-box{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.as-box input{flex:1 1 220px;min-width:0}
.as-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.as-chip{border:1px solid var(--line,#ffffff33);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.as-log{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.as-m{padding:10px 12px;border-radius:12px;max-width:92%;line-height:1.55;background:#ffffff14}
.as-m.user{align-self:flex-end;background:var(--gold-ui);color:#1a1202}
.as-m.err{background:#e0675f26;color:#e0675f}
.as-go{margin:2px 4px;border:1px solid var(--gold-ui);background:transparent;color:inherit;border-radius:999px;padding:2px 10px;font:inherit;cursor:pointer}
.as-box input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #8a93a840;background:#ffffff14;color:inherit;-webkit-appearance:none;appearance:none}
.as-box .gold-btn{flex:0 0 auto}
.as-cfg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.as-cfg label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;flex:1 1 150px;min-width:0}
.as-cfg select,.as-cfg input{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid #8a93a840;background:#ffffff14;color:inherit}

.hhero .hh-go{position:relative;z-index:1;margin-top:10px;border:1px solid rgba(242,196,90,.6);background:rgba(0,0,0,.25);color:#FFE29A;border-radius:999px;padding:5px 14px;font:inherit;font-size:.82rem;cursor:pointer}
.hhero.empty{padding-bottom:18px}
.hhero.empty .s{max-width:100%;font-size:.9rem;margin:6px 0 12px}
.hhero .s,.hhero .l,.hhero .v{position:relative;z-index:1}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46E3A4;margin-inline-end:6px;vertical-align:middle;box-shadow:0 0 0 0 rgba(70,227,164,.6);animation:ldot 2s infinite}
@keyframes ldot{0%{box-shadow:0 0 0 0 rgba(70,227,164,.6)}70%{box-shadow:0 0 0 7px rgba(70,227,164,0)}100%{box-shadow:0 0 0 0 rgba(70,227,164,0)}}
:root[data-motion="reduce"] .live-dot{animation:none}
.home-rem{font-size:.82rem;margin:10px 0 0;color:var(--ink-2)}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.mine-c{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:16px;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);color:inherit;font:inherit;text-align:start;cursor:pointer;min-width:0}
.mine-c .ic{width:20px;height:20px;color:var(--gold)}
.mine-c .mine-t{font-size:.76rem;color:var(--ink-2)}
.mine-c b{font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mine-c small{font-size:.7rem;color:var(--ink-2)}
.mkt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media (max-width:420px){.mkt{grid-template-columns:repeat(2,1fr)}}
.mk{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-radius:16px;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);min-width:0}
.mk-l{font-size:.74rem;color:var(--ink-2)}
.mk b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.mk small{font-size:.68rem;color:var(--ink-2)}
.mkt-note{margin-top:8px}

.mk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mk-sw{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;cursor:pointer;user-select:none}
.mk-sw input{position:absolute;opacity:0;width:1px;height:1px}
.mk-knob{width:36px;height:20px;border-radius:999px;background:#8a93a855;position:relative;transition:background .2s;flex:0 0 auto}
.mk-knob::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.mk-sw input:checked + .mk-knob{background:#2fbf86}
.mk-sw input:checked + .mk-knob::after{inset-inline-start:18px}
.mk-sw input:focus-visible + .mk-knob{outline:2px solid var(--gold-ui);outline-offset:2px}
.mk-st{font-size:.74rem;color:var(--ink-2);margin:4px 0 0;min-height:1em}
.mk.up b{color:#1fae74;transition:color .3s}
.mk.down b{color:#e0675f;transition:color .3s}

.live-st,.conn{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.ls-row{display:flex;align-items:baseline;gap:8px;font-size:.82rem;flex-wrap:wrap}
.ls-row b{font-weight:600;min-width:7.5em}
.ls-row span:last-child{color:var(--ink-2)}
.ls-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;align-self:center;background:#8a93a8}
.ls-dot.ok{background:#2fbf86;box-shadow:0 0 0 3px rgba(47,191,134,.18)}
.ls-dot.bad{background:#e0675f}
.ls-dot.wait{background:#F2C45A}
.ls-dot.fix{background:#6FA8FF}
.conn-t{font-size:.86rem;margin:10px 0 2px}

.tiles .tiles-h{grid-column:1/-1;margin:10px 2px 0;font-size:.82rem;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.tiles .tiles-h:first-child{margin-top:0}

.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 12px;padding-bottom:2px}
.tchips::-webkit-scrollbar{display:none}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 14px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.tchip.on{background:var(--gold-ui);border-color:var(--gold-ui);color:#1a1202;font-weight:600}
.tchip:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
@media (min-width:960px){
  .grp-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 14px;margin:0 0 4px;color:var(--on-navy-2);font:inherit;cursor:pointer;border-radius:8px;text-align:start}
  .grp-h:hover{background:rgba(255,255,255,.05)}
  .grp-h:focus-visible{outline:2px solid var(--gold-ui);outline-offset:1px}
  .grp-h .grp-l{display:inline;margin:0;flex:1;font-size:.8rem;font-weight:600}
  .grp-n{font-size:.68rem;opacity:.75;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 7px}
  .grp-c{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .grp.acc.open .grp-c{transform:rotate(180deg)}
  .grp.acc:not(.open) .tab{display:none}
  .grp.acc{margin-bottom:4px}
  .grp.acc.open{margin-bottom:12px}
}
@media (max-width:959.98px){ .grp-h{display:contents} .grp-n,.grp-c{display:none} }
.tchips{flex-wrap:wrap;overflow:visible}
@media (min-width:960px){.grp-h .grp-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}

.src-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:6px 0 14px}
.src-c{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;flex-direction:column;gap:5px;min-width:0}
.src-h{display:flex;align-items:center;gap:8px;min-width:0}
.src-h b{font-size:.85rem;flex:1;min-width:0}
.src-fq{font-size:.68rem;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.src-s{font-size:.76rem;color:var(--ink-2);min-height:1.1em}
.src-l{display:flex;gap:6px;flex-wrap:wrap}
.src-a{font-size:.74rem;color:inherit;text-decoration:none;border:1px solid var(--gold-ui);border-radius:999px;padding:3px 10px}
.src-a:hover{background:color-mix(in srgb,var(--gold-ui) 18%,transparent)}
.src-a:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}

.cp-native{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.cp-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--field);color:inherit;font:inherit;cursor:pointer;text-align:start}
.cp-btn b{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cp-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:.88rem}
.cp-ch{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:0 0 auto;opacity:.6}
.cp-btn:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
.cp-ov{position:fixed;inset:0;z-index:200;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.cp-ov[hidden]{display:none}
.cp-box{width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.cp-ov{align-items:center}.cp-box{border-radius:20px;max-height:80vh}}
.cp-top{display:flex;align-items:center;justify-content:space-between}
.cp-top h3{margin:0;font-size:1.05rem}
.cp-x{border:0;background:transparent;color:inherit;font-size:1.6rem;line-height:1;cursor:pointer;width:40px;height:40px;border-radius:10px}
#cp_q{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:inherit;width:100%;box-sizing:border-box}
.cp-tabs{display:flex;gap:6px}
.cp-tab{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:.82rem;cursor:pointer}
.cp-tab.on{background:var(--gold-ui);border-color:var(--gold-ui);color:#1a1202;font-weight:600}
.cp-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:120px;overscroll-behavior:contain}
.cp-h{font-size:.74rem;font-weight:600;color:var(--ink-2);margin:10px 4px 4px}
.cp-h:first-child{margin-top:0}
.cp-it{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 10px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:start;cursor:pointer}
.cp-it:hover,.cp-it:focus-visible{background:color-mix(in srgb,var(--gold-ui) 16%,transparent);outline:none}
.cp-it.on{background:color-mix(in srgb,var(--gold-ui) 26%,transparent)}
.cp-it b{min-width:3.6em;font-variant-numeric:tabular-nums}
.cp-it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-it small{color:var(--ink-2);font-size:.74rem;white-space:nowrap;direction:ltr}
.cp-none{color:var(--ink-2);text-align:center;padding:20px}
body.cp-lock{overflow:hidden}
.cv-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cv-row select{flex:1;min-width:140px}
#panel-convert .tbl td:first-child,#panel-convert .tbl th:first-child{white-space:normal;overflow-wrap:anywhere}
#panel-convert .tbl td:last-child{white-space:nowrap}
.cv-row .mk-sw{flex:0 0 auto}
.cv-row select{flex:0 1 auto;min-width:0;width:auto}
.field label.mk-sw{display:inline-flex;align-items:center;gap:8px;margin:0;color:inherit;font-size:.85rem;width:auto}
.mk-knob{display:inline-block}

.conn-all{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:4px 0 12px}
.conn-all .gold-btn{min-height:46px}
.src-btn{font:inherit;font-size:.76rem;font-weight:600;border-radius:999px;padding:4px 14px;cursor:pointer;border:1px solid #2fbf86;background:#2fbf86;color:#06261a}
.src-btn.on{background:transparent;color:inherit;border-color:var(--line)}
.src-btn:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
.adv-live{margin:4px 0 10px}
.adv-live summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:6px 0}

.page-head .ex-btn{margin-inline-start:auto}
.page-head .ex-btn + .ghost-btn{margin-inline-start:0}
.ex-btn svg{fill:none;stroke:var(--gold);stroke-width:1.8}
body[data-tab="home"] .ex-btn,body[data-tab="settings"] .ex-btn,body[data-tab="assist"] .ex-btn{display:none}
@media (max-width:520px){.page-head .ghost-btn span{display:none}.page-head .ghost-btn{padding:8px 10px}}
.field.has-q{position:relative}
.field.has-q > label{padding-inline-end:28px}
.qbtn{position:absolute;top:-2px;inset-inline-end:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--field);color:var(--ink-2);font:inherit;font-size:.72rem;font-weight:700;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.qbtn:hover{border-color:var(--gold-ui);color:var(--ink)}
.qbtn:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
.ex-box{max-height:90vh}
.ex-body{overflow-y:auto;flex:1;min-height:120px;line-height:1.65;font-size:.94rem;overscroll-behavior:contain}
.ex-body p{margin:0 0 10px}
.ex-body ul{margin:0 0 10px;padding-inline-start:20px}
.ex-body li{margin:0 0 6px}
.ex-q{align-self:flex-end;background:var(--gold-ui);color:#1a1202;border-radius:12px;padding:8px 12px;margin:8px 0;display:inline-block}
.ex-a{margin:6px 0 12px}
.ex-wait{color:var(--ink-2)}
.ex-err{color:#e0675f}
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-ask{display:flex;gap:8px}
.ex-ask input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:inherit}
.ex-note{margin:0}
.panel .ledger .row dt{cursor:help;text-decoration:underline dotted color-mix(in srgb,var(--ink-2) 45%,transparent);text-underline-offset:4px}

.has-q{position:relative}
.has-q > label{padding-inline-end:28px}

  background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22);font-size:.9rem;overflow:hidden}

/* themes: chrome that was hard-coded follows the active theme */

/* theme gallery */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:0 0 16px}
.skin-c{appearance:none;font:inherit;color:var(--ink);text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:16px;border:1px solid var(--line);background:var(--g1);position:relative}
.skin-c[aria-checked="true"]{border-color:var(--gold-ui);box-shadow:0 0 0 2px var(--gold-ui)}
.skin-c[aria-checked="true"]::after{content:"✓";position:absolute;top:12px;inset-inline-end:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--gold-ui);color:#140d02}
.skin-c:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skin-pv{display:grid;grid-template-columns:22% 1fr;grid-template-rows:auto auto 1fr;gap:5px;height:92px;padding:6px;border-radius:11px;background:var(--pv-bg);overflow:hidden;direction:ltr}
.skin-pv .r{grid-row:1/4;border-radius:6px;background:var(--pv-rail)}
.skin-pv .h{border-radius:7px;background:var(--pv-hh);padding:5px 7px;display:flex;align-items:flex-end;min-height:34px}
.skin-pv .h b{font:600 .78rem/1 'Frank Ruhl Libre',Georgia,serif;color:var(--pv-v)}
.skin-pv .c{border-radius:6px;background:var(--pv-card);display:flex;align-items:center;gap:4px;padding:0 6px;min-height:20px}

.skin-pv.split{background:linear-gradient(90deg,#EDF1F8 50%,#060C1C 50%)}
.skin-n{font-weight:650;font-size:.95rem;line-height:1.2}
.skin-c small{color:var(--ink-2);font-size:.78rem;line-height:1.35}
.skin-btn{appearance:none;width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--nav-line);background:rgba(255,255,255,.06);color:var(--on-navy);display:grid;place-items:center;cursor:pointer}

.sk-box .skins{margin:0;overflow:auto}
.skins-h{grid-column:1/-1;margin:10px 0 0;font-size:.95rem;font-weight:650;color:var(--ink-2)}

.skin-live{font-style:normal;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--gold-ui);color:#140d02;vertical-align:middle}

.lv-pill i{width:8px;height:8px;border-radius:50%;background:#9aa3ad}
.lv-pill.on{color:#16855a;border-color:rgba(47,191,134,.55);background:rgba(47,191,134,.1)}
.lv-pill.on i{background:#2fbf86;box-shadow:0 0 0 0 rgba(47,191,134,.6);animation:lvPulse 2s infinite}
@keyframes lvPulse{0%{box-shadow:0 0 0 0 rgba(47,191,134,.55)}70%{box-shadow:0 0 0 7px rgba(47,191,134,0)}100%{box-shadow:0 0 0 0 rgba(47,191,134,0)}}
@media (prefers-reduced-motion: reduce){.lv-pill.on i{animation:none}}
.lv-rows{display:grid;gap:6px;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.lv-rows div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.lv-rows dt{color:var(--ink-2)}.lv-rows dd{margin:0;font-weight:600}
.lv-rem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid rgba(224,169,58,.6);background:rgba(224,169,58,.08);font-size:.88rem;margin:8px 0}
.lv-rem span{flex:1 1 180px}
.fg-src{margin-top:-4px}
.fg-g{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
.fg-g>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
.fg-g>summary::-webkit-details-marker{display:none}
.fg-g>summary::after{content:'';width:8px;height:8px;border-inline-end:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-inline-start:auto;transition:transform .2s}
.fg-g[open]>summary::after{transform:rotate(-135deg)}
.fg-n{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(138,92,208,.12);color:#6B46D6}
.fg-list{display:grid;gap:4px;padding:0 12px 12px}
.fg-row{display:grid;grid-template-columns:1fr minmax(120px,42%);gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fg-row:first-child{border-top:0}
.fg-row label{font-size:.88rem}
.fg-in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--field);min-height:40px}
.fg-in input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:8px 0;text-align:end;direction:ltr}
.fg-in input:focus{outline:none}.fg-in:focus-within{border-color:var(--focus,#1F4FB8);box-shadow:0 0 0 3px rgba(31,79,184,.15)}
.fg-in .u{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.fg-sub{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:.78rem}
.fg-row.mine .fg-in{border-color:rgba(138,92,208,.6);background:rgba(138,92,208,.06)}
.fg-tag{font-size:.72rem;padding:1px 7px;border-radius:999px;background:rgba(138,92,208,.14);color:#6B46D6}
.fg-x{border:0;background:none;color:var(--focus,#1F4FB8);font:inherit;font-size:.78rem;cursor:pointer;padding:2px 0;text-decoration:underline}
.fg-err{grid-column:1/-1;color:#C2412D;font-size:.78rem}
.fg-own{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(224,169,58,.7)}
/* live indices board */
.hmx{margin-top:4px}
.ix-g{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:.82rem;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ix-card{font:inherit;color:inherit;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ix-card:focus-visible{outline:2px solid var(--focus,#1F4FB8);outline-offset:2px}
.ix-ch{font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;align-self:flex-start}
.ix-ch.up{color:#16855a}.ix-ch.down{color:#C2412D}
.lk-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.lk-f{grid-template-columns:1fr}}
.lk-c label{display:block;font-size:.85rem;margin-bottom:6px}
.lk-c select{width:100%}
.lk-h{margin:6px 2px 0}
body:not(.own) .own-only{display:none!important}

  w_svNo:['בהתפטרות רגילה אין בדרך כלל זכאות לפיצויים, אלא אם יש הסכם או נסיבות מזכות.','عادةً لا يستحق الموظف تعويضًا عند الاستقالة العادية إلا بوجود اتفاق أو ظروف مبررة.','An ordinary resignation usually carries no severance unless a contract or qualifying circumstances apply.'],
  n_sev:['החישוב לפי שכר אחרון כפול שנות ותק. הפטור הוא הנמוך בין השכר האחרון לתקרה, כפול שנות הוותק. הפריסה מחושבת בקירוב לפי שנת ותק אחת לכל שנה עד 6. אם הופקדו כספי פיצויים בקופה, ייתכנו כללים אחרים. זו הערכה ולא ייעוץ מס.','الحساب: آخر راتب × سنوات الأقدمية. الإعفاء هو الأقل بين آخر راتب والسقف × السنوات. التوزيع تقريبي بسنة لكل سنة عمل حتى 6. قد تختلف القواعد إذا كانت الأموال مودعة في صندوق. تقدير وليس استشارة ضريبية.','Calculated as last salary times years. The exemption is the lower of last salary and the ceiling, times years. Spreading is approximated at one year per year of service up to 6. Rules differ if funds were deposited in a provident fund. An estimate, not tax advice.'],

  r_ntEnd:['יום סיום אם מתחילים היום','تاريخ الانتهاء إذا بدأ اليوم','End date if given today'],
  n_notice:['לפי חוק הודעה מוקדמת לפיטורים ולהתפטרות. הימים הם ימי לוח. השווי מחושב כשכר חודשי כפול ימים חלקי 30. הסכם או חוזה יכולים להעניק יותר.','حسب قانون الإشعار المسبق للفصل والاستقالة. الأيام تقويمية. القيمة = الراتب × الأيام ÷ 30. قد يمنح العقد أكثر.','Based on the advance notice law. Days are calendar days. Value is monthly pay times days over 30. A contract may grant more.'],

  r_lvSickVal:['שווי ימי המחלה (לא נפדים)','قيمة أيام المرض (غير قابلة للصرف)','Sick-day value (not paid out)'],
  n_leave:['ימי ההבראה לפי הענף הפרטי: 5 בשנה הראשונה, 6 בשנתיים-שלוש, 7 בשנים 4-10, 8 בשנים 11-15, 9 בשנים 16-19, 10 מהשנה ה-20, בתעריף 451.50 ₪ ליום ב-2026. ימי מחלה אינם נפדים בסיום. מחלק השכר היומי ומספר ימי החופשה תלויים בהסכם. בדקו מול ההסכם או הצו הרלוונטי.','أيام الاستجمام للقطاع الخاص: 5 في السنة الأولى و6 في الثانية والثالثة و7 في 4-10 و8 في 11-15 و9 في 16-19 و10 من العشرين، بسعر 451.50 ₪ لليوم عام 2026. أيام المرض لا تُصرف عند الانتهاء. القاسم وأيام الإجازة يعتمدان على العقد.','Recuperation days in the private sector: 5 in year 1, 6 in years 2-3, 7 in years 4-10, 8 in 11-15, 9 in 16-19, 10 from year 20, at ₪451.50 a day in 2026. Sick days are not paid out. The divisor and vacation days depend on your contract. Check your contract or the relevant order.'],

  w_ptOleh:['מדרגות העולה נבדקו מול מקור אחד בלבד. בדקו זכאות ומדרגות בסימולטור רשות המסים.','شرائح المهاجر موثقة من مصدر واحد فقط. تحقق من الأهلية في حاسبة سلطة الضرائب.','Immigrant brackets were checked against one source only. Verify eligibility and brackets in the Tax Authority simulator.'],
  n_pt:['המדרגות מעודכנות לתחילת 2026 לפי מקורות פומביים ומתעדכנות מדי תקופה. בדקו בסימולטור של רשות המסים לפני עסקה. הטבות מיוחדות, כמו נכים או הורים שכולים, אינן כלולות.','الشرائح محدثة لبداية 2026 حسب مصادر عامة وتتغير دوريًا. تحقق من حاسبة سلطة الضرائب قبل الصفقة. التسهيلات الخاصة غير مشمولة.','Brackets reflect early 2026 per public sources and are updated periodically. Check the Tax Authority simulator before a deal. Special reliefs, such as for disabled buyers, are not included.'],

  r_ltRate:['שיעור מס','نسبة الضريبة','Tax rate'],
  w_ltLinear:['לא כולל חישוב לינארי לנכסים שנרכשו לפני 2014 ולא תנאי פטור פרטניים. בדקו מול רשות המסים.','لا يشمل الحساب الخطي لعقارات اشتريت قبل 2014 ولا شروط الإعفاء التفصيلية. تحقق من سلطة الضرائب.','Excludes the linear method for properties bought before 2014 and detailed exemption conditions. Check with the Tax Authority.'],
  n_lt:['25% על השבח הריאלי, אחרי ניכוי הוצאות והצמדה למדד, ומס יסף על ההכנסה הגבוהה. פטור דירה מזכה: אם מחיר המכירה מעל התקרה, חלק יחסי מהשבח חייב. הזכאות כוללת תנאים, למשל מרווח בין מכירות. זו הערכה.','25% على الربح الحقيقي بعد خصم المصاريف والتضخم، مع ضريبة إضافية على الدخل المرتفع. إعفاء السكن: إن تجاوز السعر السقف يخضع جزء نسبي. الأهلية بشروط. تقدير.','25% on the real gain after expenses and inflation, plus surtax on high income. Residence exemption: if the price exceeds the ceiling, a proportional share is taxed. Eligibility has conditions such as time between sales. An estimate.'],

Object.assign(T, {

  kb_boi:['הריבית שבנק ישראל קובע כשמונה פעמים בשנה כדי לרסן או לעודד את המשק. היא משפיעה על הפריים, על המשכנתאות ועל הריבית שמקבלים בפיקדונות.','الفائدة التي يحدّدها بنك إسرائيل نحو ثماني مرات في السنة لكبح الاقتصاد أو تحفيزه. وهي تؤثّر في البرايم والرهون العقارية وفائدة الودائع.','The rate the Bank of Israel sets about eight times a year to cool or boost the economy. It drives prime, mortgages and the interest you earn on deposits.'],

  kb_cpi:['מדד שהלמ״ס מפרסמת בכל חודש ומודד את שינוי המחירים של סל מוצרים ושירותים. הלוואות וחסכונות "צמודי מדד" מתעדכנים לפיו.','مؤشر تنشره دائرة الإحصاء المركزية كل شهر ويقيس تغيّر أسعار سلة من السلع والخدمات. القروض والمدخرات «المرتبطة بالمؤشر» تتحدّث وفقه.','A monthly index from the Central Bureau of Statistics that tracks prices of a basket of goods and services. "CPI-linked" loans and savings are updated by it.'],

  kb_infl:['עליית מחירים כללית לאורך זמן. באינפלציה של 3% בשנה, 100 ₪ יקנו בעוד שנה בערך מה ש-97 ₪ קונים היום — ולכן כסף שלא מושקע מאבד מערכו.','ارتفاع عام في الأسعار مع الوقت. مع تضخم 3% سنويًا، تشتري 100 ₪ بعد سنة تقريبًا ما تشتريه 97 ₪ اليوم — لذلك يفقد المال غير المستثمَر قيمته.','A general rise in prices over time. With 3% inflation, ₪100 buys next year roughly what ₪97 buys today — so money that is not invested loses value.'],
  kbt_vat:['מע״מ','ضريبة القيمة المضافة','VAT'],
  kb_vat:['מס ערך מוסף שנוסף לרוב המוצרים והשירותים. בישראל הוא 18% (מינואר 2025): מחיר כולל מע״מ = מחיר × 1.18, ומחיר לפני מע״מ = מחיר ÷ 1.18.','ضريبة تُضاف إلى معظم السلع والخدمات. في إسرائيل نسبتها 18% (منذ يناير 2025): السعر شامل الضريبة = السعر × 1.18، والسعر قبلها = السعر ÷ 1.18.','A tax added to most goods and services. In Israel it is 18% (since January 2025): price with VAT = price × 1.18, price before VAT = price ÷ 1.18.'],
  kbt_points:['נקודות זיכוי','نقاط الإعفاء الضريبي','Tax credit points'],
  kb_points:['נקודות שמקטינות את מס ההכנסה החודשי. לכל נקודה ערך קבוע שמתעדכן מדי שנה, ומקבלים אותן על תושבות, מין, ילדים, תואר, שירות צבאי, מילואים ועוד. את הנתונים שלכם אפשר להזין בפרופיל האישי בהגדרות.','نقاط تقلّل ضريبة الدخل الشهرية. لكل نقطة قيمة ثابتة تُحدَّث سنويًا، وتُمنح على الإقامة والجنس والأولاد والشهادة والخدمة العسكرية والاحتياط وغيرها. يمكن إدخال بياناتك في الملف الشخصي في الإعدادات.','Points that lower your monthly income tax. Each point has a fixed value updated every year, given for residency, gender, children, a degree, army and reserve service and more. Enter yours in the personal profile in Settings.'],

  kb_reserve:['משרתי מילואים פעילים יכולים לקבל נקודות זיכוי נוספות לפי מספר ימי השירות בשנה הקודמת. הזינו את הימים בפרופיל האישי בהגדרות, והחישוב יכלול אותן.','يمكن لجنود الاحتياط الفاعلين الحصول على نقاط إعفاء إضافية حسب عدد أيام الخدمة في السنة السابقة. أدخل الأيام في الملف الشخصي في الإعدادات وسيشملها الحساب.','Active reservists can get extra credit points based on the days they served the previous year. Enter the days in the personal profile in Settings and the calculation includes them.'],
  kbt_gross:['ברוטו ונטו','الإجمالي والصافي','Gross and net'],
  kb_gross:['ברוטו הוא השכר לפני ניכויים. נטו הוא מה שנכנס לחשבון אחרי מס הכנסה, ביטוח לאומי, מס בריאות והפרשה לפנסיה.','الإجمالي هو الراتب قبل الاقتطاعات. الصافي هو ما يصل إلى الحساب بعد ضريبة الدخل والتأمين الوطني وضريبة الصحة واقتطاع التقاعد.','Gross is pay before deductions. Net is what reaches your account after income tax, National Insurance, health tax and the pension contribution.'],
  kbt_brackets:['מדרגות מס הכנסה','شرائح ضريبة الدخل','Income tax brackets'],
  kb_brackets:['מס הכנסה בישראל מדורג: כל חלק מההכנסה ממוסה בשיעור של המדרגה שלו. עלייה למדרגה גבוהה יותר מעלה את המס רק על החלק שמעליה, לא על כל השכר.','ضريبة الدخل في إسرائيل تصاعدية: كل جزء من الدخل يُفرض عليه معدّل شريحته. الانتقال إلى شريحة أعلى يرفع الضريبة على الجزء الذي فوقها فقط، لا على كل الراتب.','Israeli income tax is progressive: each slice of income is taxed at its own bracket rate. Moving into a higher bracket only raises tax on the part above it, not on your whole salary.'],
  kbt_btl:['ביטוח לאומי ומס בריאות','التأمين الوطني وضريبة الصحة','National Insurance and health tax'],
  kb_btl:['ניכויים מהשכר שמממנים קצבאות (אבטלה, לידה, נכות, זקנה ועוד) ואת מערכת הבריאות. השיעור נמוך על החלק הראשון של השכר וגבוה יותר מעליו.','اقتطاعات من الراتب تموّل المخصّصات (البطالة والولادة والإعاقة والشيخوخة وغيرها) وجهاز الصحة. النسبة منخفضة على الجزء الأول من الراتب وأعلى فوقه.','Payroll deductions that fund benefits (unemployment, maternity, disability, old age and more) and the health system. The rate is low on the first part of your pay and higher above it.'],
  kbt_pension:['פנסיה','التقاعد (الپنسيا)','Pension'],
  kb_pension:['חיסכון חובה לגיל פרישה: העובד והמעסיק מפרישים כל חודש אחוזים מהשכר (כולל רכיב פיצויים), והכסף מושקע עד הפרישה. דמי ניהול נמוכים משפיעים מאוד על הסכום הסופי.','ادّخار إلزامي لسن التقاعد: يقتطع العامل وصاحب العمل كل شهر نسبًا من الراتب (بما فيها مركّب التعويضات)، ويُستثمر المال حتى التقاعد. رسوم الإدارة المنخفضة تؤثّر كثيرًا في المبلغ النهائي.','Mandatory retirement savings: you and your employer put a share of your salary in every month (including a severance part), and it is invested until retirement. Low management fees make a big difference to the final amount.'],
  kbt_hishtalmut:['קרן השתלמות','صندوق الاستكمال (كيرن هشتلموت)','Keren Hishtalmut (study fund)'],
  kb_hishtalmut:['חיסכון לטווח בינוני שהמעסיק מפקיד אליו, שבדרך כלל נזיל אחרי 6 שנים. עד תקרה מסוימת הרווחים בו פטורים ממס רווח הון — ולכן זה אחד החסכונות המשתלמים.','ادّخار متوسط الأمد يودع فيه صاحب العمل، ويصبح عادةً متاحًا بعد 6 سنوات. حتى سقف معيّن تُعفى أرباحه من ضريبة الأرباح الرأسمالية — لذلك هو من أكثر الادّخارات جدوى.','A medium-term savings fund your employer pays into, usually available after 6 years. Up to a ceiling its gains are free of capital gains tax — one of the most worthwhile savings.'],
  kbt_severance:['פיצויי פיטורים','تعويضات الفصل','Severance pay'],
  kb_severance:['בדרך כלל משכורת חודשית אחת על כל שנת עבודה, לעובד שפוטר ובמקרים מסוימים גם למי שהתפטר. חלק מהפיצויים פטור ממס עד תקרה.','عادةً راتب شهري واحد عن كل سنة عمل، للعامل المفصول وفي حالات معيّنة لمن استقال أيضًا. جزء من التعويضات معفى من الضريبة حتى سقف معيّن.','Usually one month\'s salary per year worked, for an employee who was dismissed and in some cases one who resigned. Part of it is tax-free up to a ceiling.'],
  kbt_notice:['הודעה מוקדמת','الإشعار المسبق','Notice period'],
  kb_notice:['התקופה שבה מי שמסיים את העבודה (עובד או מעסיק) צריך להודיע מראש. האורך תלוי בוותק ובסוג השכר — חודשי או שעתי.','المدة التي يجب فيها على من ينهي العمل (العامل أو صاحب العمل) أن يُبلغ مسبقًا. تعتمد على الأقدمية ونوع الأجر — شهري أو بالساعة.','How far in advance whoever ends the employment (employee or employer) must give notice. It depends on seniority and on monthly versus hourly pay.'],
  kbt_leave:['חופשה שנתית','الإجازة السنوية','Annual leave'],
  kb_leave:['ימי חופשה בתשלום שנצברים לפי ותק והיקף משרה. ימים שלא נוצלו נפדים בכסף בסיום העבודה.','أيام إجازة مدفوعة تتراكم حسب الأقدمية ونطاق الوظيفة. الأيام غير المستغلّة تُستبدل بالمال عند انتهاء العمل.','Paid days off that build up with seniority and job scope. Unused days are paid out when the job ends.'],
  kbt_capgain:['מס רווח הון','ضريبة الأرباح الرأسمالية','Capital gains tax'],
  kb_capgain:['מס על הרווח הריאלי ממכירת מניות, קרנות, קריפטו ונכסים אחרים — בדרך כלל 25%. אפשר לקזז הפסדים מול רווחים באותה שנה.','ضريبة على الربح الحقيقي من بيع الأسهم والصناديق والعملات المشفّرة وأصول أخرى — عادةً 25%. يمكن خصم الخسائر من الأرباح في السنة نفسها.','Tax on the real gain from selling shares, funds, crypto and other assets — usually 25%. Losses can be offset against gains in the same year.'],
  kbt_div:['דיבידנד','الأرباح الموزّعة','Dividend'],
  kb_div:['חלק מהרווח שחברה מחלקת לבעלי המניות. בישראל הוא ממוסה בדרך כלל ב-25%, ובעל מניות מהותי משלם 30%.','جزء من ربح الشركة يُوزَّع على المساهمين. في إسرائيل يُفرض عليه عادةً 25%، ويدفع المساهم الجوهري 30%.','Part of a company\'s profit paid out to shareholders. In Israel it is usually taxed at 25%, and 30% for a major shareholder.'],
  kbt_compound:['ריבית דריבית','الفائدة المركّبة','Compound interest'],
  kb_compound:['כשהרווח מצטרף לקרן ומתחיל להרוויח בעצמו. ככל שהזמן ארוך יותר האפקט גדל — ולכן להתחיל לחסוך מוקדם משנה הרבה יותר מסכום ההפקדה.','عندما يُضاف الربح إلى رأس المال ويبدأ يربح بدوره. كلما طالت المدة كبر الأثر — لذلك البدء المبكر بالادّخار أهم بكثير من مقدار الإيداع.','When earnings are added to the principal and start earning too. The longer the time, the bigger the effect — so starting early matters far more than the deposit size.'],
  kbt_mortgage:['משכנתא','الرهن العقاري','Mortgage'],
  kb_mortgage:['הלוואה לדירה שהדירה עצמה משמשת בטוחה לה. בישראל היא בנויה בדרך כלל מכמה מסלולים, ולכל מסלול ריבית והצמדה משלו.','قرض لشراء شقة تكون الشقة نفسها ضمانًا له. في إسرائيل يتكوّن عادةً من عدة مسارات، لكل منها فائدة وربط خاص بها.','A home loan secured by the home itself. In Israel it is usually built from several tracks, each with its own rate and linkage.'],
  kbt_tracks:['מסלולי משכנתא','مسارات الرهن العقاري','Mortgage tracks'],
  kb_tracks:['המסלולים העיקריים: פריים (ריבית משתנה עם הפריים), קבועה לא צמודה, קבועה צמודה למדד, ומשתנה כל חמש שנים. שילוב נכון מאזן בין יציבות בתשלום לבין עלות.','المسارات الرئيسية: البرايم (فائدة متغيّرة مع البرايم)، ثابتة غير مرتبطة، ثابتة مرتبطة بالمؤشر، ومتغيّرة كل خمس سنوات. المزج الصحيح يوازن بين ثبات الدفعة والتكلفة.','The main tracks: prime (floats with prime), fixed unlinked, fixed CPI-linked, and variable every five years. A good mix balances a stable payment against total cost.'],
  kbt_spitzer:['לוח שפיצר','جدول شبيتسر (دفعات متساوية)','Spitzer (equal payments)'],
  kb_spitzer:['שיטת החזר שבה התשלום החודשי קבוע. בהתחלה רוב התשלום הוא ריבית, ובהמשך רובו מקטין את הקרן.','طريقة سداد تكون فيها الدفعة الشهرية ثابتة. في البداية معظم الدفعة فائدة، ولاحقًا معظمها يقلّل أصل الدين.','A repayment method with a fixed monthly payment. At first most of it is interest; later most of it reduces the principal.'],
  kbt_equal:['קרן שווה','أصل متساوٍ','Equal principal'],
  kb_equal:['שיטת החזר שבה מחזירים כל חודש אותו חלק מהקרן ועוד ריבית. התשלום גבוה בהתחלה ויורד עם הזמן, וסך הריבית נמוך יותר מבשפיצר.','طريقة سداد تُعاد فيها كل شهر الحصة نفسها من أصل الدين مع الفائدة. الدفعة مرتفعة في البداية وتنخفض مع الوقت، ومجموع الفائدة أقل من شبيتسر.','Each month you repay the same share of principal plus interest. Payments start high and fall over time, and total interest is lower than with Spitzer.'],
  kbt_linked:['הצמדה למדד','الربط بالمؤشر','CPI linkage'],
  kb_linked:['בהלוואה צמודה, יתרת החוב מתעדכנת לפי מדד המחירים. כשיש אינפלציה, החוב והתשלום גדלים גם אם הריבית קבועה.','في القرض المرتبط بالمؤشر يتحدّث رصيد الدين وفق مؤشر الأسعار. مع التضخم يكبر الدين والدفعة حتى لو كانت الفائدة ثابتة.','In a CPI-linked loan the balance is updated by the price index. With inflation, the debt and the payment grow even if the rate is fixed.'],
  kbt_refi:['מחזור משכנתא','إعادة تمويل الرهن','Mortgage refinancing'],
  kb_refi:['החלפת המשכנתא הקיימת בחדשה בתנאים טובים יותר. כדאי להשוות את החיסכון בריבית מול עמלת הפירעון המוקדם והעלויות.','استبدال الرهن الحالي برهن جديد بشروط أفضل. يُستحسن مقارنة التوفير في الفائدة برسوم السداد المبكر والتكاليف.','Replacing your current mortgage with a new one on better terms. Compare the interest saved with the early-repayment fee and costs.'],
  kbt_prepay:['עמלת פירעון מוקדם','رسوم السداد المبكر','Early repayment fee'],
  kb_prepay:['עמלה שהבנק עשוי לגבות כשמחזירים הלוואה לפני הזמן, בעיקר במסלולים בריבית קבועה כשהריבית בשוק ירדה מאז שלקחתם אותה.','رسوم قد يتقاضاها البنك عند سداد القرض قبل موعده، خاصة في المسارات ذات الفائدة الثابتة إذا انخفضت فائدة السوق منذ أخذه.','A fee the bank may charge when you repay a loan early, mainly on fixed-rate tracks when market rates have fallen since you took it.'],
  kbt_purchase:['מס רכישה','ضريبة الشراء','Purchase tax'],
  kb_purchase:['מס שמשלמים בקניית דירה או נכס. לדירה יחידה יש מדרגות מקלות, ולמשקיעים ולדירה נוספת השיעור גבוה יותר.','ضريبة تُدفع عند شراء شقة أو عقار. للشقة الوحيدة شرائح مخفّفة، وللمستثمرين وللشقة الإضافية نسبة أعلى.','Tax paid when buying a home or property. A sole home has lenient brackets; investors and additional homes pay more.'],
  kbt_betterment:['מס שבח','ضريبة التحسين','Land appreciation tax'],
  kb_betterment:['מס על הרווח במכירת דירה או מקרקעין. מוכרי דירת מגורים יחידה יכולים לקבל פטור בתנאים מסוימים.','ضريبة على الربح من بيع شقة أو عقار. يمكن لبائعي شقة السكن الوحيدة الحصول على إعفاء بشروط معيّنة.','Tax on the gain from selling a home or land. Sellers of a sole residence can be exempt under certain conditions.'],
  kbt_effective:['ריבית אפקטיבית','الفائدة الفعلية','Effective interest rate'],
  kb_effective:['העלות האמיתית של ההלוואה בשנה, כולל עמלות ותדירות התשלומים. זו הדרך הנכונה להשוות בין הצעות של בנקים שונים.','التكلفة الحقيقية للقرض سنويًا، بما فيها الرسوم وتكرار الدفعات. وهي الطريقة الصحيحة للمقارنة بين عروض البنوك.','The true yearly cost of a loan, including fees and payment frequency. It is the right way to compare offers from different banks.'],
  kbt_credit:['תשלומים וקרדיט','التقسيط والائتمان','Instalments and credit'],
  kb_credit:['עסקת קרדיט או תשלומים עם ריבית מוסיפה עלות לרכישה. בדקו את הריבית האפקטיבית ואת הסכום הכולל שתשלמו לפני שמאשרים.','صفقة الائتمان أو التقسيط بفائدة تضيف تكلفة إلى الشراء. تحقّق من الفائدة الفعلية والمبلغ الإجمالي قبل الموافقة.','A credit or instalment deal with interest adds cost to a purchase. Check the effective rate and the total you will pay before agreeing.'],
  kbt_emergency:['קרן חירום','صندوق الطوارئ','Emergency fund'],
  kb_emergency:['כסף נזיל לשעת חירום, בדרך כלל 3–6 חודשי הוצאות. הוא מאפשר להתמודד עם אובדן הכנסה או הוצאה פתאומית בלי להיכנס לחובות.','مال سائل لحالات الطوارئ، عادةً مصاريف 3–6 أشهر. يتيح مواجهة فقدان الدخل أو نفقة مفاجئة دون الوقوع في الديون.','Cash set aside for emergencies, usually 3–6 months of expenses, so a lost income or a sudden bill does not push you into debt.'],
  kbt_networth:['שווי נקי','صافي الثروة','Net worth'],
  kb_networth:['כל הנכסים שלכם (חיסכון, השקעות, דירה) פחות כל ההתחייבויות (משכנתא, הלוואות). זה המדד הטוב ביותר למצב הכלכלי ולהתקדמות לאורך זמן.','كل أصولك (المدخرات والاستثمارات والشقة) ناقص كل الالتزامات (الرهن والقروض). هذا أفضل مقياس للوضع المالي وللتقدّم مع الوقت.','Everything you own (savings, investments, home) minus everything you owe (mortgage, loans). The best measure of your finances and progress over time.'],
  kbt_fire:['FIRE — עצמאות כלכלית','FIRE — الاستقلال المالي','FIRE — financial independence'],
  kb_fire:['שיטה של חיסכון והשקעה מוגברים כדי להגיע לעצמאות כלכלית ופרישה מוקדמת. כלל אצבע נפוץ: לצבור פי 25 מההוצאה השנתית ("כלל 4%").','أسلوب ادّخار واستثمار مكثّف للوصول إلى الاستقلال المالي والتقاعد المبكر. قاعدة شائعة: جمع 25 ضعف المصروف السنوي («قاعدة 4%»).','Saving and investing hard to reach financial independence and retire early. A common rule of thumb: build 25 times your yearly spending (the "4% rule").'],
  kbt_avgcost:['מחיר ממוצע','متوسط التكلفة','Average cost'],
  kb_avgcost:['כשקונים נכס בכמה פעמים ובמחירים שונים, המחיר הממוצע הוא סך ההשקעה חלקי מספר היחידות. השקעה קבועה כל חודש מפזרת את סיכון התזמון.','عند شراء أصل على عدة دفعات وبأسعار مختلفة، متوسط التكلفة هو مجموع الاستثمار مقسومًا على عدد الوحدات. الاستثمار الثابت شهريًا يوزّع مخاطر التوقيت.','When you buy an asset in several rounds at different prices, the average cost is total invested divided by units. Investing a fixed amount monthly spreads timing risk.'],
  kbt_yield:['תשואה','العائد','Return'],
  kb_yield:['הרווח מהשקעה באחוזים לתקופה. תשואה שנתית ממוצעת מאפשרת להשוות בין השקעות שנמשכו פרקי זמן שונים.','ربح الاستثمار كنسبة مئوية لفترة. العائد السنوي المتوسط يتيح المقارنة بين استثمارات امتدت فترات مختلفة.','The gain from an investment as a percentage over a period. An average yearly return lets you compare investments held for different lengths of time.'],
  kbt_rate:['שער יציג','السعر التمثيلي','Representative exchange rate'],
  kb_rate:['שער החליפין הרשמי שבנק ישראל מפרסם בכל יום עסקים. בנקים, צ׳יינג׳ים וחברות אשראי מוסיפים עליו מרווח, ולכן השער בפועל שונה מעט.','سعر الصرف الرسمي الذي ينشره بنك إسرائيل كل يوم عمل. تضيف البنوك ومحلات الصرافة وشركات الائتمان هامشًا عليه، لذلك يختلف السعر الفعلي قليلًا.','The official exchange rate the Bank of Israel publishes every business day. Banks, exchange offices and card companies add a margin, so the rate you get differs a little.'],
  kbt_crypto:['מטבעות קריפטו','العملات المشفّرة','Cryptocurrency'],
  kb_crypto:['מטבעות דיגיטליים כמו ביטקוין, שמחירם משתנה מאוד. בישראל רווח ממכירה או המרה שלהם חייב במס רווח הון.','عملات رقمية مثل البيتكوين، أسعارها شديدة التقلّب. في إسرائيل يخضع الربح من بيعها أو تحويلها لضريبة الأرباح الرأسمالية.','Digital currencies like Bitcoin whose prices swing widely. In Israel, gains from selling or swapping them are subject to capital gains tax.'],
  kbt_selfemp:['עוסק פטור ועוסק מורשה','المرخّص المعفى والمرخّص المسجَّل','Exempt vs licensed dealer'],
  kb_selfemp:['עוסק פטור לא גובה מע״מ ומחזור ההכנסות שלו מוגבל לתקרה שנתית; עוסק מורשה גובה מע״מ ומקזז את המע״מ על הוצאות. שניהם משלמים בעצמם מס הכנסה וביטוח לאומי.','المرخّص المعفى لا يجبي ضريبة القيمة المضافة ودخله محدود بسقف سنوي؛ المرخّص المسجَّل يجبيها ويخصم ضريبة المصاريف. كلاهما يدفع بنفسه ضريبة الدخل والتأمين الوطني.','An exempt dealer charges no VAT and has a yearly turnover cap; a licensed dealer charges VAT and offsets VAT on expenses. Both pay their own income tax and National Insurance.'],
  kbt_rentbuy:['לשכור או לקנות','الاستئجار أم الشراء','Rent or buy'],

  kb_debt:['שתי שיטות נפוצות: "כדור שלג" — סוגרים קודם את החוב הקטן לתחושת התקדמות; "מפולת" — סוגרים קודם את החוב בריבית הגבוהה, מה שחוסך יותר ריבית.','طريقتان شائعتان: «كرة الثلج» — سداد أصغر دين أولًا للشعور بالتقدّم؛ «الانهيار» — سداد الدين الأعلى فائدة أولًا، ما يوفّر فائدة أكثر.','Two common methods: the "snowball" pays the smallest debt first for momentum; the "avalanche" pays the highest-interest debt first, saving more interest.'],

  mv_c2:['הקלידו את הקוד שמופיע כאן ואת הסיסמה שלכם — וכל הנתונים יעברו.','اكتب الرمز الظاهر هنا وكلمة مرورك — وستنتقل كل البيانات.','Type the code shown here and your password — and all your data moves over.'],
  mv_s1:['שלחו לעצמכם את חבילת ההעברה (וואטסאפ, מייל או דרייב).','أرسل لنفسك حزمة النقل (واتساب أو بريد أو درايف).','Send yourself the transfer package (WhatsApp, email or Drive).'],
  mv_s2:['בטלפון החדש: 📲 טלפון חדש ← קבלה. הדביקו את החבילה, הקלידו את הקוד שמופיע כאן ואת הסיסמה.','على الهاتف الجديد: 📲 هاتف جديد ← الاستلام. الصق الحزمة واكتب الرمز الظاهر هنا وكلمة المرور.','On the new phone: 📲 New phone → Receive. Paste the package, type the code shown here and the password.'],
  mv_share:['שיתוף חבילת ההעברה','مشاركة حزمة النقل','Share the transfer package'],
  mv_secure:['הקוד אישי, תקף ל-15 דקות ומתחלף לבד. הוא לא נשלח עם החבילה — מקלידים אותו ידנית. בלי הקוד והסיסמה אי אפשר לפתוח את הנתונים.','الرمز شخصي وصالح لـ 15 دقيقة ويتغيّر تلقائيًا. لا يُرسل مع الحزمة — يُكتب يدويًا. بدون الرمز وكلمة المرور لا يمكن فتح البيانات.','The code is personal, valid for 15 minutes and changes by itself. It is never sent with the package — you type it in. Without the code and the password the data cannot be opened.'],
  mv_rHint:['הדביקו את חבילת ההעברה מהטלפון הקודם או בחרו את הקובץ, הקלידו את הקוד שמופיע בטלפון הקודם ואת הסיסמה.','الصق حزمة النقل من الهاتف السابق أو اختر الملف، واكتب الرمز الظاهر على الهاتف السابق وكلمة المرور.','Paste the transfer package from the old phone or choose the file, then type the code shown on the old phone and your password.'],
  mv_rHintIn:['הקלידו את הקוד שמופיע בטלפון הקודם ואת הסיסמה — החשבון יגיע מהענן. אפשר גם פשוט להתחבר עם אותו שם וסיסמה.','اكتب الرمز الظاهر على الهاتف السابق وكلمة المرور — سيصل الحساب من السحابة. ويمكن أيضًا تسجيل الدخول بنفس الاسم وكلمة المرور.','Type the code shown on the old phone and your password — the account comes from the cloud. You can also simply sign in with the same name and password.'],
  mv_codeIn:['קוד ההעברה מהטלפון הקודם','رمز النقل من الهاتف السابق','Transfer code from the old phone'],
  mv_havePkg:['יש לי חבילת העברה מהאתר','لدي حزمة نقل من الموقع','I have a transfer package from the website'],
  mv_codeBad:['הקוד בנוי מ-8 תווים, למשל 7KQ2-M9XA.','الرمز مكوّن من 8 خانات، مثلًا 7KQ2-M9XA.','The code has 8 characters, e.g. 7KQ2-M9XA.'],
  mv_codeWrong:['הקוד לא מתאים לחבילה. בדקו שהקלדתם את הקוד שמופיע עכשיו בטלפון הקודם.','الرمز لا يطابق الحزمة. تأكّد من كتابة الرمز الظاهر الآن على الهاتف السابق.','The code does not match the package. Check you typed the code shown now on the old phone.'],
  mv_notFound:['לא נמצאה העברה עם הקוד הזה. ייתכן שהקוד התחלף — הקלידו את הקוד שמופיע עכשיו בטלפון הקודם.','لم يُعثر على نقل بهذا الرمز. ربما تغيّر الرمز — اكتب الرمز الظاهر الآن على الهاتف السابق.','No transfer was found for this code. It may have changed — type the code shown now on the old phone.'],
  mv_expired:['פג תוקף ההעברה. צרו קוד חדש בטלפון הקודם ושלחו שוב.','انتهت صلاحية النقل. أنشئ رمزًا جديدًا على الهاتف السابق وأرسل مجددًا.','This transfer has expired. Create a new code on the old phone and send again.'],

  del_l3:['כל הנתונים של החשבון במכשיר הזה: הגדרות, תרחישים, ערכים שמורים, הוצאות ולקוחות','كل بيانات الحساب على هذا الجهاز: الإعدادات والسيناريوهات والقيم المحفوظة والمصروفات والعملاء','All of the account’s data on this device: settings, scenarios, saved values, expenses and clients'],
  del_l4:['הגיבוי בענן וקודי ההעברה לטלפון חדש','النسخة الاحتياطية في السحابة ورموز النقل إلى هاتف جديد','The cloud backup and the new-phone transfer codes'],
  del_note:['אם החשבון הועבר גם לטלפון אחר, צריך למחוק אותו גם שם. נתונים שנשמרו בלי חשבון נשארים.','إذا نُقل الحساب أيضًا إلى هاتف آخر فيجب حذفه هناك أيضًا. البيانات المحفوظة بدون حساب تبقى.','If the account was also moved to another phone, delete it there too. Data saved without an account stays.'],

  del_cloudFail:['לא הצלחנו למחוק את הגיבוי בענן, ולכן לא נמחק כלום. בדקו את החיבור ונסו שוב.','تعذّر حذف النسخة الاحتياطية في السحابة، لذلك لم يُحذف شيء. تحقق من الاتصال وحاول مرة أخرى.','The cloud backup could not be deleted, so nothing was deleted. Check the connection and try again.'],

  rc_title:['📧 אימות אימייל ושחזור סיסמה','📧 تأكيد البريد واستعادة كلمة المرور','📧 Email verification and password recovery'],

  rc_pill_ok:['✓ מאומת','✓ مؤكد','✓ Verified'],
  rc_intro:['אם תשכחו את הסיסמה, אימייל מאומת יאפשר לקבוע סיסמה חדשה בלי לאבד נתונים. אין שרת: אתם שולחים לעצמכם מייל עם קוד שחזור, והאימייל נשמר רק בחשבון שלכם.','إذا نسيت كلمة المرور، يتيح البريد المؤكد تعيين كلمة مرور جديدة دون فقدان البيانات. لا يوجد خادم: ترسل لنفسك رسالة فيها رمز استعادة، ويُحفظ البريد في حسابك فقط.','If you forget your password, a verified email lets you set a new one without losing data. There is no server: you send yourself an email with a recovery key, and the address is stored only in your account.'],

  rc_step1:['לחצו "פתיחת המייל" ושלחו את ההודעה לעצמכם. אפשר גם להעתיק אותה ולשלוח ידנית.','اضغط "فتح الرسالة" وأرسلها لنفسك. يمكن أيضًا نسخها وإرسالها يدويًا.','Tap "Open the email" and send it to yourself. You can also copy it and send it manually.'],
  rc_step2:['כשהמייל מגיע, פתחו אותו והקלידו כאן את קוד השחזור שבתוכו, או לחצו על הקישור שבמייל.','عندما تصل الرسالة، افتحها واكتب هنا رمز الاستعادة الموجود فيها، أو اضغط الرابط في الرسالة.','When the email arrives, open it and type the recovery key from it here, or tap the link in the email.'],

  rc_sent:['שלחתם? עכשיו פתחו את המייל שהגיע והקלידו את הקוד כאן.','هل أرسلت؟ افتح الآن الرسالة التي وصلت واكتب الرمز هنا.','Sent? Now open the email that arrived and type the key here.'],

  rc_codeWrong:['הקוד לא נכון. העתיקו אותו מהמייל האחרון שנשלח.','الرمز غير صحيح. انسخه من آخر رسالة أُرسلت.','The key is wrong. Copy it from the latest email you sent.'],
  rc_codeShort:['קוד השחזור באורך 20 תווים, בצורה XXXXX-XXXXX-XXXXX-XXXXX.','رمز الاستعادة من 20 حرفًا بالشكل XXXXX-XXXXX-XXXXX-XXXXX.','The recovery key has 20 characters, like XXXXX-XXXXX-XXXXX-XXXXX.'],

  rc_removed:['האימייל הוסר. בלי אימייל לא ניתן לשחזר סיסמה שנשכחה.','تمت إزالة البريد. بدون بريد لا يمكن استعادة كلمة مرور منسية.','Email removed. Without it, a forgotten password cannot be recovered.'],
  rc_subj:['מחשבון פיננסי · קוד שחזור ל-{n}','الحاسبة المالية · رمز استعادة لـ {n}','Financial calculator · recovery key for {n}'],
  rc_body:['שלום,\n\nזה קוד השחזור של החשבון {n} במחשבון הפיננסי:\n\n{c}\n\nלאימות האימייל: הקלידו את הקוד באפליקציה, בהגדרות ← חשבון והרשאות ← אימות אימייל.\nשכחתם סיסמה? במסך הכניסה לחצו "שכחתי סיסמה", הקלידו את שם המשתמש ואת הקוד, וקבעו סיסמה חדשה. כל הנתונים נשמרים.','مرحبًا،\n\nهذا رمز استعادة الحساب {n} في الحاسبة المالية:\n\n{c}\n\nلتأكيد البريد: اكتب الرمز في التطبيق، في الإعدادات ← الحساب ← تأكيد البريد.\nنسيت كلمة المرور؟ في شاشة الدخول اضغط "نسيت كلمة المرور"، واكتب اسم المستخدم والرمز، ثم عيّن كلمة مرور جديدة. تبقى كل البيانات.','Hello,\n\nThis is the recovery key for the account {n} in the financial calculator:\n\n{c}\n\nTo verify the email: type the key in the app, under Settings → Account → Email verification.\nForgot your password? On the sign-in screen tap "Forgot password", type the username and the key, and choose a new password. All data is kept.'],
  rc_bodyLink:['או פשוט לחצו על הקישור:','أو اضغط الرابط ببساطة:','Or just tap the link:'],
  rc_bodyKeep:['שמרו את המייל הזה ואל תעבירו אותו לאף אחד: מי שיש לו את הקוד יכול לקבוע סיסמה חדשה לחשבון.','احتفظ بهذه الرسالة ولا تشاركها مع أحد: من يملك الرمز يمكنه تعيين كلمة مرور جديدة للحساب.','Keep this email and do not share it: anyone with the key can set a new password for the account.'],
  rc_forgot:['שכחתי סיסמה','نسيت كلمة المرور','Forgot password'],
  rc_rTitle:['שחזור סיסמה דרך האימייל','استعادة كلمة المرور عبر البريد','Recover the password by email'],

  rc_noAcc:['החשבון לא נמצא במכשיר הזה.','الحساب غير موجود على هذا الجهاز.','The account was not found on this device.'],

  rc_stale:['הקוד נכון, אבל לא הצלחנו לפתוח את הנתונים השמורים. שלחו מייל שחזור חדש מהמכשיר שבו אתם מחוברים.','الرمز صحيح لكن تعذّر فتح البيانات المحفوظة. أرسل رسالة استعادة جديدة من الجهاز الذي تسجّل الدخول فيه.','The key is right, but the saved data could not be opened. Send a new recovery email from a device where you are signed in.'],

  f_signupAll:['הרשמת משתמשים חדשים באפליקציה','تسجيل مستخدمين جدد في التطبيق','New user sign-ups in the app'],
  h_signupAll:['כשחסום, אף אחד לא יכול להירשם או להוסיף חשבון חדש, בשום מכשיר, גם לא דרך טלפון חדש, כניסה מהענן או שחזור. החסימה נשמרת בענן ורק אתה, בעל האפליקציה, יכול לשנות אותה. משתמשים קיימים ממשיכים להיכנס כרגיל.','عند الحظر لا يستطيع أحد التسجيل أو إضافة حساب جديد على أي جهاز، ولا عبر هاتف جديد أو الدخول من السحابة أو الاستعادة. يُحفظ الحظر في السحابة وأنت فقط، مالك التطبيق، يمكنك تغييره. يستمر المستخدمون الحاليون بالدخول كالمعتاد.','When blocked, nobody can sign up or add a new account on any device, not via new phone, cloud sign-in or recovery either. The block is stored in the cloud and only you, the app owner, can change it. Existing users keep signing in as usual.'],
  h_signupDev:['כשחסום, אי אפשר ליצור או להוסיף חשבון חדש במכשיר הזה, גם לא דרך טלפון חדש או שחזור. רק {n} יכול לשנות את ההגדרה.','عند الحظر لا يمكن إنشاء أو إضافة حساب جديد على هذا الجهاز، ولا عبر هاتف جديد أو الاستعادة. فقط {n} يمكنه تغيير الإعداد.','When blocked, no new account can be created or added on this device, not via new phone or recovery either. Only {n} can change this setting.'],
  h_signupLocked:['ההגדרה נעולה: רק {n} יכול לשנות אותה.','الإعداد مقفل: فقط {n} يمكنه تغييره.','This setting is locked: only {n} can change it.'],
  h_signupByOwner:['בעל האפליקציה חסם הרשמה של משתמשים חדשים, ורק הוא יכול לפתוח אותה.','حظر مالك التطبيق تسجيل المستخدمين الجدد، وهو وحده يمكنه فتحه.','The app owner has blocked new sign-ups, and only the owner can reopen them.'],
  m_closedAll:['בעל האפליקציה חסם הרשמה של משתמשים חדשים. אפשר להיכנס רק לחשבון קיים.','حظر مالك التطبيق تسجيل المستخدمين الجدد. يمكن الدخول إلى حساب موجود فقط.','The app owner has blocked new sign-ups. You can only sign in to an existing account.'],
  m_closedAdd:['הוספת חשבון חדש למכשיר הזה חסומה. אפשר להיכנס רק לחשבון שכבר נמצא כאן.','إضافة حساب جديد إلى هذا الجهاز محظورة. يمكن الدخول فقط إلى حساب موجود هنا.','Adding a new account to this device is blocked. You can only sign in to an account already here.'],
  pol_closed:['ההרשמה נחסמה','تم حظر التسجيل','Sign-up blocked'],
