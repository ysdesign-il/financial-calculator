/* --- inflation (Israeli CPI) --- */
/* Annual change in Israel's consumer price index, % (source: inflationtool.com, from CBS CPI data).
   2026: change since the start of the year up to August 2026 (CBS release of 15.9.2026). */
const INFL_IL = {1990:18.11,1991:17.77,1992:9.76,1993:10.78,1994:14.36,1995:7.87,1996:10.85,1997:7.12,1998:8.64,1999:1.22,
  2000:0,2001:1.36,2002:6.71,2003:-1.96,2004:1.28,2005:2.39,2006:-0.14,2007:3.16,2008:4,2009:3.85,2010:2.72,2011:2.16,2012:1.53,
  2013:1.97,2014:-0.23,2015:-0.91,2016:-0.23,2017:0.35,2018:0.8,2019:0.57,2020:-0.68,2021:2.85,2022:5.32,2023:2.95,2024:3.17,2025:2.68,2026:2.1};
const INFL_Y0 = 1989, INFL_Y1 = 2026;
function calcInflation(){
  const mode = $('#in_mode').value, amt = Math.max(0, v('in_amt'));
  const warn = [];
  if (mode === 'past'){
    let y0 = Math.round(v('in_from')), y1 = Math.round(v('in_to'));
    if (!(y0 >= INFL_Y0 && y0 <= INFL_Y1) || !(y1 >= INFL_Y0 && y1 <= INFL_Y1)) warn.push(t('w_inRange', {a: INFL_Y0, b: INFL_Y1}));
    y0 = clamp(y0 || 2010, INFL_Y0, INFL_Y1); y1 = clamp(y1 || INFL_Y1, INFL_Y0, INFL_Y1);
    const back = y1 < y0, lo = Math.min(y0, y1), hi = Math.max(y0, y1);
    let f = 1; const Y = [{y: lo, f: 1, r: null}];
    for (let y = lo + 1; y <= hi; y++){ f *= 1 + INFL_IL[y] / 100; Y.push({y, f, r: INFL_IL[y]}); }
    const fac = back ? 1 / f : f, out = amt * fac, n = hi - lo;
    const avg = n > 0 ? (Math.pow(f, 1 / n) - 1) * 100 : 0;
    return {
      hero: {label: t('r_inEq', {a: M(amt), y0, y1}), value: M(out, 2), sub: t('r_inCum') + ': ' + PC((f - 1) * 100) + ' (' + lo + '–' + hi + ')'},
      rows: [
        [t('r_inEq', {a: M(amt), y0, y1}), M(out, 2), 'key'],
        [t('r_inCum'), PC((f - 1) * 100)],
        [t('r_inAvg'), PC(avg)],
        [t('r_inPower', {a: M(amt), y: hi, y0: lo}), M(amt / f, 2)],
        [t('r_inLost'), PC((1 - 1 / f) * 100)]
      ],
      warn: warn.length ? warn : null, note: t('n_inPast') + (hi === 2026 ? ' ' + t('w_in2026', {m: monthName(MKT.cpiYtdTo), v: PC(MKT.cpiYtd)}) : ''),
      chart: {title: t('c_inPrice', {a: M(amt), y: lo}), unit: t('w_year'), fmt: x => M(x),
        layers: [{name: t('l_inBase'), cls:'c-ink', values: Y.map(() => amt)}, {name: t('l_inAdd'), cls:'c-accent', values: Y.map(r => Math.max(0, amt * r.f - amt))}],
        labels: Y.map(r => r.y)},
      table: {title: t('t_inYears'), head: [t('w_year'), t('h_inYr'), t('h_inValue', {a: M(amt), y: lo})],
        rows: Y.map(r => [r.y + (r.y === 2026 ? '*' : ''), r.r == null ? '—' : PC(r.r), M(amt * r.f, 2)])}
    };
  }
  const n = clamp(Math.round(v('in_years')), 1, 60), i = v('in_rate') / 100;
  if (mode === 'future'){
    const Y = []; for (let y = 0; y <= n; y++) Y.push({y, p: amt * Math.pow(1 + i, y)});
    const fut = amt * Math.pow(1 + i, n), real = amt / Math.pow(1 + i, n);
    return {
      hero: {label: t('r_inFut', {a: M(amt), n}), value: M(fut, 2), sub: t('r_inReal', {n}) + ': ' + M(real, 2)},
      rows: [[t('r_inFut', {a: M(amt), n}), M(fut, 2), 'key'], [t('r_inReal', {n}), M(real, 2)], [t('r_inLost'), PC((1 - real / Math.max(amt, 1e-9)) * 100)],
             [t('r_inCum'), PC((Math.pow(1 + i, n) - 1) * 100)]],
      note: t('n_inFuture'),
      chart: {title: t('c_inFuture'), unit: t('w_year'), fmt: x => M(x),
        layers: [{name: t('l_inBase'), cls:'c-ink', values: Y.map(() => amt)}, {name: t('l_inAdd'), cls:'c-accent', values: Y.map(r => Math.max(0, r.p - amt))}],
        labels: Y.map(r => r.y)},
      table: {title: t('t_yearly'), head: [t('w_year'), t('h_inCost'), t('h_inReal')], rows: Y.map(r => [r.y, M(r.p, 2), M(amt * amt / r.p || 0, 2)])}
    };
  }
  const r = v('in_nom') / 100, rr = (1 + r) / (1 + i) - 1;
  const Y = []; for (let y = 0; y <= n; y++){ const nom = amt * Math.pow(1 + r, y); Y.push({y, nom, real: nom / Math.pow(1 + i, y)}); }
  const last = Y[Y.length - 1];
  return {
    hero: {label: t('r_inRR'), value: PC(rr * 100), sub: t('r_inRealEnd', {n}) + ': ' + M(last.real)},
    rows: [[t('r_inRR'), PC(rr * 100), 'key'], [t('r_inNomEnd', {n}), M(last.nom)], [t('r_inRealEnd', {n}), M(last.real), 'key'],
           [t('r_inRealGain'), M(last.real - amt)], [t('r_inEaten'), M(last.nom - last.real)]],
    warn: rr < 0 ? [t('w_inNeg')] : null, warnOk: rr >= 0 ? t('ok_inPos') : null, note: t('n_inReal'),
    chart: {title: t('c_inReal'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_inRealV'), cls:'c-ink', values: Y.map(y => y.real)}, {name: t('l_inEaten'), cls:'c-accent', values: Y.map(y => Math.max(0, y.nom - y.real))}],
      labels: Y.map(y => y.y)},
    table: {title: t('t_yearly'), head: [t('w_year'), t('h_inNom'), t('h_inReal')], rows: Y.map(y => [y.y, M(y.nom), M(y.real)])}
  };
}

/* --- interest & prime (Israel: prime = Bank of Israel rate + 1.5%) --- */
var PRIME_SPREAD = 1.5;
function calcPrime(){
  const mode = $('#pr_mode').value, amt = Math.max(0, v('pr_amt'));
  const boi = Math.max(0, v('pr_boi')), prime = boi + PRIME_SPREAD, margin = v('pr_margin');
  const base = Math.max(0, prime + margin);
  const sgn = x => (x >= 0 ? '+' : '−') + N(Math.abs(x), null, 2) + '%';
  const rateTxt = t('r_prRateIs', {p: PC(prime), m: sgn(margin), r: PC(base)});
  if (mode === 'loan'){
    const n = clamp(Math.round(v('pr_years') * 12), 1, 600), eq = $('#pr_method').value === 'equal';
    const dR = v('pr_dRate'), dAt = clamp(Math.round(v('pr_dAt') * 12), 0, n);
    let bal = amt, pay = 0, first = 0, after = null, totI = 0, curR = -1;
    const Y = []; let yI = 0, yP = 0, yPay = 0;
    for (let m = 1; m <= n && bal > 1e-6; m++){

    const per = base > 0 ? price / base * (dim === 'u' ? 1 : 1000) : NaN; return {name: asEsc(upName(o, i)), dim, per, price, o}; });
  const unit = d => t(d === 'w' ? 'r_upPerKg' : d === 'v' ? 'r_upPerL' : 'r_upPerU');
  const dims = ['w', 'v', 'u'].filter(d => L.some(x => x.dim === d && isFinite(x.per)));
  const bestOf = d => L.filter(x => x.dim === d && isFinite(x.per)).sort((a, b) => a.per - b.per)[0];
  const main = dims.map(d => ({d, b: bestOf(d), n: L.filter(x => x.dim === d && isFinite(x.per)).length})).sort((a, b) => b.n - a.n)[0];

    rows.push([x.name + ' · ' + unit(d), M(x.per, 2), x === b ? 'key' : '']); }); });

/* --- discounts and deals --- */
function calcDiscount(){

  let pay = p * q, units = q, label = '';

  else if (mode === 'stack'){ pay = p * q * (1 - clamp(v('ds_pct'), 0, 100) / 100) * (1 - clamp(v('ds_pct2'), 0, 100) / 100); }
  else if (mode === 'bogo'){ const buy = Math.max(1, Math.round(v('ds_buy'))), free = Math.max(0, Math.round(v('ds_free'))); units = buy + free; pay = p * buy; label = t('r_dsBogo', {b: buy, f: free}); }

/* --- working days between dates (Israel) --- */
function wdIndep(year){       // Independence Day, moved by the rules for Friday, Saturday and Monday

    const h = holHeb(d); if (h && h[0] === 'Iyar' && h[1] === 5){ const x = new Date(d), dow = x.getDay();
      if (dow === 5) x.setDate(x.getDate() - 1); else if (dow === 6) x.setDate(x.getDate() - 2); else if (dow === 1) x.setDate(x.getDate() + 1); return x; }
  }
  return null;
}

/* Where the page may call out (for example when saved and hosted elsewhere),
   pull fresh rates; in this hosted page the request is blocked, so the stored
   daily snapshot stays and the status line says so. */
async function tryLive(manual){
  if (typeof fxRecent === 'function' && fxRecent()){ stampUpdate(true); return; }
  const st = $('#x_status');
  if (manual && st) st.textContent = t('st_loading');
  let ok = false;
  let gmsg = '';
  if (SET.rateSrc === 'gemini'){
    if (!gemOn()) gmsg = t('st_gnokey');
    else if (await tryLiveGemini(!!manual)){ ok = true; }
    else gmsg = META.gerr === 'blocked' || META.gerr === 'timeout' ? t('st_gblocked', {d: dateStr()}) : t('st_gerr', {e: META.gerr || '?', d: dateStr()});
  }
  if (!ok) try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(SET.rateSrc === 'ecb' ? 'https://api.frankfurter.app/latest?from=USD' : 'https://open.er-api.com/v6/latest/USD', {signal: ctl.signal});
    clearTimeout(to);
    if (r.ok){
      const j = await r.json();
      if (j && (j.result === 'success' || j.date) && j.rates && j.rates.ILS){
        RATES = Object.assign({}, RATES, j.rates, {USD: 1});
        META.live = true;
        META.unix = j.time_last_update_unix || (j.date ? Date.parse(j.date) / 1000 : META.unix);
        ok = true;
        fillCurSelects();
        calc(tab);
      }
    }
  } catch(e) { /* keep snapshot */ }
  await tryLiveCrypto();
  if (manual && st) st.textContent = ok ? t(META.gemini && SET.rateSrc === 'gemini' ? 'st_gok' : 'st_ok', {d: dateStr()}) : (gmsg || t('st_fail', {d: dateStr()}));
  if (typeof stampUpdate === 'function') stampUpdate(ok);
}

/* ---- account: username + strong password, data encrypted at rest ---- */
const accKey = n => 'fin-acc:' + ENC_NAME(n);
const encName = n => 'fin-enc:' + ENC_NAME(n);
const pwChecks = p => ({len: p.length >= 8, up: /[A-Z]/.test(p), sp: /[^A-Za-z0-9\s]/.test(p)});
const pwOk = p => { const c = pwChecks(p); return c.len && c.up && c.sp; };
const accMsg = (k, params, ok) => { const e = $('#acc_msg'); if (!e) return; e.textContent = k ? t(k, params) : ''; e.classList.toggle('ok', !!ok); };
const accName = n => String(n || '').replace(/\s+/g, ' ').trim();
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function pbk(pw, salt, iter, bits){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, key, bits);
}
const hashPw = async (pw, salt, iter) => b64(await pbk(pw, salt, iter, 256));
const getAcc = n => { try { return JSON.parse(RAWLS.getItem(accKey(n)) || 'null'); } catch (e) { return null; } };
function lockLeft(n){
  try { const f = JSON.parse(RAWLS.getItem('fin-fail:' + accKey(n)) || '{"c":0,"t":0}'); return f.c >= 5 ? Math.max(0, Math.ceil((f.t + Math.min(900, 30 * Math.pow(2, f.c - 5)) * 1000 - Date.now()) / 1000)) : 0; } catch (e) { return 0; }
}
function noteFail(n, ok){
  const k = 'fin-fail:' + accKey(n);
  try { if (ok){ RAWLS.removeItem(k); return; } const f = JSON.parse(RAWLS.getItem(k) || '{"c":0,"t":0}'); f.c++; f.t = Date.now(); RAWLS.setItem(k, JSON.stringify(f)); } catch (e) {}
}
/* encrypt a key/value map with a raw AES key and store it */
async function sealMap(name, rawB64, map){
  const iv = rnd(12);
  const key = await crypto.subtle.importKey('raw', u8(rawB64), 'AES-GCM', false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(map)));
  const at = Date.now();
  RAWLS.setItem(encName(name), JSON.stringify({iv: b64(iv), ct: b64(ct), at, by: LIVE_ID}));
  LIVE_SEAL_AT = at;
}
async function persistNow(){
  if (!FUSER) return;
  const ek = SS.getItem('fin-ek'); if (!ek) return;
  const map = {}; DATA_KEYS.forEach(k => { const v = SS.getItem(WK(k)); if (v != null) map[k] = v; });
  const ts = SS.getItem(WK('__ts')); if (ts) map.__ts = ts;
  const j = JSON.stringify(map);
  if (!LIVE_FORCE && j === LIVE_SEALED && RAWLS.getItem(encName(FUSER))) return;     // nothing new: leave newer copies from other windows alone
  LIVE_FORCE = false;
  try { await sealMap(FUSER, ek, map); LIVE_SEALED = j; } catch (e) {}
}
/* unlock = decrypt stored data into the per-tab working copy, then start the session */
async function unlockSession(name, pw, rec, seed){
  if (!rec.esalt) rec.esalt = b64(rnd(16));
  const raw = b64(await pbk(pw, u8(rec.esalt), 200000, 256));
  const sfx = ':' + ENC_NAME(name);
  let map = {};
  try {
    const blob = JSON.parse(RAWLS.getItem(encName(name)) || 'null');
    if (blob){
      const key = await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt']);
      map = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(blob.iv)}, key, u8(blob.ct))));
    }
  } catch (e) { map = {}; }
  DATA_KEYS.forEach(k => { const old = RAWLS.getItem(k + sfx); if (old != null){ if (map[k] == null) map[k] = old; RAWLS.removeItem(k + sfx); } });
  Object.keys(seed || {}).forEach(k => { if (DATA_KEYS.includes(k)) map[k] = String(seed[k]); });
  RAWLS.setItem(accKey(name), JSON.stringify(rec));
  await sealMap(name, raw, map);
  Object.keys(map).forEach(k => SS.setItem('w:' + k + sfx, map[k]));
  SS.setItem('fin-user', name); SS.setItem('fin-ek', raw);
  try { RAWLS.removeItem('fin-user'); } catch (e) {}
  try { location.reload(); } catch (e) {}
}
async function doSignup(){
  if (!(window.crypto && crypto.subtle)) return accMsg('m_nocrypto');
  try { await PERM_P; await polInit(); } catch (e) {}
  if (!signupGlobalOpen()) return accMsg('m_closedAll');
  if (!signupAllowed()) return accMsg('m_closed');
  const name = hdNorm($('#acc_ruser').value), p = $('#acc_rpass').value, p2 = $('#acc_rpass2').value;
  if (!hdValid(name)) return accMsg('hd_bad');
  if (!pwOk(p)) return accMsg('m_weak');
  if (p !== p2) return accMsg('m_mismatch');
  if (getAcc(name)) return accMsg('m_exists');
  accMsg('hd_checking', null, true);
  if (!HD.ready) await hdInit();
  if (HD.ready){
    const r = await hdClaim(name);
    if (r !== 'ok') return accMsg({taken: 'hd_taken', noWrite: 'hd_noWrite'}[r] || 'hd_err', {n: '@' + name});
  }
  accMsg('m_wait', null, true);
  const salt = rnd(16), iter = 200000;
  const rec = {name, salt: b64(salt), hash: await hashPw(p, salt, iter), iter};
  try { await unlockSession(name, p, rec, {}); } catch (e) { accMsg('m_nocrypto'); }
}
async function doLogin(){
  if (!(window.crypto && crypto.subtle)) return accMsg('m_nocrypto');
  const name = hdNorm($('#acc_user').value), p = $('#acc_pass').value;
  const lk = lockLeft(name); if (lk > 0) return accMsg('m_lock', {s: lk});
  const rec = name ? getAcc(name) : null;
  accMsg('m_wait', null, true);
  let ok = false;
  if (rec){ try { ok = (await hashPw(p, u8(rec.salt), rec.iter || 200000)) === rec.hash; } catch (e) { ok = false; } }
  else { try { await hashPw(p, new Uint8Array(16), 200000); } catch (e) {} }
  noteFail(name, ok);
  if (!ok) return accMsg('m_bad');
  try { await unlockSession(rec.name, p, rec, {}); } catch (e) { accMsg('m_nocrypto'); }
}
async function doChange(){
  const rec = getAcc(FUSER); if (!rec) return;
  const cur = $('#acc_cur').value, n1 = $('#acc_new').value, n2 = $('#acc_new2').value;
  const lk = lockLeft(FUSER); if (lk > 0) return accMsg('m_lock', {s: lk});
  let ok = false; try { ok = (await hashPw(cur, u8(rec.salt), rec.iter || 200000)) === rec.hash; } catch (e) {}
  noteFail(FUSER, ok);
  if (!ok) return accMsg('m_bad');
  if (!pwOk(n1)) return accMsg('m_weak');
  if (n1 !== n2) return accMsg('m_mismatch');
  const salt = rnd(16); rec.salt = b64(salt); rec.iter = 200000; rec.hash = await hashPw(n1, salt, rec.iter);
  rec.esalt = b64(rnd(16));
  const raw = b64(await pbk(n1, u8(rec.esalt), 200000, 256));
  if (rec.rcv){ try { rec.rcv.wk = await rcWrap(rec.rcv.pub, raw); } catch (e) {} }
  SS.setItem('fin-ek', raw);
  try { RAWLS.setItem(accKey(FUSER), JSON.stringify(rec)); } catch (e) {}
  await persistNow();
  ['acc_cur', 'acc_new', 'acc_new2'].forEach(id => { $('#' + id).value = ''; });
  updPwReq($('#acc_new')); accMsg('m_pwChanged', null, true); secLog(FUSER, 'pw');
}

  while (hist.length && hist[0].role !== 'user') hist.shift();

        body: JSON.stringify({model, messages:[{role:'system', content: asSystem()}].concat(hist)})});
      if (!r.ok) throw new Error('HTTP ' + r.status);

function applyDbRates(d){
  if (!d || SET.boiDb === '0') return;

  const asOf = +d.asOf || 0;
  if (d.usd && typeof d.usd === 'object' && asOf > 0 && (asOf >= (META.unix || 0) || !META.live)){
    let n = 0;
    Object.keys(d.usd).forEach(k => {

      if ((k === 'ILS' || k === 'JOD') ? SET.src_boiFx === '0' : SET.src_ecb === '0') return;
      if (old && (v / old < 0.5 || v / old > 2)) return;      // reject implausible jumps
      RATES[k] = v; n++;
    });
    if (n){ RATES.USD = 1; META.unix = asOf; META.official = true; META.live = false; changed = true; }
  }
  const cAsOf = +d.cryptoAsOf || 0;
  if (d.crypto && typeof d.crypto === 'object' && cAsOf > (META.cunix || 0)){
    let n = 0;

async function fxTick(){

  if (document.hidden){ return; }                       // resumes on visibilitychange
  if (navigator.onLine === false){ fxStatus('fx_offline'); fxTimer = setTimeout(fxTick, 5000); return; }

          if (cr ? (q < 0.5 || q > 2) : (q < 0.8 || q > 1.25)) return;

  }
}
