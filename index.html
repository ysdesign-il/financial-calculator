/* --- VAT --- */
function calcVat(){
  const amt = Math.max(0, v('v_amount')), mode = $('#v_mode').value, preset = $('#v_preset').value;
  const rate = Math.max(0, preset === 'c' ? v('v_rate') : parseFloat(preset)) / 100;
  const qty = v('v_qty') > 0 ? v('v_qty') : 1, disc = clamp(v('v_disc'), 0, 100) / 100;
  let uNet, uVat, preNet;
  if (mode === 'add'){ preNet = amt; uNet = amt * (1 - disc); uVat = uNet * rate; }
  else if (mode === 'extract'){ preNet = amt / (1 + rate); uNet = amt * (1 - disc) / (1 + rate); uVat = uNet * rate; }
  else { uVat = amt; uNet = rate > 0 ? amt / rate : 0; preNet = uNet; }
  const uGross = uNet + uVat;
  const net = uNet * qty, vat = uVat * qty, gross = uGross * qty;
  const rows = [];
  if (disc > 0 && mode !== 'fromvat') rows.push([t('r_discAmt'), M(-(preNet - uNet) * qty, 2)]);
  rows.push([t('r_vatNet'), M(net, 2)], [t('r_vatAmt'), M(vat, 2)], [t('r_vatTotal'), M(gross, 2), 'key'],
            [t('r_vatShare'), PC(gross ? vat / gross * 100 : NaN)]);
  if (qty !== 1) rows.push([t('r_unitNet'), M(uNet, 2)], [t('r_unitGross'), M(uGross, 2)]);
  const showNet = mode === 'extract';
  return {
    hero: {label: t(showNet ? 'r_vatNet' : 'r_vatTotal'), value: M(showNet ? net : gross, 2), sub: t('s_vatSub', {v: M(vat, 2)})},
    rows, note: t('n_vat')
  };
}

/* --- Israeli income tax helpers --- */
function taxByBrackets(income){
  let prev = 0, tax = 0;
  const parts = [];
  for (const [lim, r] of TAX.brackets){
    const amt = Math.max(0, Math.min(income, lim) - prev);
    parts.push({from: prev, to: lim, rate: r, amt, tax: amt * r});
    tax += amt * r;
    prev = lim;
  }
  const sur = Math.max(0, income - TAX.surtaxFrom) * TAX.surtaxRate;
  return {tax, sur, parts};
}
function surtaxOf(total, cap){
  const ex = Math.max(0, total - TAX.surtaxFrom);
  return {s3: ex * TAX.surtaxRate, s2: Math.min(Math.max(0, cap), ex) * 0.02};
}
function marginalRate(income){
  let rate = TAX.brackets[0][1];
  for (const [lim, r] of TAX.brackets){ rate = r; if (income <= lim) break; }
  return rate + (income > TAX.surtaxFrom ? TAX.surtaxRate : 0);
}
function niSelf(annual){
  const m = annual / 12;
  const low = Math.min(m, TAX.niCut), high = Math.max(0, Math.min(m, TAX.niMax) - TAX.niCut);
  return (low * 0.077 + high * 0.18) * 12;
}
function salaryCalc(g, pts, pensPct, studyPct, o){
  const bonus = o.bonus / 12, base = g + bonus, taxBase = base + o.benefit;
  const b = taxByBrackets(taxBase * 12);
  const pens = base * pensPct / 100;
  const qual = Math.min(pens, TAX.pensDepRate * Math.min(base, TAX.pensSalaryCap));
  const credits = pts * TAX.point + TAX.pensCreditRate * qual * 12;
  const used = Math.min(credits, b.tax);
  const tax = (b.tax - used + b.sur) / 12;
  const low = Math.min(taxBase, TAX.niCut), high = Math.max(0, Math.min(taxBase, TAX.niMax) - TAX.niCut);
  const ni = low * TAX.niLow + high * TAX.niHigh;
  const health = low * TAX.hLow + high * TAX.hHigh;
  const study = base * studyPct / 100;
  const ded = tax + ni + health + pens + study;
  const erP = base * o.erPens / 100, erS = base * o.erSev / 100, erSt = base * o.erStudy / 100;
  const erNi = low * TAX.erNiLow + high * TAX.erNiHigh;
  return {gross: base, bonus, net: base - ded, tax, ni, health, pens, study, ded, credits: used / 12,
          erP, erS, erSt, erNi, employer: base + erP + erS + erSt + erNi};
}

/* --- rental income --- */
function calcRental(){
  const rentM = Math.max(0, v('r_rent')), yr = rentM * 12, other = Math.max(0, v('r_other'));
  const exp = Math.max(0, v('r_exp')), dep = Math.max(0, v('r_dep'));
  const pts = pointsOf('r');
  const E1 = 5654, E2 = 11308;
  const incTax = inc => { const b = taxByBrackets(inc); return Math.max(0, b.tax - pts * TAX.point) + b.sur; };
  const base = incTax(other);
  const taxableM = rentM <= E1 ? 0 : rentM >= E2 ? rentM : 2 * rentM - E2;
  const exemptAvail = rentM < E2;
  const tExempt = incTax(other + taxableM * 12) - base;
  const t10 = yr * 0.10;
  const tReg = incTax(other + Math.max(0, yr - exp - dep)) - base;
  const opts = [[t('r_trackReg'), tReg]];
  opts.push([t('r_track10'), t10]);
  if (exemptAvail) opts.push([t('r_trackExempt'), tExempt]);
  const best = opts.reduce((a, b) => b[1] < a[1] ? b : a);
  const rows = [
    [t('r_rentYear'), MI(yr)],
    [t('r_exemptCeil'), MI(E1)],
    [t('r_points'), ptsTxt('r', pts)],
    [t('r_trackExempt'), exemptAvail ? MI(tExempt) : t('r_na')],
    [t('r_track10'), MI(t10)],
    [t('r_trackReg'), MI(tReg)],
    [t('r_best'), best[0], 'key'],
    [t('r_netRent'), MI(yr - best[1]), 'key']
  ];
  return {
    hero: {label: t('r_best') + ': ' + best[0], value: MI(best[1]), sub: t('r_netRent') + ': ' + MI(yr - best[1])},
    rows, note: t('n_rental') + ' ' + t('n_points'),

      title: t('r_best'), open: true,

      rows: opts.map(o => [o[0], MI(o[1]), MI(yr - o[1])])
    }
  };
}
/* --- capital gains --- */
function calcCapital(){
  const kind = $('#cp_kind').value;
  const rates = {sec:.25, sub:.30, crypto:.25, div:.25, divsub:.30, int15:.15, int25:.25};
  const rate = rates[kind], isGain = ['sec','sub','crypto'].includes(kind);
  const sell = Math.max(0, v('cp_sell')), buy = Math.max(0, v('cp_buy')), fee = Math.max(0, v('cp_fee'));
  const cpi = kind === 'crypto' ? 0 : Math.max(0, v('cp_cpi'));
  const lossCf = Math.max(0, v('cp_loss')), other = Math.max(0, v('cp_other'));
  let nom = sell, infl = 0, real = sell, lossUsed = 0, taxable;
  if (isGain){
    nom = sell - buy - fee;
    infl = nom > 0 ? Math.min(nom, buy * cpi / 100) : 0;
    real = nom - infl;
    lossUsed = Math.min(Math.max(0, real), lossCf);
    taxable = Math.max(0, real - lossUsed);
  } else taxable = sell;
  const tax = taxable * rate;
  const a = surtaxOf(other + taxable, taxable), z = surtaxOf(other, 0);
  const sur = a.s3 - z.s3 + a.s2;
  const totalTax = tax + sur;
  const proceeds = (isGain ? sell - fee : sell) - totalTax;
  const rows = [];
  if (isGain){
    rows.push([t('r_nomGain'), M(nom)]);
    if (cpi > 0) rows.push([t('r_inflPart'), M(-infl)], [t('r_realGain'), M(real)]);
    if (lossUsed > 0) rows.push([t('r_lossUsed'), M(-lossUsed)]);
  }
  rows.push([t('r_taxableGain'), M(taxable)], [t('r_taxRate'), PC(rate * 100)], [t('r_taxAmt'), M(tax)]);
  if (sur > 0) rows.push([t('r_surCapTax'), M(sur)]);
  rows.push([t('r_netProceeds'), M(proceeds), 'key'], [t('r_effTax'), PC(isGain ? (nom > 0 ? totalTax / nom * 100 : NaN) : (sell > 0 ? totalTax / sell * 100 : NaN))]);
  return {
    hero: {label: t('r_taxAmt'), value: M(totalTax), sub: t('r_netProceeds') + ': ' + M(proceeds)},
    rows, note: t('n_capital'),
    split: {
      title: t('r_netProceeds'),
      items: [
        {name: t('r_netProceeds'), v: Math.max(0, proceeds), cls:'c-ink', fmt: M(proceeds)},
        {name: t('r_taxAmt'), v: totalTax, cls:'c-warm', fmt: M(totalTax)}
      ]
    }
  };
}

/* --- loan engine --- */
function loanSim(o){
  const r = o.rate / 1200, ci = Math.pow(1 + o.ci / 100, 1 / 12) - 1;
  let bal = o.amt, m = 0;
  const out = [];
  while (bal > 0.005 && m < o.n){
    m++;
    const idx = bal * ci; bal += idx;
    const int = bal * r, rem = o.n - m + 1;
    let pr;
    if (m <= o.grace) pr = 0;
    else if (o.type === 'annuity'){
      const pay = r === 0 ? bal / rem : bal * r / (1 - Math.pow(1 + r, -rem));
      pr = pay - int;
    } else if (o.type === 'equal') pr = bal / rem;
    else pr = m >= o.n ? bal : 0;
    if (o.base && o.mode === 'shorten' && m > o.grace && o.base[m - 1] != null) pr = Math.max(0, o.base[m - 1] - int);
    if (o.extra) pr += o.extra;
    if (o.pre && m === o.preM) pr += o.pre;
    pr = Math.min(pr, bal);
    if (m === o.n) pr = bal;
    bal -= pr;
    out.push({int, pr, idx, pay: int + pr, bal: Math.max(0, bal)});
  }
  return out;
}
function yearsOf(sim){
  const Y = [];
  sim.forEach((s, i) => {
    const y = Math.floor(i / 12);
    if (!Y[y]) Y[y] = {pr:0, int:0, idx:0, pay:0, end:0};
    Y[y].pr += s.pr; Y[y].int += s.int; Y[y].idx += s.idx; Y[y].pay += s.pay; Y[y].end = s.bal;
  });
  return Y;
}
function fmtDur(months){
  return t('w_yrsMonths', {y: Math.floor(months / 12), m: months % 12});
}
function calcLoan(){
  const amt = Math.max(0, v('l_amount')), rate = Math.max(0, v('l_rate'));
  const yrs = clamp(v('l_years'), 0.25, 50), type = $('#l_type').value;
  const n = Math.max(1, Math.round(yrs * 12));
  const grace = clamp(Math.round(v('l_grace')), 0, n - 1);
  const extra = Math.max(0, v('l_extra')), pre = Math.max(0, v('l_pre')), preM = clamp(Math.round(v('l_preM')), 1, n);
  const cpi = clamp(v('l_cpi'), 0, 30), feePct = Math.max(0, v('l_feePct')), feeFix = Math.max(0, v('l_feeFix'));
  const cfg = {amt, rate, n, type, grace, ci: cpi, extra: 0, pre: 0, preM};
  const base = loanSim(cfg);
  const has = extra > 0 || pre > 0;
  const sim = has ? loanSim(Object.assign({}, cfg, {extra, pre, mode: $('#l_after').value, base: base.map(x => x.pay)})) : base;
  const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);
  const totalInt = sum(sim, 'int'), idxTot = sum(sim, 'idx'), paid = sum(sim, 'pay');
  const fee = amt * feePct / 100 + feeFix;
  /* effective annual cost (IRR on cash flows) */

  let lo = 0, hi = 1;
  const f = x => sim.reduce((s, c, i) => s + c.pay / Math.pow(1 + x, i + 1), 0) - net0;
  for (let i = 0; i < 100; i++){ const mid = (lo + hi) / 2; if (f(mid) > 0) lo = mid; else hi = mid; }
  const apr = (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100;
  const first = sim[0] ? sim[0].pay : 0, last = sim.length ? sim[sim.length - 1].pay : 0;
  const peak = sim.reduce((a, c) => Math.max(a, c.pay), 0);
  const rows = [[t('r_firstPay'), M(first, 2)]];
  if (Math.abs(last - first) > 0.01) rows.push([t('r_lastPay'), M(last, 2)]);
  if (peak - first > 0.01 && peak - last > 0.01) rows.push([t('r_peakPay'), M(peak, 2)]);
  rows.push([t('r_loanAmt'), M(amt)], [t('r_totInt'), M(totalInt)]);
  if (idxTot > 0) rows.push([t('r_idxAdd'), M(idxTot)]);
  if (fee > 0) rows.push([t('r_feeTotal'), M(fee)]);
  rows.push([t('r_totPaid'), M(paid + fee), 'key'],
    [t('r_intPct'), PC(amt > 0 ? totalInt / amt * 100 : NaN)],
    [t('r_numPay'), N(sim.length, 0)],
    [t('r_payoff'), fmtDur(sim.length)]);
  if (fee > 0 || cpi > 0) rows.push([t('r_apr'), PC(apr)]);
  if (has){
    rows.push([t('r_intSaved'), M(sum(base, 'int') - totalInt)], [t('r_monthsSaved'), fmtDur(Math.max(0, base.length - sim.length))]);
  }
  const Y = yearsOf(sim);
  const layers = [
    {name: t('l_principal'), cls:'c-ink', values: Y.map(y => y.pr)},
    {name: t('l_interest'), cls:'c-warm', values: Y.map(y => y.int)}
  ];
  if (idxTot > 0) layers.push({name: t('r_idxAdd'), cls:'c-soft', values: Y.map(y => y.idx)});
  const grp = type === 'annuity' && !has && cpi === 0 && grace === 0;
  return {
    hero: {label: t(grp ? 'r_monthly' : 'r_firstPay'), value: M(first, 2), sub: t('r_totInt') + ': ' + M(totalInt)},
    rows,
    chart: {
      title: t('c_loanChart'), unit: t('w_year'), fmt: x => M(x), layers, labels: Y.map((_, i) => i + 1)
    },
    table: {
      title: t('t_amort'),
      head: [t('w_year'), t('l_principal'), t('l_interest'), t('h_balance')],
      rows: Y.map((y, i) => [i + 1, M(y.pr), M(y.int + y.idx), M(y.end)])
    }
  };
}

function calcMortgage(){

                       grace: 0, ci: kind === 'cpi' ? cpi : 0, extra: 0, pre: 0, preM: 0});

  if (isFinite(pti) && pti > 50) warn.push(t('w_pti', {a: N(pti, 1)}));
  const Ys = sims.map(yearsOf), len = Math.max(0, ...Ys.map(y => y.length));
  const agg = k => Array.from({length: len}, (_, i) => Ys.reduce((a, y) => a + (y[i] ? y[i][k] : 0), 0));
  const prY = agg('pr'), intY = agg('int').map((x, i) => x + agg('idx')[i]);

  return {
    hero: {label: t('r_firstTotal'), value: M(firstTotal), sub: t('r_mLoan') + ': ' + M(loan) + ' · ' + t('r_ltv') + ' ' + PC(ltv)},

      rows: prY.map((x, i) => [i + 1, M(x), M(intY[i]), M(endY[i])])

/* --- compound interest --- */
function compSim(o, months){
  const rate = (o.rate - o.fee) / 100, f = o.f;
  const rm = Math.pow(1 + rate / f, f / 12) - 1;
  let bal = o.p0, dep = o.p0, m = 0;
  const hist = [];
  for (; m < months; m++){
    const k = m % 12, y = Math.floor(m / 12);
    if (k === 0 && o.yearly){ bal += o.yearly; dep += o.yearly; }
    const d = o.mo * Math.pow(1 + o.g, y);
    if (o.start){ bal += d; dep += d; bal *= 1 + rm; }
    else { bal *= 1 + rm; bal += d; dep += d; }
    if (k === 11 || m === months - 1) hist.push({y: y + 1, dep, int: bal - dep, bal});
    if (o.goal && bal >= o.goal){ if (k !== 11) hist.push({y: y + 1, dep, int: bal - dep, bal}); m++; break; }
  }
  return {bal, dep, hist, months: m};
}
function calcCompound(){
  const mode = $('#c_mode').value;
  const o = {p0: Math.max(0, v('c_init')), mo: Math.max(0, v('c_monthly')), rate: v('c_rate'), fee: Math.max(0, v('c_mgmt')),
             f: parseInt($('#c_freq').value, 10) || 12, g: v('c_depG') / 100, yearly: Math.max(0, v('c_yearly')),
             start: $('#c_time').value === 'start'};
  const goal = Math.max(0, v('c_goal'));
  const tax = clamp(v('c_tax'), 0, 100) / 100, infl = v('c_infl') / 100;
  let months = clamp(Math.round(v('c_years')), 1, 60) * 12, sim, reached = true;
  if (mode === 'dep'){
    const s0 = compSim(Object.assign({}, o, {mo: 0}), months).bal;
    const s1 = compSim(Object.assign({}, o, {mo: 1}), months).bal;
    o.mo = goal > s0 && s1 > s0 ? (goal - s0) / (s1 - s0) : 0;
    sim = compSim(o, months);
  } else if (mode === 'years'){
    sim = compSim(Object.assign({}, o, {goal}), 1200);
    reached = sim.bal >= goal && goal > 0;
    months = sim.months;
  } else sim = compSim(o, months);
  const yrsUsed = months / 12;
  const bal = sim.bal, dep = sim.dep, gain = bal - dep;
  const ear = Math.pow(1 + (o.rate - o.fee) / 100 / o.f, o.f) - 1;
  const rows = [];
  if (mode !== 'final') rows.push([t('r_goal'), M(goal)]);
  if (mode === 'dep') rows.push([t('r_needDep'), M(o.mo, 2), 'key']);
  if (mode === 'years') rows.push([t('r_needYears'), reached ? fmtDur(months) : t('r_notReach'), 'key']);
  rows.push([t('r_deposited'), M(dep)], [t('r_intEarned'), M(gain)], [t('r_final'), M(bal), 'key'],
            [t('r_intShare'), PC(bal > 0 ? gain / bal * 100 : NaN)], [t('r_ear'), PC(ear * 100)]);
  if (o.fee > 0){
    rows.push([t('r_netRate'), PC(o.rate - o.fee)]);
    const noFee = compSim(Object.assign({}, o, {fee: 0}), months).bal;
    rows.push([t('r_feeLost'), M(noFee - bal)]);
  }
  let base = bal;
  if (tax > 0 && gain > 0){ base = dep + gain * (1 - tax); rows.push([t('r_netAfterTax'), M(base)]); }
  if (infl > 0) rows.push([t('r_real'), M(base / Math.pow(1 + infl, yrsUsed))]);
  const heroMap = {
    final: {label: t('r_final'), value: M(bal), sub: t('r_intEarned') + ': ' + M(gain)},
    dep: {label: t('r_needDep'), value: M(o.mo, 2), sub: t('r_goal') + ': ' + M(goal)},
    years: {label: t('r_needYears'), value: reached ? fmtDur(months) : '—', sub: reached ? t('r_goal') + ': ' + M(goal) : t('r_notReach')}
  };
  const Y = sim.hist;
  return {
    hero: heroMap[mode], rows,
    chart: {
      title: t('c_growth'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_deposits'), cls:'c-ink', values: Y.map(y => y.dep)}, {name: t('l_interest'), cls:'c-accent', values: Y.map(y => Math.max(0, y.int))}],
      labels: Y.map(y => y.y)
    },
    table: {
      title: t('t_yearly'),
      head: [t('w_year'), t('h_deposited'), t('l_interest'), t('w_total')],
      rows: Y.map(y => [y.y, M(y.dep), M(y.int), M(y.bal)])
    }
  };
}
/* --- return --- */
const fvOf = (A, D, R, M) => {
  const i = Math.pow(1 + R, 1 / 12) - 1;
  return Math.abs(i) < 1e-12 ? A + D * M : A * Math.pow(1 + i, M) + D * (Math.pow(1 + i, M) - 1) / i;
};
function solveRate(A, D, B, M){
  let lo = -0.99, hi = 20;
  for (let k = 0; k < 120; k++){ const mid = (lo + hi) / 2; if (fvOf(A, D, mid, M) < B) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function calcYield(){
  const mode = $('#y_mode').value;
  const A = Math.max(0, v('y_start')), D = Math.max(0, v('y_dep'));
  const tax = clamp(v('y_tax'), 0, 100) / 100, infl = v('y_infl') / 100;
  let B = Math.max(0, v('y_end')), R = v('y_rate') / 100;
  let M = v('y_years') * ($('#y_unit').value === 'y' ? 12 : 1);
  if (!(A + D > 0) || (mode !== 'years' && !(M > 0))) return {hero:{label: t('r_avgAnnual'), value:'—'}, rows:[[t('r_invalidY'), '—']]};
  let ok = true;
  if (mode === 'rate') R = solveRate(A, D, B, M);
  else if (mode === 'end') B = fvOf(A, D, R, M);
  else {
    ok = false;
    for (let m = 1; m <= 1200; m++){ if (fvOf(A, D, R, m) >= B){ M = m; ok = true; break; } }
    if (!ok) M = 0;
  }
  const put = A + D * M, gain = B - put;
  const netGain = gain > 0 ? gain * (1 - tax) : gain, Bn = put + netGain;
  const Rn = M > 0 ? solveRate(A, D, Bn, M) : 0;
  const rows = [];
  rows.push([t('r_yPut'), M_(put)], [t('r_yEnd'), M_(B), 'key'], [t('r_gainLoss'), M_(gain)],
            [t('r_totReturn'), PC(put > 0 ? gain / put * 100 : NaN)]);
  if (mode !== 'rate') rows.push([t('r_avgAnnual'), PC(R * 100)]);
  if (mode !== 'years' && M > 0) rows.push([t('r_yYears'), fmtDur(Math.round(M))]);
  if (tax > 0) rows.push([t('r_gainNet'), M_(netGain)], [t('r_annNet'), PC(Rn * 100)]);
  if (infl > 0) rows.push([t('r_annReal'), PC(((1 + Rn) / (1 + infl) - 1) * 100)], [t('r_realFinal'), M_(Bn / Math.pow(1 + infl, M / 12))]);
  if (R > 0) rows.push([t('r_double'), `${N(Math.log(2) / Math.log(1 + R), 1)} ${t('w_years')}`]);
  if (D > 0) rows.push([t('r_xirrNote'), '']);
  const hero = {
    rate: {label: t('r_avgAnnual'), value: PC(R * 100), sub: t('r_totReturn') + ': ' + PC(put > 0 ? gain / put * 100 : NaN)},
    end: {label: t('r_yEnd'), value: M_(B), sub: t('r_gainLoss') + ': ' + M_(gain)},
    years: {label: t('r_yYears'), value: ok ? fmtDur(Math.round(M)) : '—', sub: ok ? t('r_yEnd') + ': ' + M_(B) : t('r_notReach')}
  }[mode];
  return {hero, rows};
}
function M_(x){ return M(x); }

function calcDividends(){

  const R = [];
  let sh = shares0, cum = 0;
  for (let i = 0; i < years; i++){
    const d = dps * Math.pow(1 + g, i), gross = sh * d, net = gross * (1 - tax);
    const pEnd = price * Math.pow(1 + pg, i + 1);
    const shStart = sh;
    if (drip) sh += pEnd > 0 ? net / pEnd : 0; else cum += net;
    R.push({i: i + 1, shStart, gross, net, pEnd, cum, value: sh * pEnd, sh});

  rows.push([t('r_shares'), N(last.sh, 2)], [t('r_portfolio'), M(last.value + last.cum), 'key']);
  if (isFinite(tr)) rows.push([t('r_annualTotal'), PC(tr * 100)]);
  return {

      labels: R.map(r => r.i)
    },
    table: {

      rows: R.map(r => [r.i, N(r.shStart, 2), M(r.pEnd, 2), M(r.net), M(r.value), M(r.cum)])
    }
  };

const pmtOf = (amt, rate, n) => { const r = rate / 1200; return n <= 0 ? 0 : r === 0 ? amt / n : amt * r / (1 - Math.pow(1 + r, -n)); };
const mRate = pct => Math.pow(1 + pct / 100, 1 / 12) - 1;

const bracketTax = (price, br) => { let prev = 0, tot = 0; const parts = br.map(([lim, r]) => { const a = Math.max(0, Math.min(price, lim) - prev); prev = lim; tot += a * r; return {a, r, tax: a * r}; }); return {tot, parts}; };

/* --- severance --- */
const SEV_CEIL = 13750;
function calcSeverance(){
  const sal = Math.max(0, v('sv_sal')), yrs = Math.max(0, v('sv_years')), other = Math.max(0, v('sv_other'));
  const pts = pointsOf('q'), entitled = $('#sv_why').value === 'yes';
  const owed = entitled ? sal * yrs : 0;
  const exempt = Math.min(owed, Math.min(sal, SEV_CEIL) * yrs), taxable = owed - exempt;
  const base = incTaxOf(other, pts);
  const taxNo = incTaxOf(other + taxable, pts) - base;
  const N = clamp(Math.ceil(yrs), 1, 6);
  const taxSp = N * (incTaxOf(other + taxable / N, pts) - base);
  const tax = Math.min(taxNo, taxSp);
  const net = owed - tax;
  return {
    hero: {label: t('r_svNet'), value: MI(net), sub: t('r_svTaxLine', {n: MI(tax)})},
    rows: [
      [t('r_svOwed'), MI(owed)], [t('r_svCeil'), MI(SEV_CEIL)], [t('r_svExempt'), MI(exempt)], [t('r_svTaxable'), MI(taxable)],
      [t('r_svTaxNo'), MI(taxNo)], [t('r_svSpreadYrs'), N], [t('r_svTaxSp'), MI(taxSp)],
      [t('r_svTax'), MI(tax), 'key'], [t('r_svNet'), MI(net), 'key'], [t('r_effTax'), PC(owed > 0 ? tax / owed * 100 : NaN)],
      [t('r_points'), ptsTxt('q', pts)]

}

/* --- vacation, recuperation, sick --- */
const HAV_RATE = 451.5;
const havDays = y => y <= 1 ? 5 : y <= 3 ? 6 : y <= 10 ? 7 : y <= 15 ? 8 : y <= 19 ? 9 : 10;
function calcLeave(){

  const bal = Math.max(0, carry + accrued - used);
  const vacVal = bal * daily;
  const yrs = Math.max(1, Math.floor(v('lv_yrs'))), hd = havDays(yrs), scope = clamp(v('lv_scope'), 0, 100) / 100;
  const hav = hd * HAV_RATE * (mo / 12) * scope;
  const havLeft = Math.max(0, hav - Math.max(0, v('lv_hpaid')));
  const tmo = Math.max(0, v('lv_tmo')), sick = Math.min(90, 1.5 * tmo);
  return {

/* --- land appreciation tax --- */
function calcLandTax(){
  const sell = Math.max(0, v('lt_sell')), buy = Math.max(0, v('lt_buy')), bexp = Math.max(0, v('lt_bexp')), sexp = Math.max(0, v('lt_sexp'));
  const impr = Math.max(0, v('lt_impr')), cpi = Math.max(0, v('lt_cpi')), ex = $('#lt_exempt').value === '1';
  const ceil = Math.max(0, v('lt_ceil')), other = Math.max(0, v('lt_other'));
  const cost = buy + bexp + impr;
  const nom = sell - sexp - cost;
  const infl = nom > 0 ? Math.min(nom, cost * cpi / 100) : 0;
  const real = Math.max(0, nom - infl);
  const share = ex ? (sell <= ceil ? 0 : (sell - ceil) / sell) : 1;
  const taxable = real * share;
  const tax = taxable * 0.25;
  const a = surtaxOf(other + taxable, taxable), z = surtaxOf(other, 0);
  const sur = a.s3 - z.s3 + a.s2;
  const total = tax + sur;
  const net = sell - sexp - total;
  return {
    hero: {label: t('r_ltTax'), value: MI(total), sub: t('r_netProceeds') + ': ' + MI(net)},
    rows: [
      [t('r_ltNom'), MI(nom)], [t('r_inflPart'), MI(-infl)], [t('r_ltReal'), MI(real)],
      [t('r_ltExempt'), ex ? PC((1 - share) * 100) : t('r_na')], [t('r_taxableGain'), MI(taxable)],

      [t('r_ltTax'), MI(total), 'key'], [t('r_netProceeds'), MI(net), 'key'], [t('r_effTax'), PC(nom > 0 ? total / nom * 100 : NaN)]

}

/* --- loan comparison --- */
function aprOf(net, pay, n){
  let lo = 0, hi = 1;
  for (let i = 0; i < 90; i++){
    const mid = (lo + hi) / 2;
    const pv = mid === 0 ? pay * n : pay * (1 - Math.pow(1 + mid, -n)) / mid;
    if (pv > net) lo = mid; else hi = mid;
  }
  return (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100;
}
function loanCmpSide(p){
  const amt = Math.max(0, v(`lc_${p}amt`)), rate = Math.max(0, v(`lc_${p}rate`)), n = Math.max(1, Math.round(v(`lc_${p}yrs`) * 12));
  const up = Math.max(0, v(`lc_${p}fee`)) + amt * Math.max(0, v(`lc_${p}pct`)) / 100, mf = Math.max(0, v(`lc_${p}mon`));
  const pm = pmtOf(amt, rate, n);
  const total = (pm + mf) * n + up;
  return {amt, n, pm, mf, up, total, int: pm * n - amt, apr: amt - up > 0 ? aprOf(amt - up, pm + mf, n) : NaN};
}
function calcLoanCmp(){
  const A = loanCmpSide('a'), B = loanCmpSide('b');
  const best = A.total <= B.total ? 'A' : 'B', diff = Math.abs(A.total - B.total);
  const row = (k, f) => [t(k), f(A), f(B)];
  return {
    hero: {label: t('r_lcBest', {x: best}), value: M(diff), sub: t('r_lcSub', {a: PC(A.apr), b: PC(B.apr)})},
    rows: [[t('r_lcBest', {x: best}), M(diff), 'key'], [t('r_lcAprA'), PC(A.apr)], [t('r_lcAprB'), PC(B.apr)]],
    note: t('n_lc'),
    table: {
      title: t('t_compare'), open: true, head: ['', t('w_optA'), t('w_optB')],
      rows: [row('r_lcPmt', s => M(s.pm + s.mf)), row('r_lcInt', s => M(s.int)), row('r_lcUp', s => M(s.up)), row('r_lcTotal', s => M(s.total)), row('r_lcApr', s => PC(s.apr))]
    }
  };
}

/* --- prepay vs invest --- */
function calcPrepay(){

  const p0 = pmtOf(bal, rate, n), p1 = pmtOf(bal - lump, rate, n), save = p0 - p1;

/* --- savings goal --- */
function calcSaveGoal(){
  const mode = $('#sg_mode').value, goal = Math.max(0, v('sg_goal')), now = Math.max(0, v('sg_now')), rate = v('sg_rate'), infl = Math.max(0, v('sg_infl'));
  const rm = mRate(rate);
  let n, dep;
  if (mode === 'dep'){
    n = Math.max(1, Math.round(v('sg_years') * 12));
    const g = Math.pow(1 + rm, n);
    dep = Math.max(0, rm === 0 ? (goal - now) / n : (goal - now * g) * rm / (g - 1));
  } else {
    dep = Math.max(0, v('sg_dep'));
    if (now >= goal) n = 0;
    else if (rm === 0) n = dep > 0 ? Math.ceil((goal - now) / dep) : NaN;
    else if (dep <= 0 && now <= 0) n = NaN;
    else n = Math.min(1200, Math.ceil(Math.log((goal * rm + dep) / (now * rm + dep)) / Math.log(1 + rm)));
  }
  if (!isFinite(n)) return {hero: {label: t('r_sgDep'), value: '—'}, rows: [], note: t('n_sg')};
  let b = now; const Y = [];
  for (let m = 1; m <= n; m++){
    b = b * (1 + rm) + dep;
    if (m % 12 === 0 || m === n) Y.push({y: Math.ceil(m / 12), bal: b, dep: now + dep * m});
  }
  const total = now + dep * n;
  const real = goal / Math.pow(1 + infl / 100, n / 12);
  return {
    hero: mode === 'dep' ? {label: t('r_sgDep'), value: M(dep), sub: t('r_sgTotal', {n: M(total)})} : {label: t('r_sgTime'), value: fmtDur(n), sub: t('r_sgTotal', {n: M(total)})},

      labels: Y.map(y => y.y)},
    table: {title: t('t_yearly'), head: [t('w_year'), t('h_value')], rows: Y.map(y => [y.y, M(y.bal)])}
  };
}

/* --- retirement --- */
function calcRetire(){
  const age = v('rt_age'), ret = Math.max(age, v('rt_ret')), life = Math.max(ret + 1, v('rt_life'));
  const have = Math.max(0, v('rt_have')), dep = Math.max(0, v('rt_dep')), r1 = v('rt_r1'), r2 = v('rt_r2');
  const need = Math.max(0, v('rt_need')), other = Math.max(0, v('rt_other')), infl = Math.max(0, v('rt_infl'));
  const y = ret - age, n = Math.round(y * 12), m = Math.round((life - ret) * 12);
  const rm = mRate(r1);
  const fv = have * Math.pow(1 + rm, n) + fvAnn(dep, rm, n);
  const f = Math.pow(1 + infl / 100, y);
  const gapM = Math.max(0, need - other);
  const needNom = gapM * f;
  const rr = (1 + r2 / 100) / (1 + infl / 100) - 1, rrm = Math.pow(1 + rr, 1 / 12) - 1;
  const fac = rrm === 0 ? m : (1 - Math.pow(1 + rrm, -m)) / rrm;
  const K = needNom * fac;
  const sust = fv / fac / f;
  const lack = Math.max(0, K - fv);
  const g = Math.pow(1 + rm, n);
  const extra = lack > 0 && n > 0 ? (rm === 0 ? lack / n : lack * rm / (g - 1)) : 0;
  return {
    hero: {label: t('r_rtSust'), value: M(sust + other), sub: t('r_rtTarget', {n: M(need)})},
    rows: [
      [t('r_rtYears'), N(y, 1)], [t('r_rtFv'), M(fv)], [t('r_rtNeedCap'), M(K)], [t('r_rtGap'), M(lack), 'key'],
      [t('r_rtExtra'), M(extra), 'key'], [t('r_rtSust'), M(sust + other)], [t('r_rtNeedNom'), M(needNom)],
      [t('r_rtDur'), N(life - ret, 1)]
    ],
    warn: lack > 0 ? [t('w_rtLack')] : [],
    warnOk: lack <= 0,
    note: t('n_rt')
  };
}

/* --- credit card --- */
function calcCredit(){

  const pct = Math.max(0, v('cc_minPct')) / 100, floor = Math.max(0, v('cc_floor')), fix = Math.max(0, v('cc_pay'));
  let bal = bal0, m = 0, paid = 0, int = 0, stuck = false;
  const Y = [];
  while (bal > 0.005 && m < 1200){
    m++;
    const i = bal * apr / 1200;
    let pay = mode === 'min' ? Math.max(floor, bal * pct + i) : fix;
    pay = Math.min(pay, bal + i);
    if (pay <= i + 0.005 && bal + i > pay){ stuck = true; break; }
    int += i; bal = bal + i - pay; paid += pay;
    if (m % 12 === 0) Y.push([m / 12, M(Math.max(0, bal))]);
  }
  if (stuck) return {hero: {label: t('r_ccMonths'), value: '—'}, rows: [[t('r_ccMonths'), '—']], warn: [t('w_ccStuck')], note: t('n_cc')};
  return {

/* --- rent vs buy --- */
function calcRentBuy(){
  const price = Math.max(0, v('rb_price')), down = clamp(v('rb_down'), 0, price), rate = Math.max(0, v('rb_rate'));
  const term = Math.max(1, Math.round(v('rb_yrs') * 12)), g = v('rb_g'), rent0 = Math.max(0, v('rb_rent')), rg = v('rb_rg');
  const ret = v('rb_ret'), hz = clamp(Math.round(v('rb_hz') * 12), 1, 600), cost = Math.max(0, v('rb_cost')) / 100, sellC = Math.max(0, v('rb_sell')) / 100, maint = Math.max(0, v('rb_maint')) / 100;
  const loan = price - down, pm = pmtOf(loan, rate, term), r = rate / 1200, gm = mRate(g), rm = mRate(ret);
  let bal = loan, val = price, invB = 0, invR = down + price * cost;
  const Y = [];
  for (let k = 0; k < hz; k++){
    const int = bal * r; const pr = k < term ? Math.min(bal, pm - int) : 0;
    const pay = k < term ? pm : 0;
    bal -= pr; val *= 1 + gm;
    const buyCost = pay + val * maint / 12;
    const rent = rent0 * Math.pow(1 + rg / 100, Math.floor(k / 12));
    const d = buyCost - rent;
    invB *= 1 + rm; invR *= 1 + rm;
    if (d > 0) invR += d; else invB += -d;
    if ((k + 1) % 12 === 0 || k === hz - 1){
      const wb = val - bal - val * sellC + invB;
      Y.push([Math.ceil((k + 1) / 12), M(wb), M(invR), M(wb - invR)]);
    }
  }
  const wBuy = val - bal - val * sellC + invB, wRent = invR, diff = wBuy - wRent;
  return {
    hero: {label: diff >= 0 ? t('r_rbBuy') : t('r_rbRent'), value: M(Math.abs(diff)), sub: t('r_rbSub', {y: N(hz / 12, hz % 12 ? 1 : 0)})},
    rows: [
      [t('r_rbPmt'), M(pm)], [t('r_rbValue'), M(val)], [t('r_rbBal'), M(bal)],
      [t('r_rbWBuy'), M(wBuy), 'key'], [t('r_rbWRent'), M(wRent), 'key'], [t('r_rbDiff'), M(diff)]
    ],
    note: t('n_rb'),
    table: {title: t('t_yearly'), head: [t('w_year'), t('r_rbWBuy'), t('r_rbWRent'), t('r_rbDiff')], rows: Y}
  };
}

/* --- car lease vs buy --- */
function calcCar(){

  const resale = price * clamp(v('cl_resale'), 0, 100) / 100, brun = Math.max(0, v('cl_brun')), lrun = Math.max(0, v('cl_lrun'));
  const lm = Math.max(0, v('cl_lm')), lup = Math.max(0, v('cl_lup')), opp = v('cl_opp'), yrs = n / 12;
  const pm = pmtOf(price - down, rate, n);
  const og = x => x * (Math.pow(1 + opp / 100, yrs) - 1);
  const buy = down + pm * n + brun * yrs - resale + og(down);
  const lease = lup + lm * n + lrun * yrs + og(lup);
  const diff = lease - buy;
  return {
    hero: {label: diff > 0 ? t('r_clBuy') : t('r_clLease'), value: M(Math.abs(diff)), sub: t('r_clSub')},
    rows: [
      [t('r_clPmt'), M(pm)], [t('r_clBuyTot'), M(buy), 'key'], [t('r_clLeaseTot'), M(lease), 'key'],

}

  if (mode === 'eq'){

  };
}

/* ================= from minus to financial freedom ================= */
const STAGE_KEYS = ['st_minus', 'st_debts', 'st_em', 'st_invest', 'st_free'];

/* --- personal balance sheet --- */
function calcNetWorth(){
  const g = id => Math.max(0, v(id));
  const A = {cash: g('nw_cash'), inv: g('nw_inv'), pen: g('nw_pen'), prop: g('nw_prop'), oth: g('nw_oa')};
  const Lb = {mort: g('nw_mort'), loan: g('nw_loan'), card: g('nw_card'), oth: g('nw_ol')};
  const ta = Object.values(A).reduce((a, b) => a + b, 0), tl = Object.values(Lb).reduce((a, b) => a + b, 0);
  const nw = ta - tl;
  const inc = g('nw_inc'), exp = g('nw_exp'), save = inc - exp;
  const liquid = A.cash + A.inv, bad = Lb.loan + Lb.card + Lb.oth;
  const runway = exp > 0 ? A.cash / exp : NaN;
  const passive = A.inv * 0.04 / 12;
  const stage = nw < 0 ? 0 : bad > 0 ? 1 : (exp > 0 && A.cash < exp * 3) ? 2 : (exp > 0 && passive < exp) ? 3 : 4;
  return {
    hero: {label: t('r_nwNet'), value: M(nw), sub: t('r_nwStage', {s: t(STAGE_KEYS[stage])})},
    rows: [
      [t('r_nwAssets'), M(ta)], [t('r_nwLiab'), M(tl)], [t('r_nwNet'), M(nw), 'key'],
      [t('r_nwLiquid'), M(liquid - bad)], [t('r_nwDebtRatio'), PC(ta > 0 ? tl / ta * 100 : NaN)],
      [t('r_nwSave'), M(save)], [t('r_nwSaveRate'), PC(inc > 0 ? save / inc * 100 : NaN)],
      [t('r_nwRunway'), isFinite(runway) ? N(runway, 1) : '—'], [t('r_nwPassive'), M(passive)],
      [t('r_nwStageRow'), t(STAGE_KEYS[stage]), 'key']
    ],
    warn: nw < 0 ? [t('w_nwMinus')] : [], warnOk: false,
    note: t('n_nw'),
    split: ta > 0 ? {title: t('r_nwAssets'), items: [
      {name: t('o_nwCash'), v: A.cash, cls:'c-ink', fmt: M(A.cash)}, {name: t('o_nwInv'), v: A.inv, cls:'c-accent', fmt: M(A.inv)},
      {name: t('o_nwPen'), v: A.pen, cls:'c-soft', fmt: M(A.pen)}, {name: t('o_nwProp'), v: A.prop, cls:'c-warm', fmt: M(A.prop)}]} : undefined
  };
}

/* --- debt payoff plan --- */
function debtSim(method, extra){
  const D = [1, 2, 3, 4].map(i => ({i, bal: Math.max(0, v(`dp_b${i}`)), r: Math.max(0, v(`dp_r${i}`)) / 1200, min: Math.max(0, v(`dp_m${i}`)), done: 0})).filter(d => d.bal > 0);
  let m = 0, int = 0; const order = [];
  while (D.some(d => d.bal > 0.005) && m < 1200){
    m++;
    D.forEach(d => { if (d.bal > 0){ const i = d.bal * d.r; d.bal += i; int += i; } });
    let pool = extra;
    D.forEach(d => { if (d.bal > 0){ const p = Math.min(d.min, d.bal); d.bal -= p; } else pool += d.min; });
    if (method !== 'min'){
      const act = D.filter(d => d.bal > 0.005).sort((a, b) => method === 'ava' ? b.r - a.r : a.bal - b.bal);
      for (const d of act){ if (pool <= 0) break; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; }
    }
    D.forEach(d => { if (d.bal <= 0.005 && !d.done){ d.done = m; order.push(d.i); } });
  }
  return {m, int, order, left: D.reduce((a, d) => a + Math.max(0, d.bal), 0), total: D.reduce((a, d) => a + 0, 0)};
}
function calcDebtPlan(){
  const extra = Math.max(0, v('dp_extra')), method = $('#dp_method').value;
  const total = [1, 2, 3, 4].reduce((a, i) => a + Math.max(0, v(`dp_b${i}`)), 0);
  const res = {ava: debtSim('ava', extra), snow: debtSim('snow', extra), min: debtSim('min', 0)};
  const sel = res[method];
  const stuck = sel.left > 0.5;
  const nm = k => ({ava: t('o_dpAva'), snow: t('o_dpSnow'), min: t('o_dpMin')})[k];
  const d1 = new Date(); d1.setMonth(d1.getMonth() + sel.m);
  const when = new Intl.DateTimeFormat(locOf(), {year:'numeric', month:'long'}).format(d1);
  const saved = res.min.left > 0.5 ? NaN : res.min.int - sel.int;
  return {
    hero: stuck ? {label: t('r_dpTime'), value: '—', sub: t('w_dpStuck')} : {label: t('r_dpTime'), value: fmtDur(sel.m), sub: t('r_dpWhen', {d: when})},
    rows: [
      [t('r_dpTotal'), M(total)], [t('r_dpTime'), stuck ? '—' : fmtDur(sel.m), 'key'], [t('r_dpInt'), M(sel.int)],
      [t('r_dpSaved'), isFinite(saved) ? M(saved) : t('r_na')], [t('r_dpOrder'), sel.order.map(i => '#' + i).join(' → ') || '—']
    ],
    warn: stuck ? [t('w_dpStuck')] : [],
    note: t('n_dp'),
    table: {title: t('t_compare'), open: true, head: [t('f_dpMethod'), t('r_dpTime'), t('r_dpInt')],
      rows: ['ava', 'snow', 'min'].map(k => [nm(k), res[k].left > 0.5 ? '—' : fmtDur(res[k].m), M(res[k].int)])}
  };
}

/* --- FIRE --- */
function calcFire(){
  const age = v('fi_age'), exp = Math.max(0, v('fi_exp')), have = Math.max(0, v('fi_have')), dep = Math.max(0, v('fi_dep'));
  const r = v('fi_ret'), infl = Math.max(0, v('fi_infl')), wd = Math.max(0.5, v('fi_wd'));
  const rm = mRate(r), im = mRate(infl);
  const todayNum = exp * 12 / (wd / 100);
  let bal = have, m = 0, reached = bal >= todayNum;
  while (!reached && m < 1200){
    m++; bal = bal * (1 + rm) + dep * Math.pow(1 + im, 0);
    if (bal >= todayNum * Math.pow(1 + im, m / 12)) reached = true;
  }
  const yrs = m / 12, target = todayNum * Math.pow(1 + im, yrs);
  const coastAt = 65, cy = Math.max(0, coastAt - age);
  const coast = todayNum * Math.pow(1 + im, cy) / Math.pow(1 + rm, cy * 12);
  const alt = [3, 3.5, 4, 5].map(w => [PC(w), M(exp * 12 / (w / 100))]);
  return {
    hero: reached ? {label: t('r_fiYears'), value: fmtDur(m), sub: t('r_fiAge', {a: N(age + yrs, 1)})} : {label: t('r_fiYears'), value: '—', sub: t('w_fiFar')},
    rows: [
      [t('r_fiNum'), M(todayNum), 'key'], [t('r_fiNumNom'), reached ? M(target) : '—'], [t('r_fiIncome'), M(exp)],
      [t('r_fiYears'), reached ? fmtDur(m) : '—', 'key'], [t('r_fiProgress'), PC(todayNum > 0 ? Math.min(100, have / todayNum * 100) : NaN)],
      [t('r_fiCoast'), M(coast)], [t('r_fiCoastHave'), have >= coast ? t('o_yes') : t('o_no')]
    ],
    warn: reached ? [] : [t('w_fiFar')],
    note: t('n_fi'),
    table: {title: t('t_fiAlt'), head: [t('f_fiWd'), t('r_fiNum')], rows: alt}
  };
}

/* --- roadmap --- */
function calcFreedom(){
  const inc = Math.max(0, v('fr_inc')), exp = Math.max(0, v('fr_exp')), s0 = inc - exp;
  let debt = Math.max(0, v('fr_debt')), dr = Math.max(0, v('fr_drate')) / 1200, assets = Math.max(0, v('fr_assets'));
  const emT = Math.max(0, v('fr_em')) * exp, ret = v('fr_ret'), wd = Math.max(0.5, v('fr_wd')), raise = Math.max(0, v('fr_raise'));
  const rm = mRate(ret), fiT = exp * 12 / (wd / 100);
  const start = assets - debt;
  const st = {debt: debt <= 0 ? 0 : null, em: null, fi: null};
  if (s0 <= 0) return {hero: {label: t('r_frTime'), value: '—', sub: t('w_frNoSurplus')}, rows: [[t('r_frSurplus'), M(s0)], [t('r_frStart'), M(start)]], warn: [t('w_frNoSurplus')], note: t('n_fr')};
  let m = 0; const Y = [[0, M(start)]];
  while (m < 960 && st.fi === null){
    m++;
    const s = s0 * Math.pow(1 + raise / 100, Math.floor((m - 1) / 12));
    assets *= 1 + rm;
    let pool = s;
    if (debt > 0){
      debt += debt * dr; const p = Math.min(debt, pool); debt -= p; pool -= p;
      if (debt <= 0.005){ debt = 0; if (st.debt === null) st.debt = m; }
    }
    assets += pool;
    if (debt <= 0 && st.em === null && assets >= emT) st.em = m;
    if (debt <= 0 && assets >= fiT) st.fi = m;
    if (m % 12 === 0) Y.push([m / 12, M(assets - debt)]);
  }
  if (st.debt === 0 && st.em === null && assets >= emT) st.em = 0;
  if (st.em === null && st.fi !== null) st.em = Math.min(st.fi, st.debt || 0);
  const done = st.fi !== null;
  const fiDate = new Date(); fiDate.setMonth(fiDate.getMonth() + (st.fi || 0));
  const when = new Intl.DateTimeFormat(locOf(), {year:'numeric', month:'long'}).format(fiDate);
  const f = x => x === null ? '—' : x === 0 ? t('r_frNow') : fmtDur(x);
  return {
    hero: done ? {label: t('r_frTime'), value: fmtDur(st.fi), sub: t('r_frWhen', {d: when})} : {label: t('r_frTime'), value: '—', sub: t('w_frFar')},
    rows: [
      [t('r_frStart'), M(start), 'key'], [t('r_frSurplus'), M(s0)], [t('r_frS1'), f(st.debt)], [t('r_frS2'), f(st.em)], [t('r_frS3'), done ? fmtDur(st.fi) : '—', 'key'],
      [t('r_frEmT'), M(emT)], [t('r_frFiT'), M(fiT)]
    ],
    warn: done ? [] : [t('w_frFar')],
    note: t('n_fr'),
    table: {title: t('t_frYears'), head: [t('w_year'), t('r_nwNet')], rows: Y.slice(0, 41)}
  };
}

/* --- inflation (Israeli CPI) --- */
/* Annual change in Israel's consumer price index, % (source: inflationtool.com, from CBS CPI data).
   2026: change since the start of the year up to August 2026 (CBS release of 15.9.2026). */
const INFL_IL = {1990:18.11,1991:17.77,1992:9.76,1993:10.78,1994:14.36,1995:7.87,1996:10.85,1997:7.12,1998:8.64,1999:1.22,
  2000:0,2001:1.36,2002:6.71,2003:-1.96,2004:1.28,2005:2.39,2006:-0.14,2007:3.16,2008:4,2009:3.85,2010:2.72,2011:2.16,2012:1.53,
  2013:1.97,2014:-0.23,2015:-0.91,2016:-0.23,2017:0.35,2018:0.8,2019:0.57,2020:-0.68,2021:2.85,2022:5.32,2023:2.95,2024:3.17,2025:2.68,2026:2.1};
const INFL_Y0 = 1989, INFL_Y1 = 2026;
function calcInflation(){
  const mode = $('#in_mode').value, amt = Math.max(0, v('in_amt'));
  const warn = [];
  if (mode === 'past'){
    let y0 = Math.round(v('in_from')), y1 = Math.round(v('in_to'));
    if (!(y0 >= INFL_Y0 && y0 <= INFL_Y1) || !(y1 >= INFL_Y0 && y1 <= INFL_Y1)) warn.push(t('w_inRange', {a: INFL_Y0, b: INFL_Y1}));
    y0 = clamp(y0 || 2010, INFL_Y0, INFL_Y1); y1 = clamp(y1 || INFL_Y1, INFL_Y0, INFL_Y1);
    const back = y1 < y0, lo = Math.min(y0, y1), hi = Math.max(y0, y1);
    let f = 1; const Y = [{y: lo, f: 1, r: null}];
    for (let y = lo + 1; y <= hi; y++){ f *= 1 + INFL_IL[y] / 100; Y.push({y, f, r: INFL_IL[y]}); }
    const fac = back ? 1 / f : f, out = amt * fac, n = hi - lo;
    const avg = n > 0 ? (Math.pow(f, 1 / n) - 1) * 100 : 0;
    return {
      hero: {label: t('r_inEq', {a: M(amt), y0, y1}), value: M(out, 2), sub: t('r_inCum') + ': ' + PC((f - 1) * 100) + ' (' + lo + '–' + hi + ')'},
      rows: [
        [t('r_inEq', {a: M(amt), y0, y1}), M(out, 2), 'key'],
        [t('r_inCum'), PC((f - 1) * 100)],
        [t('r_inAvg'), PC(avg)],
        [t('r_inPower', {a: M(amt), y: hi, y0: lo}), M(amt / f, 2)],
        [t('r_inLost'), PC((1 - 1 / f) * 100)]
      ],
      warn: warn.length ? warn : null, note: t('n_inPast') + (hi === 2026 ? ' ' + t('w_in2026', {m: monthName(MKT.cpiYtdTo), v: PC(MKT.cpiYtd)}) : ''),
      chart: {title: t('c_inPrice', {a: M(amt), y: lo}), unit: t('w_year'), fmt: x => M(x),
        layers: [{name: t('l_inBase'), cls:'c-ink', values: Y.map(() => amt)}, {name: t('l_inAdd'), cls:'c-accent', values: Y.map(r => Math.max(0, amt * r.f - amt))}],
        labels: Y.map(r => r.y)},
      table: {title: t('t_inYears'), head: [t('w_year'), t('h_inYr'), t('h_inValue', {a: M(amt), y: lo})],
        rows: Y.map(r => [r.y + (r.y === 2026 ? '*' : ''), r.r == null ? '—' : PC(r.r), M(amt * r.f, 2)])}
    };
  }
  const n = clamp(Math.round(v('in_years')), 1, 60), i = v('in_rate') / 100;
  if (mode === 'future'){
    const Y = []; for (let y = 0; y <= n; y++) Y.push({y, p: amt * Math.pow(1 + i, y)});
    const fut = amt * Math.pow(1 + i, n), real = amt / Math.pow(1 + i, n);
    return {
      hero: {label: t('r_inFut', {a: M(amt), n}), value: M(fut, 2), sub: t('r_inReal', {n}) + ': ' + M(real, 2)},
      rows: [[t('r_inFut', {a: M(amt), n}), M(fut, 2), 'key'], [t('r_inReal', {n}), M(real, 2)], [t('r_inLost'), PC((1 - real / Math.max(amt, 1e-9)) * 100)],
             [t('r_inCum'), PC((Math.pow(1 + i, n) - 1) * 100)]],
      note: t('n_inFuture'),
      chart: {title: t('c_inFuture'), unit: t('w_year'), fmt: x => M(x),
        layers: [{name: t('l_inBase'), cls:'c-ink', values: Y.map(() => amt)}, {name: t('l_inAdd'), cls:'c-accent', values: Y.map(r => Math.max(0, r.p - amt))}],
        labels: Y.map(r => r.y)},
      table: {title: t('t_yearly'), head: [t('w_year'), t('h_inCost'), t('h_inReal')], rows: Y.map(r => [r.y, M(r.p, 2), M(amt * amt / r.p || 0, 2)])}
    };
  }
  const r = v('in_nom') / 100, rr = (1 + r) / (1 + i) - 1;
  const Y = []; for (let y = 0; y <= n; y++){ const nom = amt * Math.pow(1 + r, y); Y.push({y, nom, real: nom / Math.pow(1 + i, y)}); }
  const last = Y[Y.length - 1];
  return {
    hero: {label: t('r_inRR'), value: PC(rr * 100), sub: t('r_inRealEnd', {n}) + ': ' + M(last.real)},
    rows: [[t('r_inRR'), PC(rr * 100), 'key'], [t('r_inNomEnd', {n}), M(last.nom)], [t('r_inRealEnd', {n}), M(last.real), 'key'],
           [t('r_inRealGain'), M(last.real - amt)], [t('r_inEaten'), M(last.nom - last.real)]],
    warn: rr < 0 ? [t('w_inNeg')] : null, warnOk: rr >= 0 ? t('ok_inPos') : null, note: t('n_inReal'),
    chart: {title: t('c_inReal'), unit: t('w_year'), fmt: x => M(x),
      layers: [{name: t('l_inRealV'), cls:'c-ink', values: Y.map(y => y.real)}, {name: t('l_inEaten'), cls:'c-accent', values: Y.map(y => Math.max(0, y.nom - y.real))}],
      labels: Y.map(y => y.y)},
    table: {title: t('t_yearly'), head: [t('w_year'), t('h_inNom'), t('h_inReal')], rows: Y.map(y => [y.y, M(y.nom), M(y.real)])}
  };
}

/* --- interest & prime (Israel: prime = Bank of Israel rate + 1.5%) --- */
const PRIME_SPREAD = 1.5;
function calcPrime(){
  const mode = $('#pr_mode').value, amt = Math.max(0, v('pr_amt'));
  const boi = Math.max(0, v('pr_boi')), prime = boi + PRIME_SPREAD, margin = v('pr_margin');
  const base = Math.max(0, prime + margin);
  const sgn = x => (x >= 0 ? '+' : '−') + N(Math.abs(x), null, 2) + '%';
  const rateTxt = t('r_prRateIs', {p: PC(prime), m: sgn(margin), r: PC(base)});
  if (mode === 'loan'){
    const n = clamp(Math.round(v('pr_years') * 12), 1, 600), eq = $('#pr_method').value === 'equal';
    const dR = v('pr_dRate'), dAt = clamp(Math.round(v('pr_dAt') * 12), 0, n);
    let bal = amt, pay = 0, first = 0, after = null, totI = 0, curR = -1;
    const Y = []; let yI = 0, yP = 0, yPay = 0;
    for (let m = 1; m <= n && bal > 1e-6; m++){
      const r = Math.max(0, base + (dR && m > dAt ? dR : 0));
      if (r !== curR){ curR = r; if (!eq) pay = pmtOf(bal, r, n - m + 1); if (m > 1 && after == null) after = eq ? amt / n + bal * r / 1200 : pay; }
      const it = bal * r / 1200, pr = eq ? Math.min(bal, amt / n) : Math.min(bal, pay - it);
      const p = it + pr; if (m === 1) first = p;
      bal -= pr; totI += it; yI += it; yP += pr; yPay += p;
      if (m % 12 === 0 || m === n){ Y.push({y: Math.ceil(m / 12), i: yI, p: yP, pay: yPay, bal: Math.max(0, bal), r}); yI = 0; yP = 0; yPay = 0; }
    }
    const at = d => eq ? amt / n + amt * Math.max(0, base + d) / 1200 : pmtOf(amt, Math.max(0, base + d), n);
    const rows = [[t('f_prBoi'), PC(boi)], [t('r_prPrime'), PC(prime)], [t('r_prYour'), PC(base), 'key'],
      [t(eq ? 'r_prFirstEq' : 'r_prPay'), M(first, 2), 'key']];
    if (after != null) rows.push([t('r_prAfter', {d: sgn(dR), y: fmtDur(dAt)}), M(after, 2)]);
    rows.push([t('r_prTotI'), M(totI)], [t('r_prTot'), M(amt + totI)],
      [t('r_prUp'), M(at(1), 2)], [t('r_prDown'), M(at(-1), 2)]);
    return {
      hero: {label: t(eq ? 'r_prFirstEq' : 'r_prPay'), value: M(first, 2), sub: rateTxt},
      rows, note: t('n_prLoan'),
      warn: base <= 0 ? [t('w_prZero')] : null,
      chart: {title: t('c_prYear'), unit: t('w_year'), fmt: x => M(x),
        layers: [{name: t('l_principal'), cls:'c-ink', values: Y.map(y => y.p)}, {name: t('l_interest'), cls:'c-accent', values: Y.map(y => y.i)}],
        labels: Y.map(y => y.y)},
      table: {title: t('t_yearly'), head: [t('w_year'), t('h_prRate'), t('h_prPaid'), t('l_interest'), t('h_prBal')],
        rows: Y.map(y => [y.y, PC(y.r), M(y.pay), M(y.i), M(y.bal)])}
    };
  }
  if (mode === 'overdraft'){
    const days = clamp(Math.round(v('pr_days')), 1, 3650);
    const day = amt * base / 100 / 365, cost = day * days;
    return {
      hero: {label: t('r_prOdCost', {d: days}), value: M(cost, 2), sub: rateTxt},
      rows: [[t('r_prPrime'), PC(prime)], [t('r_prYour'), PC(base), 'key'], [t('r_prOdCost', {d: days}), M(cost, 2), 'key'],
             [t('r_prOdDay'), M(day, 2)], [t('r_prOdMonth'), M(day * 30, 2)], [t('r_prOdYear'), M(day * 365)]],
      note: t('n_prOd')
    };
  }
  if (mode === 'deposit'){
    const mo = clamp(Math.round(v('pr_months')), 1, 600), tax = clamp(v('pr_tax'), 0, 100) / 100, comp = $('#pr_comp').value === 'm';
    const Y = []; let b = amt;
    for (let m = 1; m <= mo; m++){
      b = comp ? b * (1 + base / 1200) : amt * (1 + base / 1200 * m);
      if (m % 12 === 0 || m === mo) Y.push({m, g: b - amt});
    }
    const gross = b - amt, tx = Math.max(0, gross) * tax, net = gross - tx;
    const eff = amt > 0 ? (Math.pow(1 + gross / amt, 12 / mo) - 1) * 100 : NaN;
    return {
      hero: {label: t('r_prNet'), value: M(net, 2), sub: rateTxt},
      rows: [[t('r_prYour'), PC(base)], [t('r_prGross'), M(gross, 2)], [t('r_prTax'), M(-tx, 2)], [t('r_prNet'), M(net, 2), 'key'],
             [t('r_prEnd'), M(amt + net, 2), 'key'], [t('r_prEff'), PC(eff)]],
      note: t('n_prDep'),
      chart: {title: t('c_prDep'), unit: t('w_month'), fmt: x => M(x),
        layers: [{name: t('l_inBase'), cls:'c-ink', values: Y.map(() => amt)}, {name: t('l_interest'), cls:'c-accent', values: Y.map(y => Math.max(0, y.g))}],
        labels: Y.map(y => y.m)}
    };
  }

/* ---- account: username + strong password, data encrypted at rest ---- */
const accKey = n => 'fin-acc:' + ENC_NAME(n);
const encName = n => 'fin-enc:' + ENC_NAME(n);
const pwChecks = p => ({len: p.length >= 8, up: /[A-Z]/.test(p), sp: /[^A-Za-z0-9\s]/.test(p)});

async function sealMap(name, rawB64, map){

  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(map)));

/* unlock = decrypt stored data into the per-tab working copy, then start the session */
async function unlockSession(name, pw, rec, seed){
  if (!rec.esalt) rec.esalt = b64(rnd(16));

  const sfx = ':' + ENC_NAME(name);
  let map = {};
  try {
    const blob = JSON.parse(RAWLS.getItem(encName(name)) || 'null');
    if (blob){
      const key = await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt']);
      map = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(blob.iv)}, key, u8(blob.ct))));
    }
  } catch (e) { map = {}; }
  DATA_KEYS.forEach(k => { const old = RAWLS.getItem(k + sfx); if (old != null){ if (map[k] == null) map[k] = old; RAWLS.removeItem(k + sfx); } });
  Object.keys(seed || {}).forEach(k => { if (DATA_KEYS.includes(k)) map[k] = String(seed[k]); });
  RAWLS.setItem(accKey(name), JSON.stringify(rec));
  await sealMap(name, raw, map);
  Object.keys(map).forEach(k => SS.setItem('w:' + k + sfx, map[k]));

function fxDay(u){ try { return new Intl.DateTimeFormat(locOf(), {day:'numeric', month:'numeric', timeZone:'Asia/Jerusalem'}).format(new Date(u * 1000)); } catch (e) { return ''; } }
function applyDbRates(d){
  if (!d || SET.boiDb === '0') return;
  let changed = false;
  const asOf = +d.asOf || 0;
  if (d.usd && typeof d.usd === 'object' && asOf > 0 && (asOf >= (META.unix || 0) || !META.live)){
    let n = 0;
    Object.keys(d.usd).forEach(k => {
      const v = +d.usd[k], old = RATES[k];
      if (!/^[A-Z]{3}$/.test(k) || !(v > 0)) return;
      if ((k === 'ILS' || k === 'JOD') ? SET.src_boiFx === '0' : SET.src_ecb === '0') return;
      if (old && (v / old < 0.5 || v / old > 2)) return;      // reject implausible jumps
      RATES[k] = v; n++;
    });
    if (n){ RATES.USD = 1; META.unix = asOf; META.official = true; META.live = false; changed = true; }
  }
  const cAsOf = +d.cryptoAsOf || 0;
  if (d.crypto && typeof d.crypto === 'object' && cAsOf > (META.cunix || 0)){
    let n = 0;
    Object.keys(d.crypto).forEach(k => {
      const v = +d.crypto[k], old = RATES[k];
      if (!CRYPTO[k] || !(v > 0)) return;
      if (old && (v / old < 0.2 || v / old > 5)) return;
      RATES[k] = v; n++;
    });
    if (n){ META.cunix = cAsOf; changed = true; }
  }
  if (changed){ fillCurSelects(); calc(tab); renderStamp(); }
}

var fxTimer = null, fxFails = 0, fxOkAt = 0, fxBusy = false, fxCalcAt = 0;

function fxStatus(key, p){ fxKey = key || ''; fxP = p || null; $$('#fx_st, .fx-st').forEach(s => { s.textContent = key ? t(key, p) : ''; }); if (tab === 'settings') liveStRender(); }
async function fxTick(){
  fxTimer = null;
  if (SET.liveFx !== '1' || (SET.liveFiat === '0' && SET.liveCrypto === '0')) return;
  if (document.hidden){ return; }                       // resumes on visibilitychange
  if (navigator.onLine === false){ fxStatus('fx_offline'); fxTimer = setTimeout(fxTick, 5000); return; }
  if (fxBusy){ fxTimer = setTimeout(fxTick, 1000); return; }
  fxBusy = true; let ok = false;
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(to);
    if (r.ok){
      const j = await r.json(), rt = j && j.data && j.data.rates;
      if (rt){
        let n = 0, nc = 0;
        Object.keys(rt).forEach(k => {
          const v = parseFloat(rt[k]), old = RATES[k];
          if (!(v > 0) || !old) return;
          const q = v / old, cr = !!CRYPTO[k];
          if (cr ? SET.liveCrypto === '0' : SET.liveFiat === '0') return;
          if (cr ? (q < 0.5 || q > 2) : (q < 0.8 || q > 1.25)) return;
          RATES[k] = v; if (cr) nc++; else n++;
        });
        if (n + nc > 0){
          ok = true; RATES.USD = 1;
          const now = Math.floor(Date.now() / 1000);
          if (n){ META.live = true; META.official = false; META.unix = now; }
          if (nc){ META.cryptoLive = true; META.cunix = now; }
        }
      }
    }
  } catch (e) { /* blocked or offline */ }
  fxBusy = false;
  if (ok){
    fxFails = 0; fxOkAt = Date.now();
    fxStatus('fx_on', {n: t('o_fx' + (SET.fxInt || '1'))});
    lastAt = new Date(); lastOk = true; renderStamp();
    if (tab === 'home') renderMarket();
    else if (tab === 'convert') calc(tab);
    else if (Date.now() - fxCalcAt > 15000){ fxCalcAt = Date.now(); calc(tab); }
    fxTimer = setTimeout(fxTick, fxMs());
  } else {
    fxFails++;
    if (fxFails >= 3){ fxStatus('fx_blocked'); fxTimer = setTimeout(fxTick, 60000); }
    else fxTimer = setTimeout(fxTick, 1500);
  }
}
function fxStart(){ if (fxTimer){ clearTimeout(fxTimer); fxTimer = null; } fxFails = 0; if (SET.liveFx === '1'){ fxStatus('fx_conn'); fxTick(); } else fxStatus(''); }

  try {
    const claims = HD.db.collection('claims');
    const hits = await claims.where('handle', '==', name).get();
    if (hits.docs.some(d => d.id !== HD.uid)) return 'taken';
    const cur = await HD.db.doc('claims/' + HD.uid).get();
    const prev = cur.exists ? (cur.data() || {}).handle : '', at = Date.now();
    await HD.db.doc('claims/' + HD.uid).set({handle: name, at});
    const again = await claims.where('handle', '==', name).get();
    const rival = again.docs.find(d => d.id !== HD.uid && (+(d.data() || {}).at < at || (+(d.data() || {}).at === at && d.id < HD.uid)));
    if (rival){ if (prev) await HD.db.doc('claims/' + HD.uid).set({handle: prev, at: Date.now()}); else await HD.db.doc('claims/' + HD.uid).delete(); return 'taken'; }

var GEM_BASE = 'https://generativelanguage.googleapis.com/v1beta/';
var GEM_FALLBACK = ['gemini-flash-latest', 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash'];
var GEM_STOP = ['gk_eKey', 'gk_eRef', 'gk_eOff', 'gk_eGeo', 'blocked'];   // errors another model will not fix
var AI_CLAUDE = false;                 // inside claude.ai the assistant runs on Claude
var GK = {st: '', e: ''};              // result of the last key check
function gemKey(){ return String(SET.gkey || '').replace(/\s+/g, ''); }
function gemClean(msgs){               // Gemini wants user/model turns that alternate, start and end with the user
  const out = [];
  (msgs || []).forEach(m => {
    const role = m.role === 'assistant' || m.role === 'model' ? 'model' : 'user', text = String(m.content || '').trim();
    if (!text) return;
    const last = out[out.length - 1];
    if (last && last.role === role) last.parts[0].text += '\n\n' + text; else out.push({role, parts: [{text}]});
  });
  while (out.length && out[0].role !== 'user') out.shift();
  while (out.length && out[out.length - 1].role !== 'user') out.pop();
  return out;
}
function gemFail(status, j){
  const er = (j && j.error) || {}, msg = String(er.message || ''), why = (er.details || []).map(d => (d && d.reason) || '').join(' ') + ' ' + (er.status || '') + ' ' + msg;
  let c = 'gk_eOther';
  if (/REFERRER|referer/i.test(why)) c = 'gk_eRef';
  else if (/API_KEY_INVALID|API key not valid|API key expired|API_KEY_EXPIRED/i.test(why)) c = 'gk_eKey';
  else if (/SERVICE_DISABLED|has not been used|is disabled/i.test(why)) c = 'gk_eOff';
  else if (status === 429 || /RESOURCE_EXHAUSTED/.test(why)) c = 'gk_eQuota';
  else if (/location is not supported/i.test(why)) c = 'gk_eGeo';
  else if (status === 403 && /PERMISSION_DENIED/.test(why) && !/model/i.test(msg)) c = 'gk_eKey';
  else if (status === 404) c = 'gk_eModel';
  const e = new Error(c); e.gem = msg.slice(0, 160); e.status = status; return e;
}
async function gemCall(model, key, contents, extra){
  let r;
  try {
    r = await fetch(GEM_BASE + 'models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': key}, body: JSON.stringify(Object.assign({contents}, extra || {}))});
  } catch (e) { throw new Error('blocked'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw gemFail(r.status, j);
  const c = ((j && j.candidates) || [])[0] || {};
  const txt = ((c.content || {}).parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!txt){ const e = new Error('gk_eEmpty'); e.gem = c.finishReason || ((j && j.promptFeedback) || {}).blockReason || ''; throw e; }
  return txt;
}
async function gemTry(models, key, contents, extra){
  let last = null;
  for (const m of [...new Set(models.filter(Boolean))]){
    try { const txt = await gemCall(m, key, contents, extra); if (SET.gmodel !== m){ SET.gmodel = m; saveSet(); } return txt; }
    catch (e) { if (GEM_STOP.includes(e.message)) throw e; last = e; }
  }
  throw last || new Error('gk_eOther');
}
async function gemChat(msgs){
  const key = gemKey(); if (!key) throw new Error('noai');
  const contents = gemClean(msgs); if (!contents.length) throw new Error('gk_eEmpty');

}
async function gemModels(key){       // the newest Flash models this key can use
  let r, j = null;
  try { r = await fetch(GEM_BASE + 'models?pageSize=200', {headers: {'x-goog-api-key': key}}); } catch (e) { throw new Error('blocked'); }
  try { j = await r.json(); } catch (e) {}
  if (!r.ok){ const e = gemFail(r.status, j); if (GEM_STOP.includes(e.message)) throw e; return []; }
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)-flash/); return m ? parseFloat(m[1]) : 0; };
  return ((j && j.models) || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => String(m.name || '').replace(/^models\//, ''))
    .filter(n => /^gemini-[\d.]+-flash(-lite)?$/.test(n))
    .sort((a, b) => (/lite/.test(a) - /lite/.test(b)) || ver(b) - ver(a));
}

async function gkApprove(){
  const inp = $('#set_gkey'); if (!inp || GK.st === 'wait') return;

function txChunks(keys, src, max){

function pmEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function pmTerms(e){
  const all = (e[2] + '|' + e[3] + '|' + e[4]).split('|').concat([t('kbt_' + e[0])]);
  return [...new Set(all.map(x => pmNorm(x).trim()).filter(x => x.length >= 3 || /^[a-z]{2,}$/.test(x) && x.length >= 3))];
}
function pmMatchKB(q){
  const n = pmNorm(q), out = [];
  PM_KB.forEach(e => {
    let sc = 0;
    pmTerms(e).forEach(term => {
      const re = new RegExp('(?:^|\\s)(?:[ובהלמשכד]{1,3}|و|ف|ب|ل|ك|ال|وال|بال|لل|فال)?' + pmEsc(term), 'u');
      if (re.test(n)) sc = Math.max(sc, term.length + (term.includes(' ') ? 6 : 0));
    });
    if (sc) out.push([sc, e]);
  });
  return out.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
function pmCalcs(q){
  const words = pmNorm(q).trim().split(' ').filter(w => w.length >= 3 && !PM_STOP.has(w));
  if (!words.length) return [];
  const forms = w => { const f = [w]; if (/^[ובהלמשכ]/.test(w) && w.length >= 4) f.push(w.slice(1)); if (/^(ال|وال|بال)/.test(w) && w.length >= 5) f.push(w.replace(/^(وال|بال|ال)/, '')); return f; };
  const res = [];
  TABS.filter(id => !['home', 'settings', 'assist'].includes(id)).forEach(id => {
    const text = pmNorm(all3('tab_' + id) + ' ' + all3('d_' + id) + ' ' + (GS_SYN[id] || '') + ' ' + t('tab_' + id) + ' ' + t('d_' + id));
    const title = pmNorm(all3('tab_' + id) + ' ' + t('tab_' + id));
    let sc = 0;
    words.forEach(w => { const f = forms(w); if (f.some(x => title.includes(' ' + x) || title.includes(x + ' '))) sc += 3; else if (f.some(x => text.includes(x))) sc += 1; });
    if (sc) res.push([sc, id]);
  });
  return res.sort((a, b) => b[0] - a[0]).filter((x, i, a) => x[0] >= Math.max(2, a[0][0] - 1)).map(x => x[1]);
}
function pmKB(e){ return '**' + t('kbt_' + e[0]) + '**\n' + t('kb_' + e[0]); }
function pmResults(id){
  const r = exResults(id); if (!r) return t('pm_noRes');
  const long = SET.pmStyle === 'long';
  let s = t('pm_resIntro', {c: t('tab_' + id)}) + '\n**' + r.main + '**';
  r.rows.slice(0, long ? 12 : 5).forEach(x => { s += '\n- ' + x; });
  if (r.note) s += '\n\n' + r.note;
  if (r.warn) s += '\n⚠️ ' + r.warn;
  const kb = PM_KB.filter(e => e[1] === id).slice(0, long ? 2 : 1);
  if (kb.length) s += '\n\n' + kb.map(pmKB).join('\n\n');
  if (long) s += '\n\n' + t('pm_tip');
  return s + '\n[[' + id + ']]';
}
function pmAnswer(q){
  const n = pmNorm(q), long = SET.pmStyle === 'long', nm = pmName();
  if (PM_RX.thanks.test(n) && n.trim().split(' ').length <= 4) return t('pm_thanks');
  if (PM_RX.greet.test(n) && n.trim().split(' ').length <= 3) return t('pm_hello', {n: nm});
  if (PM_RX.help.test(n)) return t('pm_help', {n: nm});
  const kb = pmMatchKB(q), calcs = pmCalcs(q);
  if (PM_RX.res.test(n) && kb.length === 0){ const id = calcs[0] || PM_LASTCALC; return id ? pmResults(id) : t('pm_noRes'); }
  const out = [];
  kb.slice(0, long ? 3 : 2).forEach(e => out.push(pmKB(e) + (e[1] ? '\n[[' + e[1] + ']]' : '')));
  const cs = calcs.filter(id => !kb.some(e => e[1] === id)).slice(0, long ? 3 : kb.length ? 1 : 2);
  if (cs.length) out.push((kb.length ? t('pm_alsoCalc') : t('pm_calcFit')) + '\n' + cs.map(id => '[[' + id + ']] ' + t('d_' + id)).join('\n'));
  if (!out.length) return t('pm_unknown') + '\n- ' + t('pm_ex1') + '\n- ' + t('pm_ex2') + '\n- ' + t('pm_ex3');
  if (long) out.push(t('pm_tip'));
  return out.join('\n\n');
}
function exLocal(id, kind, extra){
  const note = '<p class="fine pm-badge">' + asEsc(t('pm_badge', {n: pmName()})) + '</p>';
  if (kind === 'q') return exFmt(pmAnswer(extra).replace(/\[\[([a-z0-9]+)\]\]/g, (_, c) => TABS.includes(c) ? t('tab_' + c) + ' ←' : '')) + note;
  const fs = exFields(id);
  if (kind === 'field'){
    const f = fs.find(x => x.label === extra) || {label: extra, value: '', hint: ''};
    const kb = pmMatchKB(f.label + ' ' + f.hint)[0];
    let s = '**' + f.label + '**' + (f.value ? ' — ' + t('pm_now', {v: f.value}) : '') + (f.hint ? '\n' + f.hint : '');
    if (kb) s += '\n\n' + pmKB(kb);
    return exFmt(s) + note;
  }
  if (kind === 'row'){
    const r = exResults(id), row = r && r.rows.find(x => x.indexOf(extra) === 0);
    const kb = pmMatchKB(extra)[0];
    return exFmt('**' + (row || extra) + '**' + (r && r.note ? '\n\n' + r.note : '') + (kb ? '\n\n' + pmKB(kb) : '')) + note;
  }
  const withHint = fs.filter(f => f.hint).map(f => '- **' + f.label + '**: ' + f.hint).join('\n');
  return exFmt(t('d_' + id) + (withHint ? '\n\n' + withHint : '') + '\n\n' + pmResults(id).replace(/\n?\[\[[a-z0-9]+\]\]/g, '')) + note;
}

var CLOCK_STYLES = ['digital', 'analog', 'calendar', 'minimal', 'off'];
function gem(n){
  const L = [[400, 'ת'], [300, 'ש'], [200, 'ר'], [100, 'ק'], [90, 'צ'], [80, 'פ'], [70, 'ע'], [60, 'ס'], [50, 'נ'], [40, 'מ'], [30, 'ל'], [20, 'כ'], [10, 'י'], [9, 'ט'], [8, 'ח'], [7, 'ז'], [6, 'ו'], [5, 'ה'], [4, 'ד'], [3, 'ג'], [2, 'ב'], [1, 'א']];
  let x = n % 1000, s = '';
  for (const [v, c] of L){ while (x >= v){ if (x === 15){ s += 'טו'; x = 0; break; } if (x === 16){ s += 'טז'; x = 0; break; } s += c; x -= v; } }
  return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
}
function ckLoc(){ const base = {he: 'he-IL', ar: 'ar', en: 'en-GB'}[lang] || lang; return SET.digits === 'latn' ? base + '-u-nu-latn' : base; }

  try {
    if (lang === 'he'){ const p = new Intl.DateTimeFormat('he-u-ca-hebrew', {day: 'numeric', month: 'long', year: 'numeric'}).formatToParts(d); const g = k => (p.find(x => x.type === k) || {}).value;
      return gem(+g('day')) + ' ב' + g('month') + ' ' + gem(+g('year')); }
    return new Intl.DateTimeFormat(ckLoc().replace(/-u-.*/, '') + '-u-ca-hebrew', {day: 'numeric', month: 'long', year: 'numeric'}).format(d);
  } catch (e) { return ''; }
}
function ckHijri(d){ try { return new Intl.DateTimeFormat(ckLoc().replace(/-u-.*/, '') + '-u-ca-islamic-umalqura', {day: 'numeric', month: 'long', year: 'numeric'}).format(d); } catch (e) { return ''; } }
function ckTime(d, sec){ return new Intl.DateTimeFormat(ckLoc(), {hour: '2-digit', minute: '2-digit', second: sec ? '2-digit' : undefined, hour12: SET.clock24 === '0'}).format(d); }

  const L = ckLoc();
  return {
    time: ckTime(d, SET.clockSec === '1'), timeShort: ckTime(d, false),
    weekday: new Intl.DateTimeFormat(L, {weekday: 'long'}).format(d),

}
function ckHTML(style, p){
  if (style === 'analog') return `<div class="ck ck-analog">${ckAnalog(104)}<div class="ck-col"><b class="ck-wd"></b>${ckDates(p, 'ck-dates')}<span class="ck-tm ck-small"></span></div></div>`;
  if (style === 'calendar') return `<div class="ck ck-cal"><div class="ck-page"><span class="ck-mo"></span><b class="ck-day"></b><span class="ck-wd"></span></div><div class="ck-col"><b class="ck-tm ck-big2"></b>${ckDates(p, 'ck-dates')}</div></div>`;
  if (style === 'minimal') return `<div class="ck ck-min"><b class="ck-tm"></b><span class="ck-wd"></span><span class="ck-gs"></span>${p.heb ? '<span class="ck-heb"></span>' : ''}${p.hij ? '<span class="ck-hij"></span>' : ''}</div>`;
  return `<div class="ck ck-dig"><div class="ck-row"><b class="ck-tm ck-big"></b><span class="ck-wd"></span></div>${ckDates(p, 'ck-dates ck-dates-row')}</div>`;
}
function ckFill(root, p, d){
  const set = (sel, v) => $$(sel, root).forEach(e => { if (e.textContent !== v) e.textContent = v; });
  set('.ck-tm', root.closest && root.closest('.cstyles') ? p.timeShort : p.time); set('.ck-wd', p.weekday); set('.ck-greg', p.greg); set('.ck-gs', p.gregShort);
  set('.ck-heb', p.heb); set('.ck-hij', p.hij); set('.ck-day', p.day); set('.ck-mo', p.month);
  const face = $('.ck-face', root);
  if (face){
    const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
    $('.ck-h', face).setAttribute('transform', `rotate(${h * 30 + m / 2} 50 50)`);
    $('.ck-m', face).setAttribute('transform', `rotate(${m * 6 + s / 10} 50 50)`);
    const sh = $('.ck-s', face); sh.style.display = SET.clockSec === '1' ? '' : 'none'; sh.setAttribute('transform', `rotate(${s * 6} 50 50)`);
  }
}
var CK_KEY = '';
function clockRender(){
  const box = $('#hclock'); if (!box) return;
  const style = CLOCK_STYLES.includes(SET.clockStyle) ? SET.clockStyle : 'digital';
  box.hidden = style === 'off';
  const d = new Date(), p = ckParts(d), key = [style, lang, SET.clockHeb, SET.clockHijri, SET.clock24, SET.clockSec, SET.digits].join('|');
  if (style !== 'off'){ if (CK_KEY !== key){ CK_KEY = key; box.innerHTML = ckHTML(style, p); } ckFill(box, p, d); }
  csRender();
}
function csRender(){
  const box = $('#cstyles'); if (!box) return;
  const cur = CLOCK_STYLES.includes(SET.clockStyle) ? SET.clockStyle : 'digital', d = new Date(), p = ckParts(d);
  const key = cur + '|' + lang + '|' + [SET.clockHeb, SET.clockHijri, SET.clock24, SET.digits].join('');
  if (box.dataset.k !== key){
    box.dataset.k = key;
    box.innerHTML = CLOCK_STYLES.map(s => `<button type="button" class="cs-c" role="radio" data-cstyle="${s}" aria-checked="${s === cur}">
      <span class="cs-pv" aria-hidden="true">${s === 'off' ? '<span class="cs-off">—</span>' : ckHTML(s, p)}</span>
      <span class="skin-n">${asEsc(t('cs_' + s))}</span><small>${asEsc(t('cs_' + s + 'S'))}</small></button>`).join('');
  }
  $$('.cs-pv', box).forEach(pv => ckFill(pv, p, d));
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cstyle]'); if (!c) return;
  SET.clockStyle = c.dataset.cstyle; saveSet(); clockRender();
});
document.addEventListener('change', e => { if (/^set_clock|^set_digits$/.test(e.target.id || '')) setTimeout(clockRender, 0); });
setInterval(() => { if (document.hidden) return; if (tab === 'home') clockRender(); else if (tab === 'settings' && SCAT === 'display') csRender(); }, 1000);
const _alCk = applyLang;
applyLang = function(){ const r = _alCk.apply(this, arguments); CK_KEY = ''; const b = $('#cstyles'); if (b) b.dataset.k = ''; clockRender(); return r; };
clockRender();

function ivHost(){ return {he: 'il', ar: 'sa', ru: 'ru', es: 'es', fr: 'fr', de: 'de', it: 'it', 'pt-BR': 'br', 'pt-PT': 'br', tr: 'tr', ja: 'jp', 'zh-CN': 'cn', 'zh-TW': 'hk', ko: 'kr', pl: 'pl', id: 'id', ms: 'my', vi: 'vn', th: 'th', hi: 'in', el: 'gr', sv: 'se', fi: 'fi', nl: 'nl'}[lang] || 'www'; }
