name: Minify test
on:
  push:
    branches: [minify-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: |
          python src/build.py
          cp app.js app.full.js
          npx --yes esbuild@0.24.0 app.full.js --minify --keep-names --charset=utf8 --legal-comments=none --log-level=warning --outfile=app.js
          ls -la app.js app.full.js
          gzip -9 -c app.full.js | wc -c; gzip -9 -c app.js | wc -c
          python scripts/check.py || true
          git config user.name "publish-bot"; git config user.email "publish-bot@users.noreply.github.com"
          git add -f app.js index.html version.json && git commit -m "minify test output" && git push origin HEAD:minify-test
