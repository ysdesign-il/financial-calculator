name: Update car price list

on:
  schedule:
    - cron: '23 3 * * 1'   # weekly; the government price list changes slowly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_cars.py', '.github/workflows/cars.yml']

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch the price list
        run: python scripts/update_cars.py || true
      - name: Commit and publish
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add cars_probe.json
          [ -f cars.json ] && git add cars.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update car price list"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
