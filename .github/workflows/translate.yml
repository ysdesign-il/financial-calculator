name: Translate interface
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['i18n/source.json', 'scripts/translate_ui.py']
permissions:
  contents: write
concurrency:
  group: site-publish
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Translate missing interface texts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_MINUTES: '20'
          PUBLISH: '1'
        run: python scripts/translate_ui.py
      - name: Commit and publish
        run: |
          if [ -z "$(git status --porcelain -- lang i18n/status.json)" ]; then echo "No changes"; exit 0; fi
          git config user.name "translate-bot"
          git config user.email "translate-bot@users.noreply.github.com"
          git add lang i18n/status.json
          git commit -m "Update interface translations"
          git pull --rebase -X theirs origin main || { git rebase --abort; echo 'Could not merge with main'; exit 1; }
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
