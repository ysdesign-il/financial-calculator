name: Security watch
# Unusual activity in the repository becomes an alert in the app's developer mode (and a GitHub issue when serious).
on:
  push:
  create:
  delete:
  fork:
  public:
  branch_protection_rule:
  release:
  schedule:
    - cron: '23 6 * * *'   # daily: who has access
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Look for unusual activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/security_watch.py
