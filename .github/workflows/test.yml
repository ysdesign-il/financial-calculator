name: Check

on:
  pull_request:
  push:
    branches-ignore: [gh-pages]
    paths-ignore: ['rates.json', 'history.json', 'cars.json']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the page
        run: python scripts/check.py
      - name: Smoke test in a real browser
        run: |
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/smoke.js
