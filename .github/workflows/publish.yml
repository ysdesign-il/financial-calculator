name: Build and publish

on:
  push:
    branches: [main]
    paths: ['src/**', 'devcode.json', 'srcpref.json', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build when the source changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || git diff --name-only "$BEFORE" HEAD | grep -q '^src/'; then
            python src/build.py
          fi
      - name: Commit and publish
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add index.html app.js version.json tp
          git diff --cached --quiet || git commit -m "Build site"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
