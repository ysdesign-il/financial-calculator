name: Update rates

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (market indices); official data changes only when published
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_rates.py', '.github/workflows/rates.yml']

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official rates
        run: python scripts/update_rates.py
      - name: Commit and publish
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          [ -f diag.json ] && git add diag.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update rates"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
