name: Update rates

on:
  schedule:
    - cron: '17 */2 * * *'   # every two hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official rates
        run: python scripts/update_rates.py
      - name: Commit and publish
        run: |
          if git diff --quiet -- rates.json; then echo "No changes"; exit 0; fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git commit -m "Update rates"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
