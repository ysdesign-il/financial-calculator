name: Update rates

on:
  schedule:
    - cron: '7 1,5,9,13,17,21 * * *'   # 6 times a day (every 4 hours); live quotes are read in the browser
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_rates.py', '.github/workflows/rates.yml']

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch official rates
        run: python scripts/update_rates.py
      - name: Commit and publish
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json; for f in history.json inbox.json replies.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update rates"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
