name: CodeQL
# Looks for security problems in the source (JavaScript, Python and the workflows themselves).
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/**', 'sw.js', 'enhancements.js']
  schedule:
    - cron: '17 4 * * 1'   # weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - index.html
              - app.js
              - lang
              - i18n
              - '*.json'
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:${{ matrix.language }}"
