name: Inbox

on:
  schedule:
    - cron: '*/5 * * * *'   # messages from the website reach the developer's inbox within minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect messages
        run: python scripts/inbox_pull.py
      - name: Commit and publish
        run: |
          [ -f inbox.json ] || { echo "No messages"; exit 0; }
          git config user.name "inbox-bot"
          git config user.email "inbox-bot@users.noreply.github.com"
          git add inbox.json
          git diff --cached --quiet && { echo "No new messages"; exit 0; }
          git commit -m "Inbox"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
