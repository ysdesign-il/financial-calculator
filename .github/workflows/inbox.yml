name: Inbox

on:
  schedule:
    - cron: '12 * * * *'   # hourly: messages from the website reach the developer's inbox within an hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Collect messages
        run: python scripts/inbox_pull.py
      - name: Commit and publish
        run: |
          [ -f inbox.json ] || [ -f replies.json ] || { echo "No messages"; exit 0; }
          git config user.name "inbox-bot"
          git config user.email "inbox-bot@users.noreply.github.com"
          for f in inbox.json replies.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "No new messages"; exit 0; }
          git commit -m "Inbox"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
